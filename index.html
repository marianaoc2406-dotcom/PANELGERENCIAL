// ─── ÁRBOL RECURSIVO ─────────────────────────────────────
function arbolHTML() {
  if(D.ct.length === 0) return `<div class="emp">Sin contratos registrados.<br><br><button class="btn bgr" onclick="openCt(null)" style="margin-top:8px">+ Agregar contrato</button></div>`;
  let html = '';

  // Raíces = IAs (sin pid). Cada IA agrupa sus derivados.
  const raices = D.ct.filter(c => !c.pid);
  raices.forEach(ct => { html += nodeHTML(ct, 0); });
  return html;
}

function levelCls(n) { return ['l0','l1','l2','l3'][Math.min(n,3)]; }

function nodeHTML(c, lvl) {
  const ch = kids(c.id);
  const e  = status(c);
  const nac = D.ac.filter(a => a.cid == c.id).length;
  const nap = D.cta.filter(a => a.cid == c.id).length;
  const tid = 'tr_'+c.id;
  return `<div class="tn">
    <div class="th2 ${levelCls(lvl)}" onclick="toggleTree('${tid}', this)">
      <span class="tarr" style="${ch.length?'transform:rotate(90deg)':''}">${ch.length?'▶':''}</span>
      <span class="tnum">${c.num}</span>
      <span class="tobj" title="${c.obj}">${c.obj}</span>
      <div class="tmeta">
        ${c.tipo ? `<span style="font-size:10px;color:var(--mu2);background:var(--sf2);padding:1px 6px;border-radius:3px">${c.tipo}</span>` : ''}
        ${badge(e.cls, e.lbl)}
        ${nac ? badge('bp', nac+' act.') : ''}
        ${nap ? badge('bi', nap+' apoyo(s)') : ''}
        ${c.tipo !== 'interadministrativo' ? (function(){
          const sv = c.svid ? D.sv.find(s=>s.id==c.svid) : null;
          const nombre = sv ? sv.nombre.split(' ').slice(0,2).join(' ') : '';
          return sv
            ? `<span style="display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--mu2);background:var(--sf2);padding:2px 8px;border-radius:10px;border:1px solid var(--bd)"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>${nombre}</span>`
            : `<span style="font-size:10px;color:var(--am);background:var(--am-d);padding:1px 7px;border-radius:10px;border:1px solid rgba(217,119,6,.2)">Sin supervisor</span>`;
        })() : ''}
        <button class="btn sm bgh" onclick="event.stopPropagation();verCt(${c.id})">Ver</button>
        <button class="btn sm bbl" onclick="event.stopPropagation();openCt(${c.id})">+ Derivado</button>
        ${c.trackingMode !== 'pct' && c.tipo !== 'interadministrativo' && c.tipo !== 'interventoria' ? `<button class="btn sm bpu" onclick="event.stopPropagation();ganttModal(${c.id})">Gantt</button>` : ''}
      </div>
    </div>
    ${ch.length ? `<div class="tch" id="${tid}">${ch.map(h => nodeHTML(h, lvl+1)).join('')}</div>` : ''}
  </div>`;
}

function toggleTree(id, hdr) {
  const el = $(id); if(!el) return;
  const arr = hdr.querySelector('.tarr');
  const open = !el.classList.contains('closed');
  el.classList.toggle('closed', open);
  if(arr) arr.style.transform = open ? '' : 'rotate(90deg)';
}

// ─── TABLA CONTRATOS ─────────────────────────────────────
function rowCt(c, lvl) {
  lvl = lvl || 0;
  const sv    = svEfectivo(c);
  const e     = status(c);
  const ns    = D.ct.filter(x => x.pid == c.id).length;
  const np    = D.pr.filter(p => p.cid == c.id).length;
  const na    = D.ad.filter(a => a.cid == c.id).length;
  const real  = pctReal(c.id);
  const est   = pctEst2(c, today());
  const sem   = semaforo(real, est);
  const indent = lvl * 22;
  const isChild = lvl > 0;
  return `<tr style="${isChild ? 'background:var(--sf2)' : ''}">
    <td style="padding-left:${12+indent}px">
      ${isChild ? `<span style="display:inline-block;width:10px;height:10px;border-left:2px solid var(--bd);border-bottom:2px solid var(--bd);margin-right:6px;vertical-align:middle;margin-bottom:2px;border-radius:0 0 0 3px"></span>` : ''}
      <span style="font-weight:${isChild?'400':'600'};font-size:${isChild?'12':'12.5'}px">${c.num}</span>
      <div style="display:flex;gap:3px;margin-top:2px">
        ${np ? `<span class="b bi" style="font-size:9px">${np}P</span>` : ''}
        ${na ? `<span class="b" style="font-size:9px;background:var(--am-d);color:var(--am-t)">${na}A</span>` : ''}
      </div>
    </td>
    <td style="font-size:11px;color:var(--mu2)">${c.tipo||'—'}</td>
    <td class="oc" style="font-size:${isChild?'12':'12.5'}px">${c.obj}</td>
    <td><div style="display:flex;align-items:center;gap:7px">
      ${sv ? avatarHTML(sv.foto, sv.nombre, 32) : ''}
      <span style="font-size:11px;color:var(--mu2)">${sv ? sv.nombre : '—'}</span>
    </div></td>
    <td class="mc">${cop(c.valor)}</td>
    <td class="dc">${(() => { const fr = fechaFinReal(c) || c.fend; return fr && fr !== c.fend
      ? `<span title="Prorrogado — fin contractual: ${fmt(c.fend)}">${fmt(fr)} <span style="font-size:9px;color:var(--bl)">▲P</span></span>`
      : fmt(c.fend); })()}</td>
    <td style="text-align:center">
      <span style="font-size:12px;font-weight:700;color:${sem.color}">${real}%</span>
    </td>
    <td>${badge(e.cls, e.lbl)}</td>
    <td style="vertical-align:middle"><div style="display:flex;gap:4px">
      <button class="btn sm bgh" onclick="verCt(${c.id})">Ver</button>
      <button class="btn sm brd" onclick="delCt(${c.id})">×</button>
    </div></td>
  </tr>`;
}

function rowCtTree(c, lvl) {
  lvl = lvl || 0;
  let rows = rowCt(c, lvl);
  D.ct.filter(x => x.pid == c.id).forEach(function(child) {
    rows += rowCtTree(child, lvl + 1);
  });
  return rows;
}


let fcFilter = 'all';
function setFc(btn, f) {
  fcFilter = f;
  document.querySelectorAll('.fc').forEach(b => { b.style.color=''; b.style.borderColor=''; b.classList.remove('on'); });
  btn.style.color = 'var(--gr)'; btn.style.borderColor = 'var(--gr)'; btn.classList.add('on');
  filterCt('');
}
function filterCt(q) {
  const body = $('ctBody'); if(!body) return;
  if(!q && fcFilter === 'all') {
    // Modo árbol: mostrar todos con indentación
    const roots = D.ct.filter(c => !c.pid);
    body.innerHTML = roots.length ? roots.map(c => rowCtTree(c, 0)).join('') :
      `<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--mu)">Sin contratos</td></tr>`;
    return;
  }
  // Modo búsqueda/filtro: lista plana de todos
  let list = D.ct.slice();
  if(fcFilter === 'act')  list = list.filter(c => ['bg','bi'].includes(status(c).cls));
  if(fcFilter === 'warn') list = list.filter(c => status(c).cls === 'bw');
  if(fcFilter === 'exp')  list = list.filter(c => status(c).cls === 'br');
  if(fcFilter === 'liq')  list = list.filter(c => c.estado === 'liquidacion' || c.estado === 'suspendido');
  if(fcFilter === 'done') list = list.filter(c => c.estado === 'liquidado' || c.estado === 'terminado');
  if(q) list = list.filter(c => (c.num+c.obj+(c.contratista||'')+(c.contratante||'')).toLowerCase().includes(q.toLowerCase()));
  body.innerHTML = list.length
    ? list.map(c => rowCt(c, 0)).join('')
    : `<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--mu)">Sin resultados</td></tr>`;
}

// Colores por nivel de actividad
const ACT_COLORS = ['#C8232A','#1e6fb0','#1a8a4a','#c07a20','#5c4fb5'];

function actColor(lvl) { return ACT_COLORS[Math.min(lvl, ACT_COLORS.length-1)]; }

// Obtener subactividades directas
function actKids(pid, cid) { return D.ac.filter(a => a.cid == cid && String(a.pid) === String(pid)); }

// Calcular % ponderado de un nodo (promedia hijos si los tiene)
function computeReal(ac, cid) {
  const ch = actKids(ac.id, cid);
  if(ch.length === 0) return clamp(Number(ac.pr||0), 0, 100);
  return Math.round(ch.reduce((s,h) => s + computeReal(h, cid), 0) / ch.length);
}

function computeEst(ac, cid, cut) {
  const ch = actKids(ac.id, cid);
  if(ch.length === 0) return pctEst(ac, cut);
  return Math.round(ch.reduce((s,h) => s + computeEst(h, cid, cut), 0) / ch.length);
}

// Fechas mínimas/máximas del árbol entero para escalar la barra


// Supervisor efectivo: propio si tiene, si no hereda del padre
function svEfectivo(c) {
  // Supervisor propio del contrato (funciona para raíz y derivados)
  if(c.svid) return D.sv.find(s => s.id == c.svid) || null;
  // Si es derivado sin supervisor asignado, mostrar el del padre como referencia (sin heredad funcional)
  if(c.pid) {
    const padre = D.ct.find(x => x.id == c.pid);
    if(padre && padre.svid) return D.sv.find(s => s.id == padre.svid) || null;
  }
  if(c.pid) {
    const padre = D.ct.find(x => x.id == c.pid);
    if(padre) return svEfectivo(padre);
  }
  return null;
}



// ── ALERTAS DE PÓLIZAS ───────────────────────────────────────
function polizasAlerta(cid) {
  // Retorna array de pólizas que vencen en <= 30 días
  const td = today();
  return D.pl.filter(p => {
    if(p.cid != cid || !p.ffin) return false;
    const diff = Math.ceil((new Date(p.ffin+'T00:00:00') - new Date(td+'T00:00:00')) / 86400000);
    return diff >= 0 && diff <= 30;
  });
}

function polizasVencidas(cid) {
  const td = today();
  return D.pl.filter(p => {
    if(p.cid != cid || !p.ffin) return false;
    return Math.ceil((new Date(p.ffin+'T00:00:00') - new Date(td+'T00:00:00')) / 86400000) < 0;
  });
}

function todasPolizasAlerta() {
  // Para dashboard: todos los contratos con pólizas por vencer
  const td = today();
  return D.pl.filter(p => {
    if(!p.ffin) return false;
    const diff = Math.ceil((new Date(p.ffin+'T00:00:00') - new Date(td+'T00:00:00')) / 86400000);
    return diff >= 0 && diff <= 30;
  });
}

// ── SUSPENSIONES ─────────────────────────────────────────────
function diasSuspendidos(cid) {
  // Suma días de todas las suspensiones (cerradas o activas hasta hoy)
  const td = today();
  return D.su.filter(s => s.cid == cid).reduce((total, s) => {
    const ini  = new Date(s.finicio+'T00:00:00');
    const fin  = s.freinicio ? new Date(s.freinicio+'T00:00:00') : new Date(td+'T00:00:00');
    const dias = Math.max(0, Math.ceil((fin - ini) / 86400000));
    return total + dias;
  }, 0);
}

function fechaFinReal(c) {
  // Fecha fin VIGENTE = fecha fin contractual + prórrogas.
  // Las suspensiones / reinicios NO modifican la fecha de terminación:
  // solo se registran como días de tiempo detenido (ver diasSuspendidos).
  if(!c.fend) return null;
  let fin = new Date(c.fend+'T00:00:00');
  // Tomar la prórroga con la mayor nueva fecha fin
  D.pr.filter(p => p.cid == c.id && p.nfin).forEach(p => {
    const d = new Date(p.nfin+'T00:00:00');
    if(d > fin) fin = d;
  });
  return isoDateLocal(fin);
}

// Fecha fin solo de referencia: qué pasaría si los días suspendidos
// se reconocieran como plazo adicional (informativo, no se usa en estados)
function fechaFinConSusp(c) {
  const base = fechaFinReal(c);
  if(!base) return null;
  const ds = diasSuspendidos(c.id);
  if(!ds) return base;
  return isoDateLocal(new Date(new Date(base+'T00:00:00').getTime() + ds * 86400000));
}

function suspActiva(cid) {
  // Retorna la suspensión activa (sin freinicio) si existe
  return D.su.find(s => s.cid == cid && !s.freinicio) || null;
}

// ── GANTT HELPERS ────────────────────────────────────────────
function ganttDateRange(cid) {
  const acts = D.ac.filter(a => a.cid == cid);
  if(!acts.length) return null;
  const dates = acts.flatMap(a => [a.fstart, a.fend]).filter(Boolean);
  if(!dates.length) return null;
  const minMs = Math.min(...dates.map(d => new Date(d+'T00:00:00').getTime()));
  const maxMs = Math.max(...dates.map(d => new Date(d+'T00:00:00').getTime()));
  return { minMs, maxMs };
}

function buildGanttPanel(cid, c, td, prefix) {
  const allActs = D.ac.filter(a => a.cid == cid);
  const roots   = allActs.filter(a => !a.pid);
  const range   = ganttDateRange(cid);
  const e       = status(c);
  const ae = roots.length && range
    ? Math.round(roots.reduce((s,a) => s + computeEst(a, cid, td), 0) / roots.length) : 0;
  const ar = roots.length
    ? Math.round(roots.reduce((s,a) => s + computeReal(a, cid), 0) / roots.length) : 0;
  const dif = ar - ae;
  const totalValorActs = allActs.reduce((s,a) => s + Number(a.valor||0), 0);
  const valorCtrato = Number(c.valor||0) + D.ad.filter(a => a.cid==cid).reduce((s,a) => s+Number(a.valor||0), 0);

  return `<div class="panel">
    <div class="ph">
      <div class="ptitle">${c.num} · ${c.obj.substring(0,55)}</div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        ${badge(e.cls, e.lbl)}
        <button class="pact" onclick="openActH(${cid},null)">+ Actividad raíz</button>
      </div>
    </div>
    <div class="pb">
      <div class="gsum">
        <div class="gsc"><div class="gsv">${allActs.length}</div><div class="gsl">Actividades</div></div>
        <div class="gsc"><div class="gsv sm" style="color:var(--bl);font-size:13px">${cop(totalValorActs)}</div><div class="gsl">Valor programado</div></div>
        ${valorCtrato ? `<div class="gsc"><div class="gsv sm" style="color:${totalValorActs>valorCtrato?'var(--accent)':'var(--mu2)'};font-size:13px">${cop(valorCtrato-totalValorActs)}</div><div class="gsl">Sin programar</div></div>` : ''}
        <div class="gsc"><div class="gsv" style="color:var(--mu2)" id="${prefix}_ae_${cid}">${ae}%</div><div class="gsl">Estimado</div></div>
        <div class="gsc"><div class="gsv" style="color:var(--gr)" id="${prefix}_ar_${cid}">${ar}%</div><div class="gsl">Real</div></div>
        <div class="gsc"><div class="gsv" style="color:${dif>=0?'var(--gr)':'var(--accent)'}" id="${prefix}_dif_${cid}">${dif>=0?'+':''}${dif}%</div><div class="gsl">Diferencia</div></div>
      </div>
      <div class="cdr">
        <label>Fecha de corte</label>
        <input type="date" id="${prefix}_cut_${cid}" value="${td}" onchange="recalcGantt('${prefix}',${cid})">
        <span style="font-size:11px;color:var(--am);margin-left:6px">▲ línea naranja = fecha de corte</span>
      </div>
      <div id="${prefix}_tbl_${cid}">${buildGanttTable(cid, td, prefix)}</div>
    </div>
  </div>`;
}

// ── UTILS ────────────────────────────────────────────────────────────────────
function msToDay(ms) { return Math.floor(ms / 86400000); }
function strToDay(s) { return s ? msToDay(new Date(s+'T00:00:00').getTime()) : null; }
function dayToMs(d)  { return d * 86400000; }

// Normalizar pred: acepta [id] o [{id,tipo,lag}] → siempre [{id,tipo,lag}]
function normPred(pred) {
  if(!pred || !pred.length) return [];
  return pred.map(function(p) {
    if(typeof p === 'object' && p !== null) return { id: Number(p.id), tipo: p.tipo||'FI', lag: Number(p.lag||0) };
    return { id: Number(p), tipo: 'FI', lag: 0 };
  });
}

// Añadir días hábiles (simple: todos los días por ahora)
function addDays(dayNum, n) { return dayNum + n; }

// ── CPM EXTENDIDO — soporta FI/II/FF/IF + lag ────────────────────────────────
function computeCPM(cid) {
  var acts = D.ac.filter(function(a){ return a.cid==cid; });
  if(!acts.length) return {};

  var map = {};
  acts.forEach(function(a) {
    var s = strToDay(a.fstart), e = strToDay(a.fend);
    var dur = (s!==null&&e!==null) ? Math.max(1, e-s+1) : 1;
    // Restrict: no iniciar antes de constraint date
    var constraintDay = a.constraint_date ? strToDay(a.constraint_date) : null;
    var constraintType = a.constraint_type || 'ASAP'; // ASAP, ALAP, MSO, MFO, SNET, FNLT
    map[a.id] = {
      id: a.id, dur: dur,
      ES: s||0, EF: (s||0)+dur-1,
      LS: 0, LF: 0, float: 0,
      critical: false,
      pred: normPred(a.pred),
      constraintDay: constraintDay,
      constraintType: constraintType
    };
  });

  // ── Forward pass ──────────────────────────────────────────────────────────
  var maxIter = acts.length * 2 + 4;
  for(var iter=0; iter<maxIter; iter++) {
    acts.forEach(function(a) {
      var node = map[a.id];
      var minES = node.ES; // base: fecha real de inicio de la actividad

      node.pred.forEach(function(p) {
        var pn = map[p.id]; if(!pn) return;
        var lag = p.lag || 0;
        var constraint;
        switch(p.tipo) {
          case 'FI': constraint = pn.EF + 1 + lag; break; // Fin → Inicio
          case 'II': constraint = pn.ES + lag;     break; // Inicio → Inicio
          case 'FF': // Fin → Fin: sucesor termina lag días después que pred
            var neededES = pn.EF + lag - node.dur + 1;
            constraint = neededES; break;
          case 'IF': // Inicio → Fin (raro): sucesor termina lag días después del inicio del pred
            constraint = pn.ES + lag - node.dur + 1; break;
          default:   constraint = pn.EF + 1 + lag;
        }
        minES = Math.max(minES, constraint);
      });

      // Aplicar restricciones de fecha
      if(node.constraintType === 'SNET' && node.constraintDay !== null) { // No iniciar antes de
        minES = Math.max(minES, node.constraintDay);
      }
      if(node.constraintType === 'MSO' && node.constraintDay !== null) { // Debe iniciar en
        minES = node.constraintDay;
      }

      node.ES = minES;
      node.EF = node.ES + node.dur - 1;

      // Restricción "No terminar después de"
      if(node.constraintType === 'FNLT' && node.constraintDay !== null) {
        if(node.EF > node.constraintDay) node.EF = node.constraintDay;
      }
      if(node.constraintType === 'MFO' && node.constraintDay !== null) {
        node.EF = node.constraintDay;
        node.ES = node.EF - node.dur + 1;
      }
    });
  }

  var projEnd = Math.max.apply(null, Object.values(map).map(function(n){ return n.EF; }));

  // ── Backward pass ─────────────────────────────────────────────────────────
  Object.values(map).forEach(function(node) { node.LF = projEnd; });

  for(var iter2=0; iter2<maxIter; iter2++) {
    acts.slice().reverse().forEach(function(a) {
      var node = map[a.id];
      var minLF = projEnd;
      acts.forEach(function(b) {
        var bn = map[b.id];
        normPred(b.pred).forEach(function(p) {
          if(p.id !== a.id) return;
          var lag = p.lag||0;
          var constraint;
          switch(p.tipo) {
            case 'FI': constraint = bn.LS - 1 - lag; break;
            case 'II': constraint = bn.LS - lag + node.dur - 1; break;
            case 'FF': constraint = bn.LF - lag; break;
            case 'IF': constraint = bn.LF - lag + node.dur - 1; break;
            default:   constraint = bn.LS - 1 - lag;
          }
          minLF = Math.min(minLF, constraint);
        });
      });
      node.LF = minLF;
      node.LS = node.LF - node.dur + 1;
    });
  }

  // ── Holgura y ruta crítica ─────────────────────────────────────────────────
  Object.values(map).forEach(function(node) {
    node.float = node.LS - node.ES;
    node.critical = node.float <= 0;
  });

  return map;
}

// ── REPROGRAMACIÓN AUTOMÁTICA ─────────────────────────────────────────────────
// Cuando cambia una actividad, recalcula las fechas de todas sus sucesoras en cascada
function reprogramar(cid, changedActId) {
  var acts = D.ac.filter(function(a){ return a.cid==cid; });
  var cpm = computeCPM(cid);
  var changed = 0;

  // Orden topológico para procesar en secuencia correcta
  var order = topoSort(acts);

  order.forEach(function(a) {
    var node = cpm[a.id]; if(!node) return;
    var preds = normPred(a.pred);
    if(!preds.length) return; // Sin predecesoras, mantiene sus fechas

    var newES = strToDay(a.fstart); // base: fecha actual
    preds.forEach(function(p) {
      var pn = cpm[p.id]; if(!pn) return;
      var lag = p.lag||0;
      var constraint;
      switch(p.tipo) {
        case 'FI': constraint = pn.EF + 1 + lag; break;
        case 'II': constraint = pn.ES + lag; break;
        case 'FF': constraint = pn.EF + lag - a.dur + 1; break; // aproximado
        default:   constraint = pn.EF + 1 + lag;
      }
      if(constraint > newES) newES = constraint;
    });

    var dur = node.dur;
    var newEF = newES + dur - 1;
    var oldStart = strToDay(a.fstart);

    if(newES !== oldStart) {
      a.fstart = dayToStr(newES);
      a.fend   = dayToStr(newEF);
      // Recalculate cpm node
      node.ES = newES; node.EF = newEF;
      changed++;
    }
  });

  return changed;
}

function topoSort(acts) {
  var visited = {}, result = [];
  function visit(a) {
    if(visited[a.id]) return;
    visited[a.id] = true;
    normPred(a.pred).forEach(function(p) {
      var pred = acts.find(function(x){ return x.id==p.id; });
      if(pred) visit(pred);
    });
    result.push(a);
  }
  acts.forEach(visit);
  return result;
}

function dayToStr(d) {
  var dt = new Date(d * 86400000);
  var y = dt.getUTCFullYear(), m = dt.getUTCMonth()+1, day = dt.getUTCDate();
  return y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0');
}

// ── LÍNEA BASE ────────────────────────────────────────────────────────────────
function guardarLineaBase(cid) {
  var ct = D.ct.find(function(x){ return x.id==cid; }); if(!ct) return;
  var acts = D.ac.filter(function(a){ return a.cid==cid; });
  ct.baseline = {
    fecha: today(),
    acts: acts.map(function(a) {
      return { id:a.id, nombre:a.nombre, fstart:a.fstart, fend:a.fend, valor:a.valor, pr:a.pr };
    })
  };
  save();
  toast('Línea base guardada — ' + fmt(ct.baseline.fecha));
}

function limpiarLineaBase(cid) {
  var ct = D.ct.find(function(x){ return x.id==cid; }); if(!ct) return;
  if(!confirm('¿Eliminar la línea base? No se puede recuperar.')) return;
  ct.baseline = null;
  save();
  toast('Línea base eliminada');
}

// Variación de una actividad respecto a línea base
function baselineVar(ac, cid) {
  var ct = D.ct.find(function(x){ return x.id==cid; });
  if(!ct || !ct.baseline) return null;
  var base = ct.baseline.acts.find(function(b){ return b.id==ac.id; });
  if(!base) return null;
  var startVar = strToDay(ac.fstart) - strToDay(base.fstart); // días de desvío inicio
  var endVar   = strToDay(ac.fend)   - strToDay(base.fend);   // días de desvío fin
  return { startVar: startVar, endVar: endVar, baseStart: base.fstart, baseEnd: base.fend, baseValor: base.valor };
}

function depBodyHTML(acId, cid) {
  var ac = D.ac.find(function(a){ return a.id==acId; }); if(!ac) return '';

  // Sucesoras actuales

    return a.cid==cid && a.id!=acId && normPred(a.pred).some(function(p){ return p.id==acId; });

  var tipoOpts = function(sel) {
    return ['FI','II','FF','IF'].map(function(t){
      var labels = {FI:'FI — Fin a Inicio',II:'II — Inicio a Inicio',FF:'FF — Fin a Fin',IF:'IF — Inicio a Fin'};

    }).join('');

  var h = '<div style="margin-bottom:16px">';

  h += '<div id="dep_pred_list">';

  });

  h += '<button onclick="depAddRow(\'pred\','+acId+','+cid+')" style="border:none;background:none;cursor:pointer;font-size:12px;color:var(--bl);font-family:\'Instrument Sans\',sans-serif;padding:4px 0;font-weight:600">+ Agregar predecesora</button>';
  h += '</div>';

  h += '<div>';
  h += '<div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:8px">Sucesoras</div>';
  h += '<div id="dep_suc_list">';
  currentSuc.forEach(function(sa, i) {
    var myPred = normPred(sa.pred).find(function(p){ return p.id==acId; });
    h += depRow('suc', i, sa.id, sa.nombre, myPred?myPred.tipo:'FI', myPred?myPred.lag:0, otrasActs);
  });
  h += '</div>';
  h += '<button onclick="depAddRow(\'suc\','+acId+','+cid+')" style="border:none;background:none;cursor:pointer;font-size:12px;color:var(--gr);font-family:\'Instrument Sans\',sans-serif;padding:4px 0;font-weight:600">+ Agregar sucesora</button>';
  h += '</div>';

  h += '<div style="margin-top:16px;background:var(--sf2);border-radius:8px;padding:12px 14px;font-size:11.5px;color:var(--mu2);line-height:1.7">';
  h += '<b>Tipos de dependencia:</b><br>';
  h += '• <b>FI</b> — Fin a Inicio: B empieza cuando termina A (más común)<br>';
  h += '• <b>II</b> — Inicio a Inicio: B empieza cuando empieza A<br>';
  h += '• <b>FF</b> — Fin a Fin: B termina cuando termina A<br>';
  h += '• <b>IF</b> — Inicio a Fin: B termina cuando empieza A (raro)<br>';
  h += '<b>Rezago:</b> días de espera (+) o adelanto (-) entre actividades.';
  h += '</div>';

  return h;
}

    h += '<option value="'+a.id+'"'+(a.id==actId?' selected':'')+'>'+a.nombre.substring(0,45)+'</option>';
  });

  h += '<select style="width:80px;background:#fff;border:1px solid var(--bd2);border-radius:7px;padding:6px 6px;font-family:\'Instrument Sans\',sans-serif;font-size:12px;color:var(--tx)" class="dep-tipo-sel">';

}

function depAddRow(side, acId, cid) {
  var otrasActs = D.ac.filter(function(a){ return a.cid==cid && a.id!=acId; });
  var container = document.getElementById('dep_'+side+'_list');
  if(!container) return;
  var idx = container.children.length;
  var tmp = document.createElement('div');
  tmp.innerHTML = depRow(side, idx, '', '— Seleccionar —', 'FI', 0, otrasActs);
  container.appendChild(tmp.firstElementChild);
}

function saveDependencias(acId, cid, prefix) {
  var ac = D.ac.find(function(a){ return a.id==acId; }); if(!ac) return;

  // Read pred rows
  var predList = document.getElementById('dep_pred_list');
  var newPred = [];
  if(predList) {
    Array.from(predList.children).forEach(function(row) {
      var actSel  = row.querySelector('.dep-act-sel');
      var tipoSel = row.querySelector('.dep-tipo-sel');
      var lagInp  = row.querySelector('.dep-lag-inp');
      var actId2  = actSel  ? Number(actSel.value)  : 0;
      var tipo    = tipoSel ? tipoSel.value          : 'FI';
      var lag     = lagInp  ? Number(lagInp.value)||0: 0;
      if(actId2) newPred.push({id: actId2, tipo: tipo, lag: lag});
    });
  }
  ac.pred = newPred;

  // Read suc rows — update pred of those activities
  var sucList = document.getElementById('dep_suc_list');
  if(sucList) {
    // First, remove this activity from all current successors' pred
    D.ac.filter(function(a){ return a.cid==cid && a.id!=acId; }).forEach(function(a) {
      a.pred = normPred(a.pred).filter(function(p){ return p.id!==acId; });
    });
    // Add back based on new suc list
    Array.from(sucList.children).forEach(function(row) {
      var actSel  = row.querySelector('.dep-act-sel');
      var tipoSel = row.querySelector('.dep-tipo-sel');
      var lagInp  = row.querySelector('.dep-lag-inp');
      var sucId   = actSel  ? Number(actSel.value)  : 0;
      var tipo    = tipoSel ? tipoSel.value          : 'FI';
      var lag     = lagInp  ? Number(lagInp.value)||0: 0;
      if(sucId) {
        var sac = D.ac.find(function(a){ return a.id==sucId; });
        if(sac) {
          if(!sac.pred) sac.pred = [];
          sac.pred = normPred(sac.pred).filter(function(p){ return p.id!==acId; });
          sac.pred.push({id: acId, tipo: tipo, lag: lag});
        }
      }
    });
  }

  save();
  closeModal();

  // Reprogramar en cascada
  var changed = reprogramar(cid, acId);
  if(changed > 0) {
    save();
    toast(changed + ' actividad(es) reprogramadas automáticamente');
  } else {
    toast('Dependencias guardadas');
  }

  // Refresh gantt
  var gfvEl = document.getElementById('ganttFullView');
  if(gfvEl && gfvEl.classList.contains('on')) { recalcGantt('gfv', cid); }
  else if(window.ctPageCid) { ctpRenderGantt(cid); }
  else if(document.getElementById('gm_tbl_'+cid)) { recalcGantt('gm', cid); }
  else if(view === 'project') { render(); }
}

function isCritical(acId, cid) {
  var cpm = computeCPM(cid);
  return cpm[acId] ? cpm[acId].critical : false;
}

// Genera HTML de flechas de dependencia SVG sobre el Gantt
// Llamado después de buildGanttTable
function buildDependencyArrows(cid, days, DAY_W, prefix) {
  const acts = D.ac.filter(a => a.cid == cid);
  if(!acts.length) return '';
  const startMs = days[0].getTime();
  const cpm = computeCPM(cid);

  let arrows = '';
  const ROW_H = 48; // altura de fila gantt (gantt-bar-area min-height)

  // Crear índice de posición vertical (orden de renderizado)
  const orderedIds = [];
  function collectOrder(ac) {
    orderedIds.push(ac.id);
    D.ac.filter(a => a.cid==cid && String(a.pid)===String(ac.id))
       .forEach(ch => collectOrder(ch));
  }
  acts.filter(a => !a.pid).forEach(a => collectOrder(a));

  acts.forEach(a => {
    if(!a.pred || !a.pred.length) return;
    normPred(a.pred).forEach(function(pObj) { var predId = pObj.id;
      var pred = D.ac.find(function(x){ return x.id == predId; });
      if(!pred) return;

      var predIdx = orderedIds.indexOf(Number(predId));
      const sucIdx  = orderedIds.indexOf(a.id);
      if(predIdx < 0 || sucIdx < 0) return;

      // X del fin de la predecesora
      const predEndMs = pred.fend ? new Date(pred.fend+'T00:00:00').getTime() : 0;
      const x1 = Math.floor((predEndMs - startMs) / 86400000) * DAY_W + DAY_W;

      // X del inicio del sucesor
      const sucStartMs = a.fstart ? new Date(a.fstart+'T00:00:00').getTime() : 0;
      const x2 = Math.floor((sucStartMs - startMs) / 86400000) * DAY_W;

      const y1 = predIdx * ROW_H + ROW_H / 2;
      const y2 = sucIdx  * ROW_H + ROW_H / 2;

      var isCrit = (cpm[a.id]&&cpm[a.id].critical) && (cpm[Number(predId)]&&cpm[Number(predId)].critical);
      var arrowLabel = pObj.tipo + (pObj.lag ? (pObj.lag>0?'+':'')+pObj.lag+'d' : '');
      const stroke = isCrit ? '#C8232A' : '#7a8499';
      const sw     = isCrit ? 2 : 1.5;

      // Curva bezier entre fin de pred y inicio de suc
      const mx = (x1 + x2) / 2;
      arrows += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"
        stroke="${stroke}" stroke-width="${sw}" fill="none" stroke-dasharray="${isCrit?'none':'4,3'}"
        marker-end="url(#arr${isCrit?'Red':'Gray'})"/>`;
    });
  });

  if(!arrows) return '';

  const totalH = orderedIds.length * ROW_H;
  const totalW = days.length * DAY_W;

  return `<svg style="position:absolute;top:0;left:0;pointer-events:none;z-index:10;overflow:visible"
    width="${totalW}" height="${totalH}">
    <defs>
      <marker id="arrRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#C8232A"/>
      </marker>
      <marker id="arrGray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#7a8499"/>
      </marker>
    </defs>
    ${arrows}
  </svg>`;
}

function buildGanttTable(cid, cut, prefix) {
  const roots = D.ac.filter(a => a.cid == cid && !a.pid);
  const cpmData = computeCPM(cid); // ruta crítica
  if(!roots.length) return `<div class="emp" style="padding:40px;text-align:center">
    <div style="font-size:13px;color:var(--mu);margin-bottom:14px">Sin actividades aún</div>
    <button class="btn bgr" onclick="openActH(${cid},null)">+ Agregar primera actividad</button>
  </div>`;

  const range = ganttDateRange(cid);
  if(!range) return `<div class="emp" style="padding:32px">Las actividades no tienen fechas definidas.</div>`;

  const { minMs, maxMs } = range;

  // Generar lista de días entre min y max (+7 días de margen)
  const MARGIN_DAYS = 5;
  const startDate = new Date(minMs); startDate.setHours(0,0,0,0);
  const endDate   = new Date(maxMs + MARGIN_DAYS * 86400000); endDate.setHours(0,0,0,0);
  const days = [];
  let d = new Date(startDate);
  while(d <= endDate) {
    days.push(new Date(d));
    d.setDate(d.getDate() + 1);
  }

  // DAY_W: mínimo 14px para que los números sean legibles
  // Para contratos largos, mostrar números cada N días
  const totalDuration = Math.ceil((maxMs - minMs) / 86400000);
  const DAY_W = totalDuration <= 60  ? 22 :
                totalDuration <= 120 ? 18 :
                totalDuration <= 240 ? 14 :
                totalDuration <= 400 ? 12 :
                totalDuration <= 730 ? 10 : 8;
  // Cada cuántos días mostrar número (para no amontonarlos)
  const LABEL_EVERY = DAY_W >= 16 ? 1 :
                      DAY_W >= 12 ? 2 :
                      DAY_W >= 10 ? 5 : 7;
  const totalW = days.length * DAY_W;

  const cutMs   = new Date((cut||today())+'T00:00:00').getTime();
  const todayMs = new Date(today()+'T00:00:00').getTime();

  function dayIdx(ms) {
    return Math.floor((ms - startDate.getTime()) / 86400000);
  }
  function dayX(ms) { return dayIdx(ms) * DAY_W; }

  // Agrupar días por mes para el header
  const monthGroups = [];
  let curMonth = null;
  days.forEach((d, i) => {
    const key = d.getFullYear()+'-'+d.getMonth();
    if(key !== curMonth) {
      curMonth = key;
      monthGroups.push({ label: d.toLocaleDateString('es-CO',{month:'short',year:'2-digit'}), startIdx: i, count: 1 });
    } else {
      monthGroups[monthGroups.length-1].count++;
    }
  });

  // Header días: número del día, fin de semana resaltado
  const dayNums = days.map((d,i) => {
    const isWknd  = d.getDay()===0 || d.getDay()===6;
    const isCut   = d.getTime() === cutMs;
    const isToday = d.getTime() === todayMs;
    const isFirst = d.getDate() === 1;
    // Mostrar número: siempre en el día 1 del mes, o cada LABEL_EVERY días
    const showLabel = isFirst || (d.getDate() % LABEL_EVERY === 1);
    const label = showLabel ? d.getDate() : '';
    const borderR = isFirst ? '1px solid var(--bd)' : '0.5px solid var(--bd2)';
    const bg = isWknd ? 'rgba(0,0,0,.04)' : 'transparent';
    const col = isCut ? 'var(--am)' : isToday ? 'var(--accent)' : isFirst ? 'var(--mu2)' : isWknd ? 'var(--bd)' : 'var(--mu)';
    const fw  = (isToday || isCut || isFirst) ? '700' : '400';
    return `<div style="width:${DAY_W}px;flex-shrink:0;text-align:center;font-size:8px;font-weight:${fw};color:${col};border-right:${borderR};line-height:16px;background:${bg};overflow:hidden">${label}</div>`;
  }).join('');

  const monthBar = monthGroups.map(m =>
    `<div style="width:${m.count*DAY_W}px;flex-shrink:0;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu2);border-right:1px solid var(--bd);display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap">${m.label}</div>`
  ).join('');

  // Build rows
  let leftRows = '';
  let barRows  = '';
  const COLORS = ['#C8232A','#1e6fb0','#1a8a4a','#c07a20','#5c4fb5','#1a8a7a'];
  function aColor(lvl) { return COLORS[lvl % COLORS.length]; }

  function renderRow(ac, lvl) {
    const ch = D.ac.filter(a => a.cid==cid && String(a.pid)==String(ac.id));
    const hasKids = ch.length > 0;
    const real  = computeReal(ac, cid);
    const est   = computeEst(ac, cid, cut);
    const sem   = semaforo(real, est);
    const color = aColor(lvl);
    const indent = lvl * 16;
    const rowId = `gr_${prefix}_${ac.id}`;

    const aMs = ac.fstart ? new Date(ac.fstart+'T00:00:00').getTime() : startDate.getTime();
    const eMs = ac.fend   ? new Date(ac.fend  +'T00:00:00').getTime() : endDate.getTime();
    const startIdx = Math.max(0, dayIdx(aMs));
    const endIdx   = Math.min(days.length-1, dayIdx(eMs));
    const durDays  = endIdx - startIdx + 1;
    const realDays = Math.round(durDays * real / 100);

    // Celdas de días — pintar los que caen en la actividad
    const dayCells = days.map((d, i) => {
      const dMs = d.getTime();
      const inActivity = dMs >= aMs && dMs <= eMs;
      const isWknd = d.getDay()===0||d.getDay()===6;
      const isCut  = dMs === cutMs;
      const isToday= dMs === todayMs;
      const isDone = inActivity && (dayIdx(dMs) - startIdx) < realDays;
      let bg = 'transparent';
      const isCritAc = cpmData[ac.id]?.critical;
      const critColor = '#C8232A';
      if(inActivity) bg = isDone ? (isCritAc?critColor:color) : (isCritAc?'rgba(200,35,42,.18)':color+'28');
      if(isWknd && !inActivity) bg = 'var(--sf2)';

      // Línea base overlay
      var blVar = _baselineVisible[cid] ? baselineVar(ac, cid) : null;
      var inBase = false;
      if(blVar) {
        var baseS = strToDay(blVar.baseStart), baseE = strToDay(blVar.baseEnd);
        var dDay = msToDay(dMs);
        inBase = dDay >= baseS && dDay <= baseE;
      }
      return `<div style="width:${DAY_W}px;flex-shrink:0;height:100%;position:relative;border-right:${d.getDate()===1?'1px solid var(--bd)':'0.5px solid var(--bd2)'};background:${bg}">
        ${isCut?`<div style="position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--am);z-index:4"></div>`:''}
        ${isToday?`<div style="position:absolute;top:0;bottom:0;left:0;width:1px;border-left:1.5px dashed rgba(200,35,42,.5);z-index:3"></div>`:''}
        ${inBase?`<div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(100,100,100,.4);z-index:2" title="Línea base"></div>`:''}
      </div>`;
    }).join('');

    // Fila izquierda
    const hasCrit = cpmData[ac.id]?.critical;
    const preds   = normPred(ac.pred).length;
    const sucs    = D.ac.filter(a=>a.cid==cid&&normPred(a.pred).some(function(p){return p.id==ac.id;})).length;
    const tooltip = ac.nombre+(hasCrit?' ⚡ RUTA CRÍTICA':'')+(preds?' | '+preds+' pred':'')+(sucs?' | '+sucs+' suc':'');
    const restActive = ac.constraint_type && ac.constraint_type !== 'ASAP';

    leftRows += `<div class="gantt-row${hasKids?' group-row':''}" id="${rowId}"
      oncontextmenu="ganttCtx(event,${ac.id},${cid},'${prefix}',${hasKids})">
      <div class="gantt-cell act" style="padding-left:${8+indent}px">
        ${hasKids
          ? `<span class="gantt-toggle" id="gt_${rowId}" onclick="ganttToggle('${rowId}','${cid}','${prefix}')">▼</span>`
          : `<span style="width:16px;display:inline-block;color:var(--bd2);font-size:10px;text-align:center">—</span>`}
        <span style="display:flex;align-items:center;gap:3px;min-width:0;flex:1">
          ${hasCrit?'<span title="Ruta crítica" style="color:#C8232A;font-weight:900;flex-shrink:0">●</span>':''}
          <span class="gantt-act-name" style="font-size:12.5px;font-weight:${hasKids?'700':'400'};color:${hasCrit?'#C8232A':hasKids?color:'var(--tx)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${tooltip}">${ac.nombre}</span>
          ${preds?`<span style="font-size:8.5px;background:#dbeafe;color:#1d4ed8;border-radius:3px;padding:0 4px;font-weight:700;flex-shrink:0">P${preds}</span>`:''}
          ${sucs?`<span style="font-size:8.5px;background:#dcfce7;color:#15803d;border-radius:3px;padding:0 4px;font-weight:700;flex-shrink:0">S${sucs}</span>`:''}
          ${restActive?`<span style="font-size:9px;flex-shrink:0" title="${ac.constraint_type}">📅</span>`:''}
          ${ac.apu?`<span style="font-size:8.5px;background:#dcfce7;color:#15803d;border-radius:3px;padding:0 4px;font-weight:700;flex-shrink:0">APU</span>`:''}
        </span>
        <!-- Hover action buttons -->
        <div class="gantt-row-actions">
          <button class="btn sm bgh" onclick="openEditAct(${ac.id},${cid},'${prefix}')" title="Editar"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 2l3 3L5 14H2v-3L11 2z"/></svg></button>
          <button class="btn sm bbl" onclick="openActH(${cid},${ac.id})" title="Subactividad">+</button>
          <button class="btn sm brd" onclick="delActH(${ac.id},${cid},'${prefix}')" title="Eliminar">×</button>
        </div>
      </div>

function toggleGActRow(tid, arrow) {
  // Encuentra todas las filas hijas (y nietas, etc.) del nodo con este tid
  const allRows = document.querySelectorAll('.gact-row');
  const actId = tid.split('_').pop(); // el id del ac
  let open = arrow.dataset.open !== 'false';
  arrow.dataset.open = open ? 'false' : 'true';
  arrow.style.transform = open ? '' : 'rotate(90deg)';

  function hideShow(parentTid, visible) {
    // busca filas cuyo data-pid sea el actId correspondiente a parentTid
    const pActId = parentTid.split('_').pop();
    allRows.forEach(row => {
      if(String(row.dataset.pid) === String(pActId)) {
        row.style.display = visible ? '' : 'none';
        // Si colapsamos un padre, también colapsar sus hijos
        const rowId = row.id.replace('row_gact_','').replace('row_','');
        // obtener el id de actitud desde el id de la fila
        const childTidBase = row.id.replace('row_','');
        const childArrow = document.getElementById('arr_'+childTidBase);
        if(!visible) {
          if(childArrow) { childArrow.dataset.open = 'false'; childArrow.style.transform = ''; }
          hideShow(childTidBase, false);
        }
      }
    });
  }

  hideShow(tid, !open);
  if(!open) {
    arrow.style.transform = 'rotate(90deg)';
  }
}

function recalcGantt(prefix, cid) {
  const cut = $(`${prefix}_cut_${cid}`)?.value || today();
  const tbl = $(`${prefix}_tbl_${cid}`);
  if(tbl) tbl.innerHTML = buildGanttTable(cid, cut, prefix);
  // Recalc summary
  const roots = D.ac.filter(a => a.cid == cid && !a.pid);
  const ae = roots.length ? Math.round(roots.reduce((s,a)=>s+computeEst(a,cid,cut),0)/roots.length) : 0;
  const ar = roots.length ? Math.round(roots.reduce((s,a)=>s+computeReal(a,cid),0)/roots.length) : 0;
  const dif = ar - ae;
  const seEl = $(`${prefix}_ae_${cid}`); if(seEl) seEl.textContent = ae+'%';
  const srEl = $(`${prefix}_ar_${cid}`); if(srEl) srEl.textContent = ar+'%';
  const sdEl = $(`${prefix}_dif_${cid}`);
  if(sdEl) { sdEl.textContent=(dif>=0?'+':'')+dif+'%'; sdEl.style.color=dif>=0?'var(--gr)':'var(--accent)'; }
}

function updateRealH(id, val, cid, prefix) {
  const a = D.ac.find(x => x.id == id);
  if(a) { a.pr = clamp(Number(val),0,100); save(); }
  recalcGantt(prefix, cid);
}

  h += '<td style="padding:4px 6px;border-bottom:1px solid var(--bd2)">';

function apuAddRow(catId, acId) {
  var ac = D.ac.find(function(a){ return a.id==acId; }); if(!ac||!ac.apu) return;
  if(!ac.apu.items[catId]) ac.apu.items[catId]=[];
  var idx = ac.apu.items[catId].length;
  ac.apu.items[catId].push({desc:'',und:'',cant:0,vu:0});
  var tbody = document.getElementById('apu_body_'+catId);
  if(tbody){
    var tmp = document.createElement('tbody');
    tmp.innerHTML = apuRowHTML(catId, idx, {desc:'',und:'',cant:'',vu:''});
    var row = tmp.firstElementChild;
    tbody.appendChild(row);
    var inp = row.querySelector('input');
    if(inp){ inp.focus(); }
  }
}

function apuDelRow(catId, idx) {
  var row = document.getElementById('apurow_'+catId+'_'+idx);
  if(row) row.remove();
  apuRecalc(0);
}

function apuRecalc(acId) {
  var grandVU = 0;
  APU_CATS.forEach(function(cat){
    var tbody = document.getElementById('apu_body_'+cat.id); if(!tbody) return;
    var rows = tbody.querySelectorAll('tr');
    var catTotal = 0;
    rows.forEach(function(row, i){
      var inps = row.querySelectorAll('input');
      if(inps.length < 4) return;
      var cant = parseFloat(inps[2].value)||0;
      var vu   = parseFloat(inps[3].value)||0;
      var vt   = cant * vu;
      catTotal += vt;
      var vtEl = document.getElementById('apurow_vt_'+cat.id+'_'+i);
      if(vtEl) vtEl.textContent = vt>0 ? '$'+Math.round(vt).toLocaleString('es-CO') : '—';
    });
    grandVU += catTotal;
    var totEl = document.getElementById('apu_tot_'+cat.id);
    if(totEl) totEl.textContent = '$'+Math.round(catTotal).toLocaleString('es-CO');
    var sEl = document.getElementById('apu_s_'+cat.id);
    if(sEl) sEl.textContent = '$'+Math.round(catTotal).toLocaleString('es-CO');
  });

  var cantEl = document.getElementById('apu_cant');
  var undEl  = document.getElementById('apu_und');
  var cant   = cantEl ? (parseFloat(cantEl.value)||1) : 1;
  var und    = undEl  ? undEl.value : '';
  var total  = grandVU * cant;

  var eVUT   = document.getElementById('apu_s_vut');
  var eCant  = document.getElementById('apu_s_cant');
  var eUnd   = document.getElementById('apu_s_und');
  var eTotal = document.getElementById('apu_s_total');
  if(eVUT)   eVUT.textContent   = '$'+Math.round(grandVU).toLocaleString('es-CO');
  if(eCant)  eCant.textContent  = cant;
  if(eUnd)   eUnd.textContent   = und;
  if(eTotal) eTotal.textContent = '= $'+Math.round(total).toLocaleString('es-CO');
}

function saveAPU(acId, cid, prefix) {
  var ac = D.ac.find(function(a){ return a.id==acId; }); if(!ac) return;
  if(!ac.apu) ac.apu = {};

  var codEl  = document.getElementById('apu_cod');
  var undEl  = document.getElementById('apu_und');
  var cantEl = document.getElementById('apu_cant');
  ac.apu.cod  = codEl  ? codEl.value.trim()  : '';
  ac.apu.und  = undEl  ? undEl.value.trim()  : '';
  ac.apu.cant = cantEl ? (parseFloat(cantEl.value)||1) : 1;

  // Read items from DOM
  ac.apu.items = {};
  var grandVU = 0;
  APU_CATS.forEach(function(cat){
    ac.apu.items[cat.id] = [];
    var tbody = document.getElementById('apu_body_'+cat.id); if(!tbody) return;
    var rows = tbody.querySelectorAll('tr');
    rows.forEach(function(row){
      var inps = row.querySelectorAll('input');
      if(inps.length < 4) return;
      var desc = inps[0].value.trim();
      var und2 = inps[1].value.trim();
      var cant2= parseFloat(inps[2].value)||0;
      var vu   = parseFloat(inps[3].value)||0;
      if(desc||cant2||vu) {
        ac.apu.items[cat.id].push({desc:desc,und:und2,cant:cant2,vu:vu});
        grandVU += cant2*vu;
      }
    });
  });

  // Calculate and set valor automatically
  var total = Math.round(grandVU * ac.apu.cant);
  if(total > 0) {
    ac.valor = total;
  }
  // If no items at all, mark apu as null (manual mode)
  var hasItems = APU_CATS.some(function(cat){ return ac.apu.items[cat.id].length>0; });
  if(!hasItems) ac.apu = null;

  save();
  closeModal();

  // Refresh gantt
  var gfvEl = document.getElementById('ganttFullView');
  if(gfvEl && gfvEl.classList.contains('on')) { recalcGantt('gfv', cid); }
  else if(window.ctPageCid) { ctpRenderGantt(cid); }
  else if(document.getElementById('gm_tbl_'+cid)) { recalcGantt('gm', cid); }
  else if(view === 'project') { render(); }

  toast(total>0 ? 'APU guardado · Valor: $'+total.toLocaleString('es-CO') : 'APU guardado');
}



// ─── GANTT CONTEXT MENU ──────────────────────────────────────────────────────
var _ctxData = {};

function ganttCtx(e, acId, cid, prefix, hasKids) {
  e.preventDefault();
  e.stopPropagation();
  _ctxData = { acId:acId, cid:cid, prefix:prefix, hasKids:hasKids };
  var ac = D.ac.find(function(a){ return a.id==acId; });
  if(!ac) return;
  var hasPred = normPred(ac.pred).length;
  var hasSuc  = D.ac.filter(function(a){ return a.cid==cid && normPred(a.pred).some(function(p){return p.id==acId;}); }).length;
  var restActive = ac.constraint_type && ac.constraint_type !== 'ASAP';
  var ct = D.ct.find(function(x){ return x.id==cid; });

  var menu = document.getElementById('ganttCtxMenu'); if(!menu) return;
  menu.innerHTML = [
    ctxItem('✏️','Editar actividad','edit'),
    ctxItem('➕','Agregar subactividad','sub'),
    '<div class="ctx-sep"></div>',
    !hasKids ? ctxItem('📊','APU — Análisis de precios','apu', ac.apu?'Definido':'') : '',
    ctxItem('🔗','Dependencias'+(hasPred||hasSuc?' ('+((hasPred?hasPred:0)+(hasSuc?hasSuc:0))+')':''),'dep'),
    ctxItem('📅','Restricción de fecha','rest', restActive?ac.constraint_type:''),
    !hasKids ? ctxItem('💰','Flujo de caja mensual','flujo') : '',
    '<div class="ctx-sep"></div>',
    ctxItem('⭐','Guardar línea base ahora','baseline'),
    ctxItem('🔄','Reprogramar desde aquí','reprogram'),
    '<div class="ctx-sep"></div>',
    ctxItem('🗑️','Eliminar actividad','del', '', true)
  ].filter(Boolean).join('');

  // Attach single click handler on menu (avoids innerHTML onclick escaping issues)
  menu.onclick = function(ev) {
    var item = ev.target.closest('.ctx-item');
    if(!item) return;
    ev.stopPropagation();
    var action = item.getAttribute('data-action');
    if(action) ganttCtxAct(action);
  };

  // Position
  var x = e.clientX, y = e.clientY;
  var mw = 220, mh = 340;
  if(x + mw > window.innerWidth)  x = window.innerWidth - mw - 8;
  if(y + mh > window.innerHeight) y = window.innerHeight - mh - 8;
  menu.style.left = x + 'px';
  menu.style.top  = y + 'px';
  menu.className = 'on';

  // Close on outside click — remove any previous listener first
  document.removeEventListener('click', closeCtxMenu);
  setTimeout(function(){
    document.addEventListener('click', closeCtxMenu);
  }, 100);
}

function ctxItem(icon, label, action, badge, danger) {
  // Use data-action to avoid innerHTML onclick escaping issues
  return '<div class="ctx-item'+(danger?' danger':'')+'" data-action="'+action+'">'
    + '<span class="ctx-icon">'+icon+'</span>'
    + '<span class="ctx-label">'+label+'</span>'
    + (badge ? '<span class="ctx-badge">'+badge+'</span>' : '')
    + '</div>';
}

function closeCtxMenu(e) {
  // Don't close if clicking inside the menu itself
  var menu = document.getElementById('ganttCtxMenu');
  if(!menu) return;
  if(e && menu.contains(e.target)) return;
  menu.className = '';
}

function ganttCtxAct(action) {
  // Close menu after a tiny delay so the click doesn't interfere
  var d = Object.assign({}, _ctxData); // copy before closing
  var menu = document.getElementById('ganttCtxMenu');
  if(menu) menu.className = '';
  document.removeEventListener('click', closeCtxMenu);
  var ac = D.ac.find(function(a){ return a.id==d.acId; });
  switch(action) {
    case 'edit':      openEditAct(d.acId, d.cid, d.prefix); break;
    case 'sub':       openActH(d.cid, d.acId); break;
    case 'apu':       openAPU(d.acId, d.cid, d.prefix); break;
    case 'dep':       openDependencias(d.acId, d.cid, d.prefix); break;
    case 'rest':      openRestriccion(d.acId, d.cid, d.prefix); break;
    case 'flujo':
      // Navigate to Flujo de Caja tab for this contract
      if(window.ctPageCid) {
        var fcBtn = document.querySelector('[onclick*="ctpFC"]');
        if(fcBtn) fcBtn.click();
        else toast('Abre el contrato y ve a la pestaña Flujo de Caja');
      } else {
        toast('Abre el contrato para gestionar el flujo de caja');
      }
      break;
    case 'baseline':  guardarLineaBase(d.cid); break;
    case 'reprogram':
      var changed = reprogramar(d.cid, d.acId);
      if(changed>0){ save(); toast(changed+' actividad(es) reprogramadas'); }
      else toast('Sin cambios necesarios');
      var gfvEl = document.getElementById('ganttFullView');
      if(gfvEl&&gfvEl.classList.contains('on')){ recalcGantt('gfv',d.cid); }
      else if(window.ctPageCid){ ctpRenderGantt(d.cid); }
      else if(document.getElementById('gm_tbl_'+d.cid)){ recalcGantt('gm',d.cid); }
      else if(view==='project'){ render(); }
      break;
    case 'del':
      delActH(d.acId, d.cid, d.prefix); break;
  }
}

function delActH(id, cid, prefix) {
  // Eliminar también subactividades recursivamente
  function rmAct(aid) {
    actKids(aid, cid).forEach(h => rmAct(h.id));
    D.ac = D.ac.filter(a => a.id != aid);
  }
  rmAct(id); save();
  const gfvD = document.getElementById('ganttFullView');
  if(gfvD && gfvD.classList.contains('on')) { recalcGantt('gfv', cid); }
  else if(ctPageCid) { ctpRenderGantt(cid); }
  else if(document.getElementById('gm_tbl_'+cid)) { recalcGantt('gm', cid); }
  else { recalcGantt(prefix, cid); }
  toast('Actividad eliminada');
}

function saveActH(cid, pid) {
  const nombre = $('an').value.trim();
  const fstart = $('afs').value;
  const fend   = $('afe').value;
  if(!nombre || !fstart || !fend) { toast('Completa los campos obligatorios', true); return; }
  const predSel = document.getElementById('apred');
  const pred = predSel ? Array.from(predSel.selectedOptions).map(function(o){return {id:Number(o.value),tipo:'FI',lag:0};}) : [];
  const newId = Date.now();
  D.ac.push({ id: newId, cid, pid: pid||null, nombre, fstart, fend, valor: Number($('aval').value||0), pr: clamp(Number($('apr2').value||0),0,100), resp: $('ares').value.trim(), obs: $('aobs').value.trim(), pred });
  // Handle successors: add newId to pred[] of selected successors
  const sucSel = document.getElementById('asuc');
  if(sucSel) {
    Array.from(sucSel.selectedOptions).map(o=>Number(o.value)).forEach(sid=>{
      const sac = D.ac.find(a=>a.id==sid); if(!sac) return;
      if(!sac.pred) sac.pred=[];
      if(!sac.pred.map(Number).includes(newId)) sac.pred.push(newId);
    });
  }
  save(); closeModal();
  const gfvEl = document.getElementById('ganttFullView');
  if(gfvEl && gfvEl.classList.contains('on')) { recalcGantt('gfv', cid); }
  else if(ctPageCid) { ctpRenderGantt(cid); }
  else if(document.getElementById('gm_tbl_'+cid)) { recalcGantt('gm', cid); }
  else if(view === 'project') { render(); }
  toast('Actividad guardada');
}

function openEditAct(id, cid, prefix) {

  $('mTitle').textContent = 'Editar actividad';
  const otrasActs = D.ac.filter(a => a.cid==cid && a.id!=id);
  const currentPred = normPred(ac.pred).map(function(p){return p.id;});
  const currentSuc  = otrasActs.filter(a => normPred(a.pred).some(function(p){return p.id==id;})).map(a=>a.id);

    `<option value="${a.id}" ${currentPred.includes(a.id)?'selected':''}>${a.nombre.substring(0,45)}</option>`
  ).join('');

    `<option value="${a.id}" ${currentSuc.includes(a.id)?'selected':''}>${a.nombre.substring(0,45)}</option>`
  ).join('');
  $('mBody').innerHTML = `<div class="fg">

    <div class="fl2"><label>Fecha inicio *</label><input id="afs" type="date" value="${ac.fstart||''}"></div>

    <div class="fl2"><label>Responsable</label><input id="ares" value="${ac.resp||''}"></div>
    ${predOpts ? `<div class="fl2 full"><label>Predecesoras <span style="font-weight:400;color:var(--mu)">(Ctrl+clic para seleccionar varias)</span></label><select id="apred" multiple style="height:90px;border-radius:8px;border:1px solid var(--bd2);padding:4px;font-family:'Instrument Sans',sans-serif;font-size:12px;width:100%;background:#fff">${predOpts}</select></div>` : ''}
    ${sucOpts ? `<div class="fl2 full"><label>Sucesoras <span style="font-weight:400;color:var(--mu)">(Ctrl+clic para seleccionar varias)</span></label><select id="asuc" multiple style="height:90px;border-radius:8px;border:1px solid var(--bd2);padding:4px;font-family:'Instrument Sans',sans-serif;font-size:12px;width:100%;background:#fff">${sucOpts}</select></div>` : ''}
    <div class="fl2 full"><label>Observaciones</label><textarea id="aobs">${ac.obs||''}</textarea></div>
  </div>`;
  $('mFoot').innerHTML = `<button class="btn bgh" onclick="closeModal()">Cancelar</button><button class="btn bgr" onclick="updateAct(${id},${cid},'${prefix||'gv'}')">Guardar</button>`;
  openModal();
}

function updateAct(id, cid, prefix) {
  const ac = D.ac.find(x => x.id == id); if(!ac) return;
  const nombre = $('an').value.trim();
  const fstart = $('afs').value;
  const fend   = $('afe').value;
  if(!nombre||!fstart||!fend) { toast('Completa los campos obligatorios', true); return; }
  const predSel2 = document.getElementById('apred');
  const pred2 = predSel2 ? Array.from(predSel2.selectedOptions).map(function(o){return {id:Number(o.value),tipo:'FI',lag:0};}) : normPred(ac.pred);
  // Handle successors: update pred[] of other activities
  const sucSel2 = document.getElementById('asuc');
  if(sucSel2) {
    const newSucIds = Array.from(sucSel2.selectedOptions).map(o=>Number(o.value));
    // Add this activity to pred[] of newly selected successors
    newSucIds.forEach(sid => {
      const sac = D.ac.find(a=>a.id==sid); if(!sac) return;
      if(!sac.pred) sac.pred=[];
      if(!sac.pred.map(Number).includes(id)) sac.pred.push(id);
    });
    // Remove this activity from pred[] of deselected successors
    D.ac.filter(a=>a.cid==cid && a.id!=id).forEach(a => {
      if(!newSucIds.includes(a.id) && (a.pred||[]).map(Number).includes(id)) {
        a.pred = normPred(a.pred).filter(function(p){return p.id!==id;});
      }
    });
  }
  Object.assign(ac, { nombre, fstart, fend, valor: Number($('aval').value||0), pr: clamp(Number($('apr2').value||0),0,100), resp: $('ares').value.trim(), obs: $('aobs').value.trim(), pred: pred2 });
  save(); closeModal();
  const gfv = document.getElementById('ganttFullView');
  if(gfv && gfv.classList.contains('on')) { recalcGantt('gfv', cid); }
  else if(ctPageCid) { ctpRenderGantt(cid); }
  else { recalcGantt(prefix||'gv', cid); if(view==='project') render(); }
  toast('Actividad actualizada');
}

function openCt(padreId, editId) {
  const c     = editId ? D.ct.find(x => x.id == editId) : null;
  const isSub = padreId != null || (c && !!c.pid);

  function treeOpts(excId) {
    let o = '';
    function walk(pid, dep) {
      D.ct.filter(x => String(x.pid) === String(pid) && x.id !== excId).forEach(x => {
        o += `<option value="${x.id}" ${(c?.pid==x.id||padreId==x.id)?'selected':''}>${'　'.repeat(dep)}${x.num} — ${x.obj.substring(0,35)}</option>`;
        walk(x.id, dep+1);
      });
    }
    D.ct.filter(x => !x.pid && x.id !== excId).forEach(x => {
      o += `<option value="${x.id}" ${(c?.pid==x.id||padreId==x.id)?'selected':''}>${x.num} — ${x.obj.substring(0,35)}</option>`;
      walk(x.id, 1);
    });
    return o;
  }

  const svOpts = D.sv.map(s => `<option value="${s.id}" ${c?.svid==s.id?'selected':''}>${s.nombre}</option>`).join('');

  $('mTitle').textContent = c ? 'Editar contrato' : (isSub ? 'Nuevo derivado' : 'Nuevo contrato');
  $('mBody').innerHTML = `<div class="fg">
    <div class="fl2"><label>No. Contrato *</label><input id="cn" value="${c?.num||''}" placeholder="2025-001"></div>

      <option value="interadministrativo" ${c?.tipo==='interadministrativo'?'selected':''}>Interadministrativo</option>
    </select></div>
    <div class="fl2" id="tracking_mode_wrap" style="display:${['obra','consultoria'].includes(c?.tipo||'obra')?'block':'none'}">
      <label>Seguimiento</label>
      <select id="ctracking">
        <option value="gantt" ${(c?.trackingMode||'gantt')==='gantt'?'selected':''}>📊 Gantt + actividades</option>
        <option value="pct"   ${c?.trackingMode==='pct'?'selected':''}>📋 % programado / ejecutado</option>
      </select>
    </div>
    <div class="fl2 full"><label>Objeto del contrato *</label><textarea id="cobj">${c?.obj||''}</textarea></div>
    <div class="fl2 full"><label>${isSub ? 'Contrato padre *' : 'Supervisor EDESO'}</label>
      ${isSub
        ? `<select id="cpid"><option value="">— Seleccionar —</option>${treeOpts(c?.id)}</select>`
        : `<select id="csvid"><option value="">— Sin asignar —</option>${svOpts}</select>`}
    </div>
    ${(isSub || (c?.tipo||'obra') !== 'interadministrativo') ? `
    <div class="fl2 full" id="csvid_wrap">
      <label>${isSub ? 'Supervisor EDESO' : 'Supervisor EDESO'}</label>
      <select id="csvid"><option value="">— Sin asignar —</option>${svOpts}</select>
      ${isSub ? `<div style="font-size:11px;color:var(--mu);margin-top:4px">Cada derivado tiene su propio supervisor independiente.</div>` : ''}
    </div>` : `<div style="background:var(--sf2);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--mu);border:1px solid var(--bd)">
      ℹ Los contratos interadministrativos no tienen supervisor EDESO asignado. Los supervisores se asignan a cada contrato derivado individualmente.
    </div>`}

function saveCt(id, isSub) {
  const num   = $('cn').value.trim();
  const obj   = $('cobj').value.trim();
  const fstart= $('cfi').value;
  const fend  = $('cff').value;
  const estadoVal = $('cestado')?.value || '';
  const enContratacion = estadoVal === 'contratacion';
  if(!num || !obj) { toast('Completa los campos obligatorios', true); return; }
  if(!enContratacion && (!fstart || !fend)) { toast('Completa las fechas de inicio y fin', true); return; }
  const pid   = isSub ? ($('cpid')?.value || null) : null;
  // IAs no tienen supervisor EDESO — solo derivados
  const tipoVal = $('cti')?.value || 'obra';
  const svid = tipoVal === 'interadministrativo' ? null : ($('csvid')?.value || null);
  const tipo = $('cti').value;
  const lat  = tipo !== 'interadministrativo' && $('clat')?.value ? parseFloat($('clat').value) : null;
  const lng  = tipo !== 'interadministrativo' && $('clng')?.value ? parseFloat($('clng').value) : null;
  const fai   = $('cfai')?.value || null;
  const aiuAdm  = parseFloat($('caiu_adm')?.value||0)||0;
  const aiuImp  = parseFloat($('caiu_imp')?.value||0)||0;
  const aiuUtil = parseFloat($('caiu_util')?.value||0)||0;
  // Leer obras vigiladas ANTES de construir data
  const ovWrap = document.getElementById('obras_vigiladas_wrap');
  const obrasVigiladas = (ovWrap && ovWrap.style.display !== 'none')
    ? Array.from(ovWrap.querySelectorAll('input[type=checkbox]')).filter(ch => ch.checked).map(ch => Number(ch.value))
    : undefined;

  const trackingMode = ['obra','consultoria'].includes(tipo) ? ($('ctracking')?.value||'gantt') : null;
  const data  = { num, obj, tipo, trackingMode, contratista:$('ccont').value.trim(), contratante:$('ccontante')?.value.trim()||null, repLegal:$('creplegal')?.value.trim()||null, valor:$('cval').value||null, mod:$('cmod').value, fstart, fend, fai, obs:$('cobs2').value.trim(), estado:$('cestado')?.value||'', pid:pid||null, svid:svid||null, lat, lng, aiu:{adm:aiuAdm, imp:aiuImp, util:aiuUtil} };
  if(obrasVigiladas !== undefined) data.obrasVigiladas = obrasVigiladas;

  if(id && id !== 'null') { Object.assign(D.ct.find(c => c.id == id), data); }
  else { data.id = Date.now(); D.ct.push(data); }

  save(); closeModal();
  // Si ctPage está abierto, refrescar la página del contrato
  const pg2 = document.getElementById('ctPage');
  if(pg2 && pg2.classList.contains('on')) {
    const savedId = id && id !== 'null' ? id : D.ct[D.ct.length-1]?.id;
    if(savedId) { setTimeout(function(){ verCt(savedId); }, 50); }
  } else { render(); }
  toast('Contrato guardado');
}

function toggleObrasVigiladas() {
  const tipoSel = document.getElementById('cti');
  const pidSel  = document.getElementById('cpid');
  const wrap    = document.getElementById('obras_vigiladas_wrap');
  const list    = document.getElementById('obras_vigiladas_list');
  if(!wrap || !list || !tipoSel) return;

  const tipo  = tipoSel.value;
  const pidVal = pidSel ? pidSel.value : null;

  if(tipo !== 'interventoria' || !pidVal) {
    wrap.style.display = 'none';
    return;
  }

  // Obtener el contrato padre
  const padre = D.ct.find(x => String(x.id) === String(pidVal));
  if(!padre) { wrap.style.display = 'none'; return; }

  // Hermanos tipo obra (mismo padre, tipo obra o consultoria, distintos a este)
  const hermanos = D.ct.filter(x =>
    String(x.pid) === String(pidVal) &&
    (x.tipo === 'obra' || x.tipo === 'consultoria')
  );

  if(!hermanos.length) {
    wrap.style.display = 'block';
    list.innerHTML = '<div style="font-size:12px;color:var(--mu);font-style:italic">No hay contratos de obra o consultoría en el mismo interadministrativo.</div>';
    return;
  }

  // Leer selección previa del contrato en edición
  const editId = document.querySelector('#mFoot .btn.bgr')?.getAttribute('onclick')?.match(/saveCt\((\d+)/)?.[1];
  const ctEdit = editId ? D.ct.find(x => String(x.id) === editId) : null;
  const yaVigiladas = ctEdit?.obrasVigiladas || [];

  list.innerHTML = hermanos.map(function(h) {
    const checked = yaVigiladas.includes(h.id) ? 'checked' : '';
    const pct = pctReal(h.id);
    const val = h.valor ? ' · ' + cop(h.valor) : '';
    return '<label style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;background:var(--sf2);font-size:12px">' +
      '<input type="checkbox" value="' + h.id + '" ' + checked + ' style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer">' +
      '<span style="flex:1">' +
        '<b>' + (h.num||'—') + '</b> — ' + (h.obj||'').substring(0,60) +
        '<span style="color:var(--mu)">' + val + '</span>' +
      '</span>' +
      '<span style="font-weight:700;color:var(--gr);font-size:13px">' + pct + '%</span>' +
    '</label>';
  }).join('');

  wrap.style.display = 'block';
}

function delCt(id) {
  if(!confirm('¿Eliminar este contrato y todos sus derivados y datos asociados?')) return;
  if(ctPageCid == id) { cerrarCtPage(); }
  function rm(cid) {
    kids(cid).forEach(h => rm(h.id));
    D.ct  = D.ct.filter(c  => c.id  != cid);
    D.pr  = D.pr.filter(p  => p.cid != cid);
    D.ad  = D.ad.filter(a  => a.cid != cid);
    D.ac  = D.ac.filter(a  => a.cid != cid);
    D.pl  = D.pl.filter(p  => p.cid != cid);
    D.su  = D.su.filter(s  => s.cid != cid);
    D.co  = D.co.filter(x  => x.cid != cid);
    D.cta = D.cta.filter(x => x.cid != cid);
    D.pa  = D.pa.filter(p  => p.cid != cid);
    // Limpiar obrasVigiladas que apunten a este contrato
    D.ct.forEach(c => { if(c.obrasVigiladas) c.obrasVigiladas = c.obrasVigiladas.filter(id => id != cid); });
  }
  rm(id); save(); render(); toast('Contrato eliminado');
}

function toggleGrupoAp(header) {
  const body = header.nextElementSibling;
  const arrow = header.querySelector('.grupo-arrow');
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : '';
  if(arrow) arrow.style.transform = isOpen ? 'rotate(-90deg)' : 'rotate(0deg)';
}

function gestionarGruposAp() {
  // Lista todos los grupos existentes con opción de renombrar o fusionar
  const SIN_GRUPO = '(Sin profesión)';
  const grupos = {};
  D.ap.forEach(ap => {
    const key = (ap.profesion||'').trim() || SIN_GRUPO;
    if(!grupos[key]) grupos[key] = 0;
    grupos[key]++;
  });
  const keys = Object.keys(grupos).sort((a,b)=>{
    if(a===SIN_GRUPO) return 1; if(b===SIN_GRUPO) return -1;
    return a.localeCompare(b,'es');
  });

  let rows = keys.map(k => `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd2)">
      <div style="flex:1">
        <input class="grupo-edit-input" data-original="${k.replace(/"/g,'&quot;')}"
               value="${k===SIN_GRUPO?'':k}"
               placeholder="Nombre del grupo"
               style="width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;padding:7px 10px;font-family:'Instrument Sans',sans-serif;font-size:13px;color:var(--tx);outline:none"
               ${k===SIN_GRUPO?'disabled style="width:100%;background:var(--sf3);border:1px solid var(--bd);border-radius:7px;padding:7px 10px;font-family:inherit;font-size:13px;color:var(--mu);outline:none"':''}>
      </div>
      <span style="font-size:11px;color:var(--mu);white-space:nowrap">${grupos[k]} persona${grupos[k]!==1?'s':''}</span>
    </div>`).join('');

  $('mTitle').textContent = 'Gestionar grupos de profesión';
  $('mBody').innerHTML = `
    <p style="font-size:12.5px;color:var(--mu2);margin-bottom:16px;line-height:1.6">
      Edita los nombres de los grupos. Al guardar, todas las personas de cada grupo se actualizan automáticamente.
    </p>
    <div>${rows}</div>
    <div style="margin-top:14px;padding:10px 14px;background:var(--sf2);border-radius:8px;font-size:11.5px;color:var(--mu2)">
      💡 Para mover una persona a otro grupo, edítala directamente y cambia su profesión.
    </div>`;
  $('mFoot').innerHTML = `
    <button class="btn bgh" onclick="closeModal()">Cancelar</button>
    <button class="btn bgr" onclick="guardarGruposAp()">Guardar cambios</button>`;
  openModal();
}

function guardarGruposAp() {
  const inputs = document.querySelectorAll('.grupo-edit-input:not([disabled])');
  let cambios = 0;
  inputs.forEach(inp => {
    const original = inp.dataset.original;
    const nuevo = inp.value.trim();
    if(nuevo && nuevo !== original) {
      D.ap.forEach(ap => {
        if((ap.profesion||'').trim() === original) {
          ap.profesion = nuevo;
          cambios++;
        }
      });
    }
  });
  save(); closeModal(); render();
  toast(cambios > 0 ? cambios + ' persona(s) actualizadas' : 'Sin cambios');
}

function delAp(id) {
  if(!confirm('¿Eliminar este apoyo? Se quitará de todos los contratos asignados.')) return;
  D.ap = D.ap.filter(a => a.id != id);
  D.cta = D.cta.filter(a => a.apid != id);
  save(); render(); toast('Apoyo eliminado');

function addCtaAp(apid) {

}

// ─── INFORME DE CORTE ────────────────────────────────────
function generarInforme() {
  const cid = Number($('pjSel')?.value); if(!cid) { toast('Selecciona un contrato primero', true); return; }
  const c   = D.ct.find(x => x.id == cid); if(!c) return;
  const sv  = svEfectivo(c);
  const cut = $('gp_cut_'+cid)?.value || today();
  const allActs = D.ac.filter(a => a.cid == cid);

  // ── Aplanar árbol en orden WBS ──────────────────────────
  function flatten(pid, lvl) {
    const ch = D.ac.filter(a => a.cid == cid && String(a.pid) === String(pid||'null')||(!pid && !a.pid));
    let out = [];
    ch.forEach(a => { out.push({...a, lvl}); out = out.concat(flatten(a.id, lvl+1)); });
    return out;
  }
  // Root acts (no pid)
  function flattenAll() {
    let out = [];
    function walk(pid, lvl) {
      D.ac.filter(a => a.cid == cid && (pid ? String(a.pid)===String(pid) : !a.pid)).forEach(a => {
        out.push({...a, lvl});
        walk(a.id, lvl+1);
      });
    }
    walk(null, 0);
    return out;
  }
  const flat = flattenAll();

  // ── Curva S — puntos semanales ──────────────────────────
  const range = ganttDateRange(cid);
  const sCurve = { labels:[], est:[], real:[] };
  if(range && allActs.length) {
    const { minMs, maxMs } = range;
    const totalDays = Math.ceil((maxMs - minMs) / 86400000) + 1;
    const step = Math.max(1, Math.ceil(totalDays / 20));
    for(let ms = minMs; ms <= maxMs + 86400000; ms += step * 86400000) {
      const d = isoDateLocal(new Date(ms));
      const roots = D.ac.filter(a => a.cid == cid && !a.pid);
      const e = roots.length ? Math.round(roots.reduce((s,a) => s + computeEst(a, cid, d), 0) / roots.length) : 0;
      sCurve.labels.push(new Date(ms).toLocaleDateString('es-CO', {day:'2-digit', month:'short'}));
      sCurve.est.push(e);
      sCurve.real.push(d <= cut ? computeRealGlobal(cid, d) : null);
    }
  }

  // helper: avance real ponderado global a una fecha (interpola)
  function computeRealGlobal(cid, atDate) {
    const roots = D.ac.filter(a => a.cid == cid && !a.pid);
    if(!roots.length) return 0;
    // Estimado a atDate / estimado al corte * real actual
    const estAtDate = roots.reduce((s,a)=>s+computeEst(a,cid,atDate),0)/roots.length;
    const estAtCut  = roots.reduce((s,a)=>s+computeEst(a,cid,cut),0)/roots.length;
    const realNow   = roots.reduce((s,a)=>s+computeReal(a,cid),0)/roots.length;
    if(!estAtCut) return 0;
    return Math.round(Math.min(realNow, realNow * estAtDate / estAtCut));
  }

  // ── Resumen actividades ─────────────────────────────────
  const estGlobal  = (() => { const r=D.ac.filter(a=>a.cid==cid&&!a.pid); return r.length?Math.round(r.reduce((s,a)=>s+computeEst(a,cid,cut),0)/r.length):0; })();
  const realGlobal = (() => { const r=D.ac.filter(a=>a.cid==cid&&!a.pid); return r.length?Math.round(r.reduce((s,a)=>s+computeReal(a,cid),0)/r.length):0; })();
  const difGlobal  = realGlobal - estGlobal;
  const semaforo   = difGlobal >= 0 ? '#1a8a4a' : difGlobal >= -10 ? '#c07a20' : '#C8232A';
  const semaforoTxt= difGlobal >= 0 ? 'EN PLAZO' : difGlobal >= -10 ? 'EN ALERTA' : 'EN RETRASO';

  // ── Construir HTML del informe ──────────────────────────
  const estPorAct = flat.map(a => ({
    nombre: a.nombre, lvl: a.lvl,
    est: computeEst(a, cid, cut),
    real: computeReal(a, cid),
    hasKids: D.ac.some(x => x.cid==cid && String(x.pid)===String(a.id)),
    fstart: a.fstart, fend: a.fend, resp: a.resp||''
  }));

  const html = `<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

function vAddrBuscar() {

  var res = document.getElementById('vaddr-results');
  if(!inp || !res) return;
  var q = (inp.value||'').trim();
  if(!q) return;

  // Mapbox Geocoding API — mejor precisión para Colombia
  var token = 'pk.eyJ1IjoibWFyaWFuYTI0MDYiLCJhIjoiY21yZ3gzeXdjMDMxbjQ5b2lkd2ZxbTdnbSJ9.PHhvvNUm_yZH_D7eQr8ZkQ';
  var url = 'https://api.mapbox.com/geocoding/v5/mapbox.places/'
    + encodeURIComponent(q)
    + '.json?access_token=' + token
    + '&language=es&country=co&limit=5'
    + '&proximity=-75.3741,6.1549';  // centrado en Rionegro

  res.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:var(--mu)">Buscando…</div>';
  res.style.display = 'block';

  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data) {
      var features = data.features || [];
      if(!features.length) {
        res.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:var(--mu)">Sin resultados. Intenta con otro término.</div>';
        return;
      }
      res.innerHTML = '';
      features.forEach(function(f) {
        var el = document.createElement('div');
        el.style.cssText = 'padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bd);font-size:12.5px;color:var(--tx);transition:background .1s';
        el.addEventListener('mouseover', function(){ this.style.background='var(--sf2)'; });
        el.addEventListener('mouseout',  function(){ this.style.background=''; });
        var lng = f.center[0], lat = f.center[1];
        var name = f.place_name || f.text || '';
        var mainName = f.text || name.split(',')[0];
        var subName  = name.substring(mainName.length).replace(/^,\s*/,'');
        (function(lt, ln, nm) {
          el.addEventListener('click', function(){ vAddrSelect(lt, ln, nm); });
        })(lat, lng, name.substring(0,80));
        el.innerHTML = '<div style="font-weight:600">' + mainName + '</div>'
          + (subName ? '<div style="font-size:11px;color:var(--mu);margin-top:2px">' + subName.substring(0,70) + '</div>' : '');
        res.appendChild(el);
      });
    })
    .catch(function() {
      res.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:var(--accent)">Error al buscar. Verifica tu conexión.</div>';
    });
}

function vSemColor(pct){
  return pct>=80?'#16a34a':pct>=40?'#d97706':'#C8232A';
}

function vRMk(list){
  vMk.forEach(function(m){vM&&vM.removeLayer(m);});vMk=[];if(!vM)return;
  if(!vCl){
    // Modo individual: un marcador por obra
    list.forEach(function(c){
      var pct=pctReal(c.id);
      var col=vSemColor(pct);
      var m=L.marker([c.lat,c.lng],{icon:vMkI(col,pct,c.num)});
      m.bindTooltip(
        '<div style="font-family:\'Instrument Sans\',sans-serif;padding:4px 2px">'
        +'<div style="font-weight:700;font-size:12px">'+c.num+'</div>'
        +'<div style="font-size:11px;color:#666;max-width:200px">'+c.obj.substring(0,60)+'</div>'
        +'<div style="font-weight:700;color:'+col+';margin-top:3px">'+pct+'% ejecutado</div>'
        +'</div>',
        {direction:'top',offset:[0,-28],className:'vmk-tt'}
      );
      (function(id){m.on('click',function(){vSO(id);});})(c.id);
      m.addTo(vM);vMk.push(m);
    });
  }else{
    // Modo agrupado
    var used=[],cls=[];
    list.forEach(function(c,i){
      if(used.indexOf(i)>=0)return;
      var g=[c];used.push(i);
      list.forEach(function(c2,j){
        if(used.indexOf(j)>=0)return;
        if(Math.sqrt(Math.pow(c.lat-c2.lat,2)+Math.pow(c.lng-c2.lng,2))<0.035){g.push(c2);used.push(j);}
      });
      cls.push(g);
    });
    cls.forEach(function(g){
      var lat=g.reduce(function(s,c){return s+c.lat;},0)/g.length;
      var lng=g.reduce(function(s,c){return s+c.lng;},0)/g.length;
      if(g.length===1){
        var c=g[0];
        var pct=pctReal(c.id);
        var col=vSemColor(pct);
        var m=L.marker([lat,lng],{icon:vMkI(col,pct,c.num)});
        m.bindTooltip(c.num+' · '+pct+'%',{direction:'top',offset:[0,-28],className:'vmk-tt'});
        (function(id){m.on('click',function(){vSO(id);});})(c.id);
        m.addTo(vM);vMk.push(m);
      }else{
        var avgPct=Math.round(g.reduce(function(s,c){return s+pctReal(c.id);},0)/g.length);
        var col=vSemColor(avgPct);
        var m=L.marker([lat,lng],{icon:vMkC(col,g.length,avgPct)});
        m.bindTooltip(g.length+' obras · '+avgPct+'% promedio',{direction:'top',offset:[0,-28],className:'vmk-tt'});
        (function(z,lz){m.on('click',function(){vM.setView([z,lz],vM.getZoom()+2);});})(lat,lng);
        m.addTo(vM);vMk.push(m);
      }
    });
  }
}
