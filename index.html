<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDESO · Panel Gerencial</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f3f8;--sf:#ffffff;--sf2:#f5f7fb;--sf3:#edf0f7;
  --bd:#dde2ec;--bd2:#c8d0e0;
  --tx:#1a2035;--mu:#6b7a99;--mu2:#4a5880;
  --gr:#16a34a;--gr-d:#dcfce7;--gr-t:#15803d;
  --am:#d97706;--am-d:#fef3c7;--am-t:#b45309;
  --rd:#dc2626;--rd-d:#fee2e2;--rd-t:#b91c1c;
  --bl:#2563eb;--bl-d:#dbeafe;--bl-t:#1d4ed8;
  --pu:#7c3aed;--pu-d:#ede9fe;--pu-t:#6d28d9;
  --go:#d97706;
  --accent:#C8232A;--accent-d:#fee2e2;--accent-t:#a01c22;
  --card-shadow:0 2px 12px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);
  --card-shadow-hover:0 8px 28px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.06);
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Instrument Sans',sans-serif;font-size:15.5px;line-height:1.55;overflow:hidden}
/* SHELL */
/* shell defined below */
/* TOPBAR */
.topbar{grid-column:1/-1;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 28px;gap:18px;box-shadow:0 1px 8px rgba(0,0,0,.07);height:58px}
.brand{font-family:'Instrument Sans',sans-serif;font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.brand em{color:var(--accent);font-style:normal}
.tsub{font-size:12px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;padding-left:18px;border-left:1px solid var(--bd2)}
.tright{margin-left:auto;font-size:12px;color:var(--mu2);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gr)}
/* NAV */
.ni svg{width:16px;height:16px;flex-shrink:0}
.nc{margin-left:auto;background:var(--sf3);color:var(--mu2);font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--bd)}
main{overflow-y:auto;padding:32px 36px;background:var(--sf2)}
/* KPI */
.krow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:28px}
.kcard{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:22px 24px;position:relative;overflow:hidden;box-shadow:var(--card-shadow);transition:transform .15s,box-shadow .15s}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--card-shadow-hover)}
.kcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gr),rgba(22,163,74,.35))}
.kcard.am::before{background:linear-gradient(90deg,var(--am),rgba(217,119,6,.35))}.kcard.rd::before{background:linear-gradient(90deg,var(--rd),rgba(220,38,38,.35))}.kcard.bl::before{background:linear-gradient(90deg,var(--bl),rgba(37,99,235,.35))}.kcard.go::before{background:linear-gradient(90deg,var(--go),rgba(217,119,6,.35))}
.klbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin-bottom:10px;font-weight:600}
.kval{font-family:'Instrument Sans',sans-serif;font-size:32px;font-weight:800;line-height:1;color:var(--tx);letter-spacing:-.02em}
.kval.sm{font-size:18px}
.ksub{font-size:11px;color:var(--mu);margin-top:8px}
.kbar{height:5px;background:var(--sf3);border-radius:3px;margin-top:12px;overflow:hidden}
.kfill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gr),rgba(22,163,74,.7))}
.kfill.am{background:linear-gradient(90deg,var(--am),rgba(217,119,6,.7))}.kfill.rd{background:linear-gradient(90deg,var(--rd),rgba(220,38,38,.7))}
/* PANEL */
.pgrid{display:grid;gap:18px;margin-bottom:18px}
.pgrid.c2{grid-template-columns:1fr 1fr}.pgrid.c32{grid-template-columns:3fr 2fr}
.panel{background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:var(--card-shadow)}
.ph{padding:16px 22px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--sf2)}
.ptitle{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mu2);font-weight:700}
.pact{font-size:12px;color:var(--accent);cursor:pointer;padding:6px 14px;border:1px solid rgba(200,35,42,.25);border-radius:8px;background:none;font-family:'Instrument Sans',sans-serif;transition:all .15s;font-weight:600;letter-spacing:.01em}
.pact:hover{background:var(--accent-d);border-color:rgba(230,57,70,.4)}
.pb{padding:22px}
/* TABLE */
.etbl{width:100%;border-collapse:collapse}
.etbl th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);padding:12px 14px;text-align:left;font-weight:700;border-bottom:2px solid var(--bd2);white-space:nowrap;background:var(--sf2)}
.etbl td{padding:13px 14px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
.etbl tr:last-child td{border-bottom:none}
.etbl tr:hover td{background:rgba(200,35,42,.03)}
.nc2{font-family:'Instrument Sans',sans-serif;font-size:12px;color:var(--mu2)}
.oc{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc{color:var(--bl);font-size:13px}
.dc{font-size:12px;color:var(--mu2)}
/* BADGE */
.b{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:500}
.bd_{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.bg{background:var(--gr-d);color:var(--gr-t)}.bg .bd_{background:var(--gr)}
.bw{background:var(--am-d);color:var(--am-t)}.bw .bd_{background:var(--am)}
.br{background:var(--rd-d);color:var(--rd-t)}.br .bd_{background:var(--rd)}
.bi{background:var(--bl-d);color:var(--bl-t)}.bi .bd_{background:var(--bl)}
.bp{background:var(--pu-d);color:var(--pu-t)}
.bmu{background:#e8eaed;color:#5a6278}.bp .bd_{background:var(--pu)}
/* ALERT ITEMS */
.ait{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--bd)}
.ait:last-child{border-bottom:none}
.aico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-weight:800}
.aw{background:rgba(245,158,11,.15);color:var(--am)}.ar{background:rgba(239,68,68,.15);color:var(--rd)}
.ab{flex:1;min-width:0}
.at2{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am2{font-size:12px;color:var(--mu);margin-top:3px}
/* AVATAR */
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-d);border:2px solid rgba(200,35,42,.2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent);font-weight:700;flex-shrink:0;letter-spacing:.04em;box-shadow:0 2px 6px rgba(200,35,42,.1)}
/* TREE */
.tn{margin-bottom:2px}
.th2{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:5px;cursor:pointer;transition:background .1s;border-left:2px solid transparent}
.th2:hover{background:var(--sf3)}
.l0{border-left-color:var(--accent);background:rgba(200,35,42,.04)}
.l1{border-left-color:var(--bl);background:rgba(30,111,176,.04)}
.l2{border-left-color:var(--pu);background:rgba(92,79,181,.03)}
.l3{border-left-color:var(--mu);background:rgba(0,0,0,.015)}
.tarr{width:14px;text-align:center;font-size:9px;color:var(--mu);flex-shrink:0;transition:transform .15s;display:inline-block}
.tnum{font-family:'Instrument Sans',sans-serif;font-size:11px;color:var(--mu2);min-width:86px;flex-shrink:0}
.tobj{flex:1;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.tmeta{display:flex;align-items:center;gap:5px;flex-shrink:0;flex-wrap:wrap}
.tch{margin-left:22px;padding-left:10px;border-left:1px solid var(--bd);overflow:hidden;max-height:8000px;transition:max-height .3s ease}
.tch.closed{max-height:0}
/* OVERLAY / MODAL */
.ov{position:fixed;inset:0;background:rgba(26,32,53,.45);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.mo{background:#fff;border:1px solid var(--bd);border-radius:16px;width:620px;max-width:96vw;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.18)}
.mh{padding:18px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--sf2)}
.mh h2{font-family:'Instrument Sans',sans-serif;font-size:15px;font-weight:800;letter-spacing:-.01em}
.mh button{background:none;border:none;color:var(--mu);cursor:pointer;font-size:18px;line-height:1}
.mh button:hover{color:var(--tx)}
.mb{padding:22px 24px;flex:1}
.mf{padding:14px 24px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
/* FORM */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.full{grid-column:1/-1}
.fl2{display:flex;flex-direction:column;gap:5px}
.fl2 label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.fl2 input,.fl2 select,.fl2 textarea{background:#fff;border:1px solid var(--bd2);border-radius:8px;padding:9px 12px;color:var(--tx);font-family:'Instrument Sans',sans-serif;font-size:13px;outline:none;transition:border .12s,box-shadow .12s;width:100%}
.fl2 input:focus,.fl2 select:focus,.fl2 textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-d)}
.fl2 select option{background:#fff}
.fl2 textarea{resize:vertical;min-height:60px}
.btn{padding:9px 18px;border-radius:9px;border:none;cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13.5px;font-weight:600;transition:all .15s;white-space:nowrap}
.bgh{background:var(--sf2);border:1px solid var(--bd2);color:var(--mu2)}.bgh:hover{border-color:var(--tx);color:var(--tx);background:var(--sf3)}
.bgr{background:var(--accent);color:#fff;box-shadow:0 2px 8px var(--accent-d)}.bgr:hover{background:var(--accent-t);box-shadow:0 4px 12px rgba(230,57,70,.3)}
.brd{background:none;border:1px solid rgba(200,35,42,.25);color:var(--accent)}.brd:hover{background:var(--accent-d)}
.bbl{background:none;border:1px solid rgba(30,111,176,.25);color:var(--bl)}.bbl:hover{background:var(--bl-d)}
.bpu{background:none;border:1px solid rgba(92,79,181,.25);color:var(--pu)}.bpu:hover{background:var(--pu-d)}
.sm{padding:4px 11px;font-size:12px}
/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:18px;gap:2px}
.tab{padding:9px 18px;font-size:12.5px;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;border-radius:6px 6px 0 0}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-d)}
.tp{display:none}.tp.on{display:block}
/* INFO GRID */
.ig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:12px}
.ic{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:13px 16px}
.il{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--mu);margin-bottom:4px}
.iv{font-size:14.5px;font-weight:500}
.iv.m{color:var(--bl)}
/* SUB ITEMS */
.si{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:8px;transition:box-shadow .12s}
.si.p{border-left:2px solid var(--bl)}.si.a{border-left:2px solid var(--go)}.si.s{border-left:2px solid var(--pu)}
.sih{font-size:13.5px;font-weight:500}
.sim{font-size:12px;color:var(--mu);margin-top:4px}
/* GANTT */
.gwrap{overflow-x:auto;margin-top:4px}
.gtbl{border-collapse:collapse;min-width:660px;width:100%}
.gtbl th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding:6px 10px;border-bottom:1px solid var(--bd);text-align:left;font-weight:500;background:var(--sf2);white-space:nowrap}
.gtbl td{padding:5px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.gtbl tr:last-child td{border-bottom:none}
.gtbl tr:hover td{background:var(--sf2)}
.gbg{background:var(--sf3);border:1px solid var(--bd);border-radius:3px;height:16px;position:relative;overflow:hidden}
.gest{position:absolute;top:0;bottom:0;background:rgba(200,35,42,.12);border-radius:3px}
.greal{position:absolute;top:3px;bottom:3px;background:var(--accent);border-radius:2px}
.pinp{background:var(--sf2);border:1px solid var(--bd);border-radius:4px;padding:3px 6px;color:var(--tx);font-family:'Instrument Sans',sans-serif;font-size:12px;width:52px;outline:none;text-align:right}
.pinp:focus{border-color:var(--accent)}
.pdelta{font-size:10px;padding:2px 6px;border-radius:3px}
.dp{background:rgba(26,138,74,.12);color:var(--gr-t)}.dn{background:rgba(200,35,42,.1);color:var(--accent-t)}.dz{background:var(--sf2);color:var(--mu2)}
/* GANTT SUMMARY */
.gsum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.gsc{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 16px;text-align:center;box-shadow:var(--card-shadow)}
.gsv{font-family:'Instrument Sans',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.02em}
.gsl{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--mu);margin-top:5px;font-weight:600}
/* CUTDATE ROW */
.cdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cdr label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.cdr input[type=date]{background:var(--sf2);border:1px solid var(--bd2);border-radius:4px;padding:5px 9px;color:var(--tx);font-size:12px;font-family:'Instrument Sans',sans-serif;outline:none}
.cdr input[type=date]:focus{border-color:var(--am)}
/* EMPTY */
.emp{text-align:center;padding:40px 32px;color:var(--mu);font-size:12.5px;line-height:1.7}
/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:#fff;border:1px solid var(--bd);border-left:3px solid var(--gr);border-radius:10px;padding:14px 20px;font-size:14px;color:var(--tx);z-index:999;transform:translateY(20px);opacity:0;transition:all .25s;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.14)}
.toast.on{transform:translateY(0);opacity:1}
.toast.e{border-left-color:var(--accent)}
.gbc{width:200px;min-width:200px;padding:5px 10px}
.gcut{position:absolute;top:0;bottom:0;width:2px;background:var(--am);z-index:2}
.gn{max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.ptg{font-family:'Instrument Sans',sans-serif;font-size:24px;font-weight:700;margin-bottom:24px;color:var(--tx)}
.row-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
/* ── VISOR ─────────────────────────────────────────────── */
.visor-shell{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 57px);margin:-32px -36px -32px -36px;overflow:hidden}
/* Sidebar */
.vsb{background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.vsb-hd{padding:16px 18px 12px;border-bottom:1px solid var(--bd);background:var(--sf2)}
.vsb-tt{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:12px;letter-spacing:-.01em}
.vsrch{position:relative}
.vsrch input{width:100%;background:#fff;border:1.5px solid var(--bd);border-radius:9px;padding:9px 12px 9px 34px;color:var(--tx);font-family:'Instrument Sans',sans-serif;font-size:13px;outline:none;transition:border .12s,box-shadow .12s}
.vsrch input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-d)}
.vsrch-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:14px;pointer-events:none}
/* Filtros supervisor */
.vsv-fltrs{padding:10px 14px;border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:5px;max-height:80px;overflow-y:auto}
.vchip{padding:4px 11px;border-radius:12px;border:1px solid var(--bd);background:var(--sf3);cursor:pointer;font-size:11px;color:var(--mu2);font-family:'Instrument Sans',sans-serif;transition:all .15s;font-weight:500;white-space:nowrap}
.vchip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-d)}
.vchip.on{color:#fff;border-color:transparent;background:var(--accent)}
/* Lista contratos */
.vlst{flex:1;overflow-y:auto;padding:8px}
/* Grupo IA en lista */
.via-group{margin-bottom:8px;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.via-hd{padding:8px 12px;background:var(--sf2);display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:1px solid var(--bd)}
.via-hd-num{font-size:11px;font-weight:700;color:var(--accent)}
.via-hd-obj{font-size:10.5px;color:var(--mu);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard{padding:10px 12px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--bd)}
.vcard:last-child{border-bottom:none}
.vcard:hover{background:var(--sf2)}
.vcard.sel{background:rgba(200,35,42,.04);border-left:3px solid var(--accent)}
/* Marcador mapa */
.vmk{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-family:'Instrument Sans',sans-serif;cursor:pointer;transition:transform .15s;box-shadow:0 3px 14px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.9)}
.vmk:hover{transform:scale(1.15)}
/* Mapa */
.vmw{position:relative;overflow:hidden;height:100%}
#vmap{width:100%;height:100%}
.leaflet-container{background:#e8eaf0 !important}
.vmk-tt{background:#fff!important;border:1px solid var(--bd)!important;border-radius:8px!important;color:var(--tx)!important;font-family:'Instrument Sans',sans-serif!important;box-shadow:0 4px 16px rgba(0,0,0,.12)!important;padding:6px 10px!important}
.vmk-tt .leaflet-tooltip-tip{border-top-color:#fff!important}
/* Stats bar */
.vstats{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:400;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:22px;padding:8px 20px;display:flex;align-items:center;gap:18px;box-shadow:0 4px 24px rgba(0,0,0,.12)}
.vst{text-align:center}
.vst-v{font-family:'Instrument Sans',sans-serif;font-size:17px;font-weight:700;line-height:1;color:var(--tx)}
.vst-l{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.vdv{width:1px;height:24px;background:var(--bd2)}
/* Panel detalle */
.vdet{position:absolute;right:16px;top:16px;width:320px;background:#fff;border-radius:16px;z-index:500;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.22);display:none;max-height:calc(100vh - 100px);overflow-y:auto}
.vdet.on{display:block;animation:vsl .2s cubic-bezier(.16,1,.3,1)}
@keyframes vsl{from{opacity:0;transform:translateX(12px) scale(.98)}to{opacity:1;transform:translateX(0) scale(1)}}
.vdb{height:4px;width:100%}
.vdh{padding:14px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.vdx{background:rgba(0,0,0,.06);border:none;color:var(--mu);cursor:pointer;font-size:13px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s}
.vdx:hover{background:rgba(0,0,0,.12);color:var(--tx)}
.vdbody{padding:0 16px 16px}
.vdprog{background:var(--sf2);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.vdpct{font-family:'Instrument Sans',sans-serif;font-size:36px;font-weight:900;line-height:1;letter-spacing:-.02em}
.vdplbl{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;font-weight:600}
.vdpbg{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:10px}
.vdpfl{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.vdgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.vdit{background:var(--sf2);border-radius:8px;padding:10px 12px}
.vdil{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-bottom:4px;font-weight:600}
.vdiv2{font-size:12.5px;font-weight:500;line-height:1.3;color:var(--tx)}.vdfu{grid-column:1/-1}
.vdeta{display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--sf2);border-radius:8px;margin-bottom:12px}
.vdetd{width:8px;height:8px;border-radius:50%}.vdett{font-size:12.5px;font-weight:600}
/* Controles mapa */
.vmctrl{position:absolute;bottom:20px;left:16px;z-index:400;display:flex;flex-direction:column;gap:6px}
.vmcb{background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:8px;padding:7px 13px;color:var(--mu2);font-size:11.5px;cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:all .15s;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.vmcb:hover{background:var(--sf3);color:var(--tx)}
.vmcb.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* Leyenda */
.vleg{position:absolute;bottom:20px;right:16px;z-index:400;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.vlegt{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);margin-bottom:8px;font-weight:600}
.vlegi{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11px;color:var(--mu2)}
.vlegd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.vcoh{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:400;background:var(--am);color:#fff;border-radius:8px;padding:8px 18px;font-size:12.5px;font-weight:600;white-space:nowrap;display:none;box-shadow:0 4px 16px rgba(217,119,6,.4)}
.mov2{position:fixed;inset:0;background:rgba(26,32,53,.45);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.mov2.on{display:flex}

/* ── SPLASH / PANTALLA DE INICIO ─────────────────────── */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:#ffffff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;
  transition:opacity .6s ease, transform .6s ease;
}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none;}
.splash-logo{width:340px;max-width:80vw;animation:logoIn .8s cubic-bezier(.16,1,.3,1) both;}
@keyframes logoIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.splash-title{
  font-family:'Instrument Sans',sans-serif;
  font-size:clamp(2.2rem,5vw,3.6rem);
  font-weight:800;
  letter-spacing:-.02em;
  color:#1a2035;
  letter-spacing:-.01em;
  margin-top:32px;
  text-align:center;
  animation:titleIn .9s .2s cubic-bezier(.16,1,.3,1) both;
}
@keyframes titleIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.splash-sub{
  font-family:'Instrument Sans',sans-serif;
  font-size:clamp(.9rem,2vw,1.15rem);
  font-weight:400;
  color:#6b7a99;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-top:10px;
  text-align:center;
  animation:subIn .9s .35s cubic-bezier(.16,1,.3,1) both;
}
@keyframes subIn{from{opacity:0}to{opacity:1}}
.splash-line{
  width:60px;height:3px;background:#C8232A;border-radius:2px;
  margin-top:28px;
  animation:lineIn .8s .5s cubic-bezier(.16,1,.3,1) both;
}
@keyframes lineIn{from{opacity:0;width:0}to{opacity:1;width:60px}}
.splash-btn{
  margin-top:48px;
  background:#C8232A;color:#fff;border:none;border-radius:10px;
  padding:15px 52px;
  font-family:'Instrument Sans',sans-serif;font-size:1rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 8px 32px rgba(200,35,42,.32);
  transition:all .18s;
  animation:btnIn 1s .6s cubic-bezier(.16,1,.3,1) both;
}
@keyframes btnIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.splash-btn:hover{background:#a01c22;box-shadow:0 12px 32px rgba(200,35,42,.38);transform:translateY(-2px);}
.splash-btn:active{transform:translateY(0);}
.splash-ver{
  position:absolute;bottom:24px;
  font-size:11px;color:#c0c5d0;font-family:'Instrument Sans',sans-serif;
  animation:subIn 1s 1s both;
  letter-spacing:.1em;
}


/* ── PÁGINA DEDICADA CONTRATO ────────────────────────── */
#ctPage{display:none;flex-direction:column;height:calc(100vh - 56px);overflow:hidden;background:var(--bg);position:relative}
#ctPage.on{display:flex}
.ctp-hd{background:#fff;border-bottom:1px solid var(--bd);padding:0 32px;flex-shrink:0}
.ctp-hd-top{display:flex;align-items:center;gap:14px;padding:14px 0 10px}
.ctp-back{background:none;border:1px solid var(--bd2);border-radius:6px;padding:5px 12px;color:var(--mu2);font-size:12px;cursor:pointer;font-family:'Instrument Sans',sans-serif;display:flex;align-items:center;gap:6px;transition:all .12s}
.ctp-back:hover{border-color:var(--bd);color:var(--tx)}
.ctp-num{font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.ctp-obj{font-size:18px;font-weight:700;color:var(--tx);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctp-meta{font-size:11.5px;color:var(--mu2);padding-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctp-tabs{display:flex;gap:0;border-top:1px solid var(--bd);margin:0 -32px;padding:0 32px}
.ctp-tab{padding:10px 18px;font-size:12.5px;font-weight:500;color:var(--mu2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;font-family:'Instrument Sans',sans-serif}
.ctp-tab:hover{color:var(--tx)}
.ctp-tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.ctp-body{flex:1;overflow-y:auto;padding:28px 32px;background:var(--sf2)}
.ctp-pane{display:none}
.ctp-pane.on{display:block}
/* Grid 2 cols for info */
.ct-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:900px){.ct-info-grid{grid-template-columns:1fr}}
.ct-info-card{background:#fff;border-radius:12px;padding:20px 22px;border:1px solid var(--bd);box-shadow:var(--card-shadow)}
.ct-info-card h3{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:14px;font-weight:600}
.ct-field{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--bd2)}
.ct-field:last-child{border-bottom:none}
.ct-fl{font-size:12px;color:var(--mu2);min-width:120px}
.ct-fv{font-size:12.5px;font-weight:500;color:var(--tx);text-align:right;flex:1}
.ct-fv.money{color:var(--bl);font-weight:700}
.ct-fv.accent{color:var(--accent)}


/* ── DASHBOARD NUEVO ─────────────────────────────────────── */
.dash-bg{background:var(--sf2);min-height:calc(100vh - 56px);margin:-28px -32px;padding:28px 32px}
.krow2{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.kcard2{background:#fff;border-radius:14px;border:1px solid var(--bd);padding:20px 22px;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.kcard2:hover{transform:translateY(-2px);box-shadow:var(--card-shadow-hover)}
.kcard2 .klbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:10px;font-weight:700}
.kcard2 .kval2{font-size:32px;font-weight:900;line-height:1;color:var(--tx);letter-spacing:-.02em}
.kcard2 .kval2.green{color:var(--gr)}
.kcard2 .kval2.amber{color:#c07a20}
.kcard2 .kval2.red{color:var(--accent)}
.kcard2 .kval2.blue{color:var(--bl)}
.kcard2 .kval2.sm{font-size:18px}
.kcard2 .ksub2{font-size:11px;color:var(--mu);margin-top:5px}
/* tarjetas de contrato */
.ct-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px}
.ctc{background:#fff;border-radius:14px;border:1px solid var(--bd);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.ctc:hover{transform:translateY(-3px);box-shadow:var(--card-shadow-hover)}
.ctc-bar{height:4px;width:100%}
.ctc-body{padding:18px 22px}
.ctc-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.ctc-num{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ctc-obj{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctc-meta{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.ctc-sv{font-size:11.5px;color:var(--mu2)}
.ctc-prog{margin-bottom:11px}
.ctc-prog-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--mu);margin-bottom:5px}
.ctc-track{height:6px;background:var(--sf3);border-radius:3px;overflow:hidden;position:relative}
.ctc-bar-prog{height:100%;border-radius:4px;opacity:.3;position:absolute;top:0;left:0;transition:width .6s ease}
.ctc-bar-real{height:100%;border-radius:4px;position:absolute;top:0;left:0;transition:width .8s .1s ease}
.ctc-foot{display:flex;justify-content:space-between;align-items:center}
.ctc-val{font-size:13px;font-weight:700;color:var(--bl)}
.ctc-dias{font-size:11px}
.ctc-dias.ok{color:var(--gr)}
.ctc-dias.warn{color:#c07a20}
.ctc-dias.danger{color:var(--accent)}
/* alertas */
.alertas-box{background:#fff;border-radius:14px;border:1px solid var(--bd);padding:0}
.alertas-hdr{padding:14px 18px 0;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:600}
.alerta2{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--bd2);transition:background .1s}
.alerta2:last-child{border-bottom:none}
.alerta2:hover{background:var(--sf3)}
.alerta2-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.alerta2-info{flex:1;min-width:0}
.alerta2-num{font-size:11px;font-weight:700;color:var(--tx)}
.alerta2-obj{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alerta2-right{text-align:right;flex-shrink:0}
.alerta2-dias{font-size:12px;font-weight:700}
.alerta2-pct{font-size:10px;color:var(--mu)}
.ds-section{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mu2);font-weight:700;margin-bottom:14px}

/* ── PÁGINA CONTRATO MEJORADA ─────────────────────────────── */
.ctp-hd2{flex-shrink:0;border-bottom:1px solid var(--bd);background:#fff}
.ctp-accent{height:4px;width:100%}
.ctp-hd2-inner{padding:16px 32px 0}
.ctp-top-row{display:flex;align-items:flex-start;gap:16px;margin-bottom:12px}
.ctp-back2{background:none;border:1px solid var(--bd2);border-radius:7px;padding:6px 13px;color:var(--mu2);font-size:12px;cursor:pointer;font-family:'Instrument Sans',sans-serif;display:flex;align-items:center;gap:6px;transition:all .12s;flex-shrink:0;margin-top:2px}
.ctp-back2:hover{border-color:var(--bd);color:var(--tx);background:var(--sf2)}
.ctp-titles{flex:1;min-width:0}
.ctp-tipo{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.ctp-nombre{font-size:19px;font-weight:800;color:var(--tx);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ctp-kpis{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-top:2px}
.ctp-pct{font-size:36px;font-weight:900;line-height:1}
.ctp-meta2{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:10px 0 12px;font-size:12px;color:var(--mu2)}
.ctp-meta2 span{display:flex;align-items:center;gap:5px}
.ctp-tabs2{display:flex;gap:0;margin:0 -32px;padding:0 32px;overflow-x:auto}
.ctp-tab2{padding:11px 18px;font-size:12px;font-weight:500;color:var(--mu2);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;white-space:nowrap;font-family:'Instrument Sans',sans-serif;user-select:none;letter-spacing:.01em}
.ctp-tab2:hover{color:var(--tx)}
.ctp-tab2.on{font-weight:700;border-bottom-color:currentColor}


/* ── FOTOS / AVATARES ─────────────────────────────────────── */
.foto-wrap{display:flex;align-items:center;gap:16px;padding:12px 0}
.foto-preview{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--bd);background:var(--sf3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.foto-preview img{width:100%;height:100%;object-fit:cover}
.foto-preview .av-ini{font-size:22px;font-weight:700;color:var(--accent)}
.foto-btn{font-size:12px;padding:6px 14px}
.av-foto{border-radius:50%;object-fit:cover;object-position:center;flex-shrink:0;border:2px solid var(--bd);display:block}
/* galería contratos */
.ct-fotos{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.ct-foto-item{position:relative;width:90px;height:90px;border-radius:10px;overflow:hidden;border:1px solid var(--bd);cursor:pointer;group}
.ct-foto-item img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.ct-foto-item:hover img{transform:scale(1.05)}
.ct-foto-del{position:absolute;top:4px;right:4px;background:rgba(200,35,42,.85);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.ct-foto-item:hover .ct-foto-del{opacity:1}
.ct-foto-add{width:90px;height:90px;border-radius:10px;border:2px dashed var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--mu);font-size:11px;gap:4px;transition:all .15s}
.ct-foto-add:hover{border-color:var(--accent);color:var(--accent);background:rgba(200,35,42,.04)}
/* lightbox */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:none;align-items:center;justify-content:center}
#lightbox.on{display:flex}
#lightbox img{max-width:90vw;max-height:88vh;border-radius:8px;object-fit:contain}
#lightbox-close{position:fixed;top:20px;right:24px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;opacity:.8;line-height:1}
#lightbox-close:hover{opacity:1}


/* ── GANTT MS PROJECT ────────────────────────────────────── */
.gantt-wrap{display:flex;overflow:hidden;border:1px solid var(--bd);border-radius:12px;background:#fff;box-shadow:var(--card-shadow)}
.gantt-left{flex-shrink:0;width:570px;overflow:hidden;border-right:2px solid var(--bd)}
.gantt-right{flex:1;overflow-x:auto;overflow-y:hidden;position:relative;min-width:0}
.gantt-header-row{display:flex;align-items:stretch;height:42px;background:var(--sf2);border-bottom:1px solid var(--bd)}
.gantt-hcell{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:700;display:flex;align-items:center;padding:0 12px;border-right:1px solid var(--bd);white-space:nowrap;flex-shrink:0}
.gantt-hcell.act{width:230px}
.gantt-hcell.dates{width:90px;justify-content:center}
.gantt-hcell.val{width:100px;justify-content:flex-end}
.gantt-body{overflow-y:auto;max-height:calc(100vh - 300px)}
.gantt-left .gantt-body{overflow-y:hidden}
.gantt-right .gantt-body{overflow-y:hidden}
.gantt-row{display:flex;align-items:stretch;border-bottom:1px solid var(--bd2);transition:background .12s}
.gantt-row:hover{background:rgba(200,35,42,.03)}
.gantt-row.group-row{background:var(--sf2)}
.gantt-row.group-row:hover{background:rgba(200,35,42,.04)}
.gantt-cell{display:flex;align-items:center;padding:0 12px;min-height:48px;font-size:12px;color:var(--tx);flex-shrink:0;border-right:1px solid var(--bd2)}
.gantt-cell.act{width:230px;gap:6px}
.gantt-cell.dates{width:90px;font-size:10px;color:var(--mu2);justify-content:center;flex-direction:column;gap:2px;align-items:flex-start;padding:4px 10px}
.gantt-cell.val{width:100px;font-size:11.5px;color:var(--bl);font-weight:700;justify-content:flex-end}
.gantt-months{display:flex;height:44px;background:var(--sf2);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:2}
.gantt-month{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);font-weight:600;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--bd);white-space:nowrap;overflow:hidden;padding:0 6px}
.gantt-bar-area{position:relative;height:52px;border-bottom:1px solid var(--bd2);transition:background .12s}
.gantt-bar-area.group-row{background:var(--sf2)}
.gantt-bar-bg{position:absolute;top:14px;height:18px;border-radius:4px;opacity:.15}
.gantt-bar-real{position:absolute;top:14px;height:18px;border-radius:4px;opacity:.88;transition:width .5s ease}
.gantt-bar-group-bg{position:absolute;top:17px;height:12px;border-radius:3px;opacity:.18}
.gantt-bar-group{position:absolute;top:17px;height:12px;border-radius:3px;opacity:.85}
.gantt-diamond-l{position:absolute;top:10px;width:0;height:0;border-style:solid}
.gantt-diamond-r{position:absolute;top:10px;width:0;height:0;border-style:solid}
.gantt-cutline{position:absolute;top:0;bottom:0;width:2px;z-index:4;pointer-events:none;border-radius:1px}
.gantt-today-line{position:absolute;top:0;bottom:0;width:1px;z-index:3;pointer-events:none;border-left:1.5px dashed rgba(200,35,42,.35)}
.gantt-pinp{width:48px;border:1px solid var(--bd);border-radius:5px;padding:3px 5px;font-size:12px;text-align:center;background:transparent;color:var(--tx);font-family:'Instrument Sans',sans-serif}
.gantt-pinp:focus{outline:none;border-color:var(--accent);background:var(--accent-d)}
.gantt-pct-badge{font-size:13px;font-weight:700}
.gantt-toggle{cursor:pointer;font-size:9px;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--mu);transition:transform .15s;border-radius:3px;background:var(--sf3)}
.gantt-toggle:hover{background:var(--bd);color:var(--tx)}
.gantt-act-name{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-grid-line{position:absolute;top:0;bottom:0;width:1px;background:var(--bd2);opacity:.4}


/* ── GANTT FULL VIEW ─────────────────────────────────────── */
#ganttFullView{display:none;position:absolute;top:0;left:0;right:0;bottom:0;flex-direction:column;overflow:hidden;background:var(--bg);z-index:10}
#ganttFullView.on{display:flex}
.gfv-toolbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--bd);flex-shrink:0;flex-wrap:wrap}
.gfv-title{font-size:13px;font-weight:700;color:var(--tx);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gfv-back{background:none;border:1px solid var(--bd2);border-radius:6px;padding:5px 12px;font-size:12px;color:var(--mu2);cursor:pointer;font-family:'Instrument Sans',sans-serif;display:flex;align-items:center;gap:6px;transition:all .12s}
.gfv-back:hover{border-color:var(--bd);color:var(--tx);background:var(--sf2)}
.gfv-body{flex:1;overflow:hidden;padding:0;display:flex;flex-direction:column}
.gfv-body>div{flex:1;display:flex;flex-direction:column;overflow:hidden}
.gfv-body .gantt-wrap{border-radius:0;border:none;box-shadow:none;height:100%;overflow:hidden}
.gfv-body .gfv-body .gantt-left{height:100%;overflow:hidden}
.gfv-body .gantt-right{height:100%;overflow-x:auto}
.gfv-body .gantt-left .gantt-body{max-height:calc(100vh - 120px);overflow-y:auto}



/* ── NAV COLAPSABLE ──────────────────────────────────────── */
.shell{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;height:100vh;transition:grid-template-columns .22s ease}
nav{background:#fff;border-right:1px solid var(--bd);overflow:hidden;padding:10px 0 20px;display:flex;flex-direction:column;width:240px;min-width:240px;transition:width .22s ease,min-width .22s ease}
/* Modo ícono cuando .collapsed en nav */
nav.collapsed{width:52px;min-width:52px;padding:8px 0}
nav.collapsed .ns{display:none}
nav.collapsed .nav-sep{display:none}
nav.collapsed .ni-label{display:none}
nav.collapsed .nc{display:none}
nav.collapsed 
nav.collapsed .ni::before{display:none}
nav.collapsed .ni svg{width:18px;height:18px;opacity:.6;flex-shrink:0}
nav.collapsed .ni.on{background:var(--accent-d)}
nav.collapsed .ni.on svg{opacity:1}
nav.collapsed .ni:hover{background:var(--sf2)}
nav.collapsed .ni:hover svg{opacity:.85}
nav.collapsed .ni::after{content:attr(data-label);position:fixed;left:58px;background:#1e2130;color:#fff;font-size:12px;font-weight:500;padding:5px 11px;border-radius:7px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s;z-index:9999;font-family:'Instrument Sans',sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.2)}
nav.collapsed .ni:hover::after{opacity:1}
.shell.nav-collapsed{grid-template-columns:52px 1fr}
/* Toggle btn */
.nav-toggle{background:none;border:none;cursor:pointer;padding:6px;border-radius:7px;color:var(--mu2);display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.nav-toggle:hover{background:var(--sf2);color:var(--tx)}


/* ── NAV ITEMS (diseño base) ─────────────────────────────── */
.ns{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--mu);padding:18px 18px 5px;font-weight:700;opacity:.7}
.ns:first-child{padding-top:10px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 14px;cursor:pointer;font-size:13px;color:var(--mu2);transition:all .13s;user-select:none;margin:1px 8px;border-radius:7px;position:relative;white-space:nowrap}
.ni svg{width:15px;height:15px;flex-shrink:0;opacity:.5;transition:opacity .13s}
.ni:hover{color:var(--tx);background:var(--sf2)}
.ni:hover svg{opacity:.8}
.ni.on{color:var(--accent);background:var(--accent-d);font-weight:700;box-shadow:inset 0 0 0 1px rgba(230,57,70,.15)}
.ni.on svg{opacity:1}
.ni.on::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:22px;background:var(--accent);border-radius:2px;box-shadow:0 0 8px var(--accent)}
.nc{margin-left:auto;background:var(--sf3);color:var(--mu2);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;min-width:22px;text-align:center;flex-shrink:0;border:1px solid var(--bd)}
.ni.on .nc{background:rgba(230,57,70,.15);color:var(--accent);border-color:rgba(230,57,70,.25)}
.nav-sep{height:1px;background:var(--bd2);margin:6px 16px}
.ni-label{flex:1;overflow:hidden;text-overflow:ellipsis}

/* ── PREMIUM POLISH ──────────────────────────────────────── */
/* Scrollbar styling */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--mu)}

/* Glassmorphism top accent on KPI cards */
.kcard2::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),rgba(200,35,42,.4));border-radius:14px 14px 0 0}
.kcard2.bl-top::after{background:linear-gradient(90deg,var(--bl),rgba(37,99,235,.4))}
.kcard2.gr-top::after{background:linear-gradient(90deg,var(--gr),rgba(22,163,74,.4))}
.kcard2.am-top::after{background:linear-gradient(90deg,var(--am),rgba(217,119,6,.4))}

/* Contract cards enhanced */
.ctc{border-radius:14px!important}
.ctc-body{padding:18px 20px!important}
.ctc-hdr{margin-bottom:10px!important}

/* Nav hover glow */
.ni:hover{background:var(--sf2);color:var(--tx);transform:translateX(2px)}
.ni{transition:all .14s!important}
.ni.on{background:linear-gradient(90deg,var(--accent-d),rgba(200,35,42,.04))}

/* Panel header subtle gradient */
.ph{background:linear-gradient(90deg,var(--sf2),var(--sf))!important}

/* Badge pill refinement */
.b{border-radius:6px!important;font-weight:600!important;letter-spacing:.03em}

/* Button refinement */
.bgr{letter-spacing:.02em}

/* Kcard top stripe gradient */
.kcard::before{background:linear-gradient(90deg,var(--gr),rgba(22,163,74,.5))!important}
.kcard.am::before{background:linear-gradient(90deg,var(--am),rgba(217,119,6,.5))!important}
.kcard.rd::before{background:linear-gradient(90deg,var(--rd),rgba(220,38,38,.5))!important}
.kcard.bl::before{background:linear-gradient(90deg,var(--bl),rgba(37,99,235,.5))!important}

/* Section labels */
.ds-section{display:flex;align-items:center;gap:10px;margin-bottom:14px!important}
.ds-section::after{content:'';flex:1;height:1px;background:var(--bd)}

/* Visor chip filter bar */
.vfltrs{background:var(--sf2)!important;padding:8px 14px!important}

/* Search box icon tweak */
.vsrch-ic{opacity:.5}

/* vstats bar */
.vstats{box-shadow:0 4px 20px rgba(0,0,0,.12)!important}

/* ── GANTT ROW HOVER ACTIONS ─────────────────────────────── */
.gantt-row{position:relative}
.gantt-row-actions{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  display:none;align-items:center;gap:3px;z-index:20;
  background:rgba(255,255,255,.97);border:1px solid var(--bd);
  border-radius:8px;padding:3px 5px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.gantt-row:hover .gantt-row-actions{display:flex}
.gantt-row-actions .btn{padding:3px 7px;font-size:11px;border-radius:5px}

/* ── CONTEXT MENU ────────────────────────────────────────── */
#ganttCtxMenu{
  position:fixed;z-index:99999;
  background:#fff;border:1px solid var(--bd);border-radius:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.16);
  padding:5px 0;min-width:200px;
  display:none;
  font-family:'Instrument Sans',sans-serif;
  pointer-events:all;
  user-select:none;
}
#ganttCtxMenu.on{display:block;animation:ctxIn .12s ease}
@keyframes ctxIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.ctx-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 16px;font-size:12.5px;color:var(--tx);
  cursor:pointer;transition:background .1s;
  user-select:none;
}
.ctx-item:hover{background:var(--sf2)}
.ctx-item.danger{color:var(--rd)}
.ctx-item.danger:hover{background:var(--rd-d)}
.ctx-sep{height:1px;background:var(--bd);margin:4px 0}
.ctx-icon{width:16px;text-align:center;font-size:13px;flex-shrink:0}
.ctx-label{flex:1}
.ctx-badge{font-size:9px;font-weight:700;background:var(--accent-d);color:var(--accent);padding:1px 6px;border-radius:8px}
</style>
</head>

function _setSync(state){
  var el = document.getElementById('syncDot');
  if(!el) return;
  el.style.background = state==='saving' ? '#d97706' : state==='err' ? '#dc2626' : '#16a34a';
  el.title = state==='saving' ? 'Guardando…' : state==='err' ? 'Sin conexión — guardado local' : 'Datos sincronizados';
}
function _pushRemote(){
  if(!window.__sb) return;
  _setSync('saving');
  clearTimeout(_pushT);
  _pushT = setTimeout(async function(){
    try{
      var rows = [
        { key:'panel', data: D,                    updated_at: new Date().toISOString() },
        { key:'obras', data: (window.OBRAS2 || []), updated_at: new Date().toISOString() }
      ];
      var r = await window.__sb.from('edeso_state').upsert(rows, { onConflict:'key' });
      if(r.error) throw r.error;
      _setSync('ok');
    }catch(e){ console.warn('sync push', e); _setSync('err'); }
  }, 700);
}
function _pushPanel(){ _pushRemote(); }
function _pushObras(){ _pushRemote(); }

function __edesoLoadPanel(remote){
  if(!remote || typeof remote!=='object') return;
  for(var k in D){ if(Object.prototype.hasOwnProperty.call(D,k)) delete D[k]; }
  Object.assign(D, remote);
  ['sv','ct','pr','ad','ac','ap','cta','co','pl','su','pa'].forEach(function(k){ if(!D[k]) D[k]=[]; });
  try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){}
}
function __edesoLoadObras(remote){
  if(!Array.isArray(remote) || !window.OBRAS2) return;
  window.OBRAS2.length = 0;
  remote.forEach(function(o){ window.OBRAS2.push(o); });
  try{ localStorage.setItem('edeso_obras2', JSON.stringify(window.OBRAS2)); }catch(e){}
}
async function _loadRemote(){
  if(!window.__sb) return;
  try{
    var r = await window.__sb.from('edeso_state').select('key,data');
    if(r.error) throw r.error;
    (r.data||[]).forEach(function(row){
      if(row.key==='panel') __edesoLoadPanel(row.data);
      if(row.key==='obras') __edesoLoadObras(row.data);
    });
    _setSync('ok');
  }catch(e){ console.warn('sync load', e); _setSync('err'); }
}

const $ = id => document.getElementById(id);

const cop = v => v ? '$' + Number(v).toLocaleString('es-CO') : '—';
const copM = v => {
  if(!v) return '';
  const n = Number(v);
  if(n >= 1e9) return '$' + (n/1e9).toFixed(1).replace('.',',') + 'B';
  if(n >= 1e6) return '$' + (n/1e6).toFixed(1).replace('.',',') + 'M';
  if(n >= 1e3) return '$' + Math.round(n/1e3) + 'K';
  return '$' + n;
};

function daysLeft(d) {
  if(!d) return null;
  const h = new Date(); h.setHours(0,0,0,0);
  return Math.ceil((new Date(d+'T00:00:00') - h) / 86400000);
}

function status(c) {
  if(c.estado) {
    const est = (D.estados||[]).find(function(e){ return e.id === c.estado; });
    if(est) return { lbl: est.label, cls: est.cls, color: est.color };
    if(c.estado === 'liquidacion') return { lbl:'En liquidación',  cls:'bp' };
    if(c.estado === 'liquidado')   return { lbl:'Liquidado',       cls:'bmu' };
    if(c.estado === 'terminado')   return { lbl:'Terminado antic.',cls:'bmu' };
    if(c.estado === 'suspendido')  return { lbl:'Suspendido',      cls:'bw' };
  }
  if(suspActiva(c.id)) return { lbl:'Suspendido', cls:'bw', color:'#d97706' };
  const fin = fechaFinReal(c);
  const d = daysLeft(fin);
  if(d === null) return { lbl:'Sin fecha',     cls:'bi' };
  if(d < 0)      return { lbl:'Vencido',       cls:'br' };
  if(d <= 30)    return { lbl:'Vence '+d+'d',  cls:'bw' };
  return { lbl:'Activo', cls:'bg', color:'var(--gr)' };
}

function pctEst(ac, cut) {
  if(!ac.fstart || !ac.fend) return 0;
  const c  = new Date((cut||today())+'T00:00:00');
  const s  = new Date(ac.fstart+'T00:00:00');
  const e  = new Date(ac.fend+'T00:00:00');
  if(c <= s) return 0;
  if(c >= e) return 100;
  return Math.round((c - s) / (e - s) * 100);
}

// % real de un contrato: si es interadministrativo, promedio de derivados
// si no, último corte registrado (o 0)
function pctReal(cid) {
  const c = D.ct.find(x => x.id == cid);
  if(!c) return 0;

  // ── Interadministrativo: promedio ponderado por valor de obras hijas ──
  if(c.tipo === 'interadministrativo') {
    const obras = kids(cid).filter(h => h.tipo === 'obra' || h.tipo === 'consultoria');
    if(!obras.length) {
      // si no hay obras, caer al promedio simple de todos los hijos
      const hijos = kids(cid);
      if(!hijos.length) return 0;
      return Math.round(hijos.reduce((s,h) => s + pctReal(h.id), 0) / hijos.length);
    }
    const totalVal = obras.reduce((s,h) => s + Number(h.valor||0), 0);
    if(!totalVal) return Math.round(obras.reduce((s,h) => s + pctReal(h.id), 0) / obras.length);
    return Math.round(obras.reduce((s,h) => s + pctReal(h.id) * Number(h.valor||0), 0) / totalVal);
  }

  // ── Interventoría: promedio ponderado por valor de las obras que vigila ──
  if(c.tipo === 'interventoria') {
    const idsVigiladas = c.obrasVigiladas || [];
    if(idsVigiladas.length) {
      const obras = idsVigiladas.map(id => D.ct.find(x => x.id == id)).filter(Boolean);
      if(obras.length) {
        const totalVal = obras.reduce((s,o) => s + Number(o.valor||0), 0);
        if(!totalVal) return Math.round(obras.reduce((s,o) => s + pctReal(o.id), 0) / obras.length);
        return Math.round(obras.reduce((s,o) => s + pctReal(o.id) * Number(o.valor||0), 0) / totalVal);
      }
    }
    // sin obras vinculadas: avance propio de actividades si las tiene
    const roots = D.ac.filter(a => a.cid == cid && !a.pid);
    if(!roots.length) return 0;
    return Math.round(roots.reduce((s,a) => s + computeReal(a, cid), 0) / roots.length);
  }

  // ── Obra / Consultoría en modo % simple: último corte ──
  if(c.trackingMode === 'pct') {
    const cortes = D.co.filter(x => x.cid == cid).sort((a,b) => b.fecha.localeCompare(a.fecha));
    return cortes.length ? (cortes[0].pctReal || 0) : 0;
  }

  // ── Obra / Consultoría normal: promedio de actividades raíz del Gantt ──
  const roots = D.ac.filter(a => a.cid == cid && !a.pid);
  if(!roots.length) return 0;
  return Math.round(roots.reduce((s,a) => s + computeReal(a, cid), 0) / roots.length);
}

// % estimado de un contrato a hoy según fechas de inicio/fin
function pctEst2(c, atDate) {
  // Para obras en modo porcentaje: usar el último corte registrado
  if(c.trackingMode === 'pct') {
    const cortes = D.co.filter(x => x.cid == c.id).sort((a,b) => b.fecha.localeCompare(a.fecha));
    return cortes.length ? (cortes[0].pctEst != null ? cortes[0].pctEst : null) : null;
  }

  const startStr = c.fai || c.fstart;
  if(!startStr || !c.fend) return null;
  const ref = atDate ? new Date(atDate+'T00:00:00') : new Date();
  ref.setHours(0,0,0,0);
  const s = new Date(startStr+'T00:00:00');
  // Fecha fin vigente (solo prórrogas — las suspensiones no la mueven)
  const finStr = fechaFinReal(c);
  const fin = finStr ? new Date(finStr+'T00:00:00') : new Date(c.fend+'T00:00:00');
  if(ref <= s) return 0;
  if(ref >= fin) return 100;
  // Descontar días suspendidos que han ocurrido ANTES de ref
  let diasSusp = 0;
  D.su.filter(su => su.cid == c.id).forEach(su => {
    const ini2 = new Date(su.finicio+'T00:00:00');
    const fin2 = su.freinicio ? new Date(su.freinicio+'T00:00:00') : ref;
    if(ini2 < ref) diasSusp += Math.max(0, Math.ceil((Math.min(fin2,ref) - ini2) / 86400000));
  });
  const tiempoEfectivo = Math.max(1, Math.ceil((ref - s) / 86400000) - diasSusp);
  const duracionTotal  = Math.max(1, Math.ceil((fin - s) / 86400000));
  return Math.min(100, Math.round(tiempoEfectivo / duracionTotal * 100));
}

// Semáforo comparando real vs estimado
function semaforo(real, est) {
  if(est === null) return { cls:'bi', lbl:'Sin fechas', color:'var(--mu2)' };
  const dif = real - est;
  if(dif >= 0)   return { cls:'bg', lbl:'En plazo',   color:'var(--gr)' };
  if(dif >= -10) return { cls:'bw', lbl:'En alerta',  color:'var(--am)' };
  return           { cls:'br', lbl:'En retraso',  color:'var(--accent)' };
}

// HTML del widget de seguimiento para verCt
function pctModeTableHTML(c, cortes) {
  const sorted = [...cortes].sort((a,b) => a.fecha.localeCompare(b.fecha));
  const ultimo = cortes.length ? [...cortes].sort((a,b) => b.fecha.localeCompare(a.fecha))[0] : null;
  const real   = ultimo ? ultimo.pctReal : 0;
  const prog   = ultimo ? ultimo.pctEst  : 0;
  const sem    = semaforo(real, prog);

  let h = `<div style="background:var(--sf2);border-radius:10px;padding:16px 20px;margin-bottom:20px;border:1px solid var(--bd)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:700">
        Seguimiento por porcentajes
        <span style="background:var(--bl-d);color:var(--bl);border-radius:4px;padding:2px 8px;margin-left:8px;font-size:9px">📋 Modo % simple</span>
      </div>
      <button class="btn sm bgr" onclick="registrarCorte(${c.id})">+ Registrar corte</button>
    </div>`;

  if(!sorted.length) {
    h += `<div style="text-align:center;padding:32px;color:var(--mu);font-size:13px">
      Sin cortes registrados aún.<br>
      <button class="btn bgr" onclick="registrarCorte(${c.id})" style="margin-top:12px">+ Registrar primer corte</button>
    </div>`;
  } else {
    // Gráfica de barras simple
    h += `<div style="margin-bottom:16px">`;
    sorted.forEach((co, i) => {
      const sem2 = semaforo(co.pctReal, co.pctEst);
      h += `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mu2);margin-bottom:4px">
          <span style="font-weight:600">${fmt(co.fecha)}</span>
          <span>
            <span style="color:var(--mu2)">Prog: <b>${co.pctEst}%</b></span>
            &nbsp;·&nbsp;
            <span style="color:${sem2.color};font-weight:700">Ejec: ${co.pctReal}%</span>
            &nbsp;·&nbsp;
            <span style="color:${sem2.color}">${co.pctReal >= co.pctEst ? '▲' : '▼'} ${Math.abs(co.pctReal - co.pctEst).toFixed(1)}%</span>
          </span>
        </div>
        <div style="height:10px;background:var(--bd);border-radius:5px;position:relative;overflow:hidden">
          <div style="position:absolute;top:0;left:0;height:100%;width:${Math.min(co.pctEst,100)}%;background:var(--mu2);opacity:.35;border-radius:5px"></div>
          <div style="position:absolute;top:0;left:0;height:100%;width:${Math.min(co.pctReal,100)}%;background:${sem2.color};border-radius:5px;transition:width .4s"></div>
        </div>
        ${co.obs ? `<div style="font-size:10.5px;color:var(--mu);margin-top:3px;font-style:italic">${co.obs}</div>` : ''}
      </div>`;
    });
    h += `</div>`;

    // Tabla detalle
    h += `<details style="margin-top:4px"><summary style="font-size:11px;color:var(--mu);cursor:pointer;user-select:none">Ver tabla completa (${sorted.length} cortes)</summary>
    <table class="etbl" style="margin-top:10px">
      <thead><tr>
        <th>Fecha</th><th style="text-align:right">% Prog</th><th style="text-align:right">% Ejec</th>
        <th style="text-align:right">Diferencia</th><th>Observaciones</th><th></th>
      </tr></thead>
      <tbody>
        ${sorted.map(co => {
          const dif = co.pctReal - co.pctEst;
          const sc  = semaforo(co.pctReal, co.pctEst);
          return `<tr>
            <td style="font-weight:600">${fmt(co.fecha)}</td>
            <td style="text-align:right;color:var(--mu2)">${co.pctEst}%</td>
            <td style="text-align:right;font-weight:700;color:${sc.color}">${co.pctReal}%</td>
            <td style="text-align:right;color:${sc.color};font-weight:600">${dif >= 0 ? '+' : ''}${dif.toFixed(1)}%</td>
            <td style="font-size:11.5px;color:var(--mu)">${co.obs||'—'}</td>
            <td><button class="btn sm brd" onclick="elimCorte2(${co.id})">×</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></details>`;
  }

  h += `</div>`;
  return h;
}

function seguimientoHTML(id) {
  const c = D.ct.find(x => x.id == id); if(!c) return '';
  const esIA   = c.tipo === 'interadministrativo';
  const td     = today();
  const real   = pctReal(id);
  const est    = pctEst2(c, td);
  const sem    = semaforo(real, est);
  const cortes = D.co.filter(x => x.cid == id).sort((a,b) => b.fecha.localeCompare(a.fecha));
  const ultimo = cortes[0];
  const hasActs = D.ac.filter(a => a.cid == id).length > 0;

  let html = '';

  // ── Semáforo general ──────────────────────────────────────
  html += `<div style="background:var(--sf2);border-radius:10px;padding:20px 22px;border-left:4px solid ${sem.color};margin-bottom:20px">
    <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
      <div style="text-align:center">
        <div style="font-size:48px;font-weight:900;line-height:1;color:${sem.color}">${real}%</div>
        <div style="font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-top:4px">Avance real</div>
      </div>
      <div style="flex:1;min-width:180px">
        ${est !== null ? `
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mu2);margin-bottom:6px">
          <span>Programado <b style="color:var(--tx)">${est}%</b></span>
          <span style="font-weight:700;color:${sem.color}">${sem.lbl} ${real >= est ? '+' : ''}${real - est}%</span>
        </div>
        <div style="height:12px;background:var(--bd);border-radius:6px;position:relative;overflow:hidden">
          <div style="position:absolute;top:0;left:0;height:100%;width:${Math.min(est,100)}%;background:var(--mu2);opacity:.3;border-radius:6px"></div>
          <div style="position:absolute;top:0;left:0;height:100%;width:${Math.min(real,100)}%;background:${sem.color};border-radius:6px;transition:width .5s"></div>
        </div>
        <div style="font-size:11px;color:var(--mu);margin-top:6px">
          Fecha contractual: <b>${fmt(c.fai||c.fstart)}</b> → <b>${fmt(c.fend)}</b>
          ${c.fai && c.fai !== c.fstart ? ` · Acta: <b style="color:var(--bl)">${fmt(c.fai)}</b>` : ''}
        </div>` : `
        <div style="font-size:12px;color:var(--mu)">Sin fechas definidas — edita el contrato para agregar fecha de inicio.</div>`}
      </div>
      <div style="text-align:center;min-width:90px">
        <div style="font-size:10px;color:var(--mu);margin-bottom:4px">Último corte</div>
        <div style="font-size:13px;font-weight:700;color:var(--tx)">${ultimo ? fmt(ultimo.fecha) : '—'}</div>
        ${ultimo ? `<div style="font-size:11px;font-weight:600;color:${semaforo(ultimo.pctReal,ultimo.pctEst).color}">${ultimo.pctReal}% real</div>` : ''}
      </div>
    </div>
  </div>`;

  // ── Aviso si es interadministrativo ───────────────────────
  if(esIA) {
    const obras = kids(id).filter(h => h.tipo === 'obra' || h.tipo === 'consultoria');
    const totalValObras = obras.reduce((s,h) => s + Number(h.valor||0), 0);
    html += `<div style="background:rgba(200,35,42,.05);border-radius:8px;padding:12px 16px;font-size:12.5px;color:var(--mu2);margin-bottom:16px">
      <b>Contrato interadministrativo</b> — avance calculado como promedio ponderado por valor de
      ${obras.length} obra(s)/consultoría(s) derivada(s)${obras.length ? ` (valor total: ${cop(totalValObras)})` : ''}.
      ${obras.length === 0 ? '<br><span style="color:var(--am)">⚠ No hay contratos de obra o consultoría derivados aún.</span>' : ''}
    </div>`;
  }

  // ── Aviso si es interventoría ─────────────────────────────
  if(c.tipo === 'interventoria') {
    const idsVigiladas = c.obrasVigiladas || [];
    const obrasVigiladas = idsVigiladas.map(oid => D.ct.find(x => x.id == oid)).filter(Boolean);
    html += `<div style="background:rgba(37,99,235,.05);border-radius:8px;padding:12px 16px;font-size:12.5px;color:var(--mu2);margin-bottom:16px">
      <b>Interventoría</b> — `;
    if(obrasVigiladas.length) {
      html += `avance calculado como promedio ponderado de ${obrasVigiladas.length} obra(s) vigilada(s):<br>`;
      html += `<div style="margin-top:8px;display:flex;flex-direction:column;gap:4px">`;
      obrasVigiladas.forEach(o => {
        const p = pctReal(o.id);
        const color = p >= 80 ? 'var(--gr)' : p >= 40 ? 'var(--am)' : 'var(--accent)';
        html += `<div style="display:flex;align-items:center;gap:10px;font-size:12px">
          <span style="font-weight:600;color:var(--tx)">${o.num}</span>
          <span style="flex:1;color:var(--mu)">${(o.obj||'').substring(0,55)}</span>
          <span style="font-weight:700;color:${color}">${p}%</span>
          <div style="width:60px;height:6px;background:var(--bd);border-radius:3px;overflow:hidden">
            <div style="width:${p}%;height:100%;background:${color};border-radius:3px"></div>
          </div>
        </div>`;
      });
      html += `</div>`;
      html += `<div style="margin-top:8px"><button class="btn sm bgh" onclick="openCt(null,${id})" style="font-size:11px">✏ Cambiar obras vigiladas</button></div>`;
    } else {
      html += `<span style="color:var(--am)">⚠ No tiene obras vinculadas. </span>
        <button class="btn sm bgh" onclick="openCt(null,${id})" style="font-size:11px;margin-left:6px">Vincular obras</button>`;
    }
    html += `</div>`;
  }

  // ── Aviso / tabla según modo ──────────────────────────────
  if(c.trackingMode === 'pct' && !esIA && c.tipo !== 'interventoria') {
    // Modo porcentaje: mostrar tabla de cortes prog/ejec
    html += pctModeTableHTML(c, cortes);
  } else if(!hasActs && !esIA && c.tipo !== 'interventoria') {
    html += `<div style="background:var(--sf2);border-radius:8px;padding:16px;text-align:center;color:var(--mu);font-size:12.5px;margin-bottom:16px">
      Para hacer seguimiento preciso, primero define las actividades en la pestaña <b>Gantt</b>.
      El avance real se calculará automáticamente desde allí.
    </div>`;
  }

  // ── Botón guardar corte ───────────────────────────────────
  html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:600">
      Historial de cortes (${cortes.length})
    </div>
    <button class="btn bgr" onclick="registrarCorte(${id})">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="display:inline-block;vertical-align:-1px;margin-right:5px"><rect x="1" y="4" width="14" height="10" rx="1.5"/><circle cx="8" cy="9" r="2.5"/><path d="M5 4l1-2h4l1 2"/></svg>
      Guardar corte
    </button>
  </div>`;

  // ── Historial ─────────────────────────────────────────────
  if(!cortes.length) {
    html += `<div style="background:var(--sf2);border-radius:8px;padding:28px;text-align:center;color:var(--mu);font-size:13px">
      <div style="margin-bottom:8px;font-size:15px">Sin cortes registrados</div>
      Haz clic en <b>Guardar corte</b> para registrar el estado actual del avance.
      Cada corte guarda el % programado y el % real en esa fecha.
    </div>`;
  } else {
    html += '<div style="display:flex;flex-direction:column;gap:8px">';
    cortes.forEach(function(co, i) {
      const dif = co.pctReal - co.pctEst;
      const sc  = semaforo(co.pctReal, co.pctEst);
      html += `<div style="background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:16px;border-left:3px solid ${sc.color}">
        <div style="min-width:90px">
          <div style="font-size:12px;font-weight:600;color:var(--tx)">${fmt(co.fecha)}</div>
          <div style="font-size:10px;color:var(--mu);margin-top:2px">Corte #${cortes.length - i}</div>
        </div>
        <div style="flex:1">
          <div style="display:flex;gap:20px;margin-bottom:6px">
            <div><div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)">Programado</div><div style="font-size:14px;font-weight:600;color:var(--mu2)">${co.pctEst}%</div></div>
            <div><div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)">Real</div><div style="font-size:14px;font-weight:700;color:${sc.color}">${co.pctReal}%</div></div>
            <div><div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)">Diferencia</div><div style="font-size:14px;font-weight:700;color:${sc.color}">${dif>0?'+':''}${dif}%</div></div>
          </div>
          <div style="height:6px;background:var(--bd2);border-radius:3px;position:relative;overflow:hidden">
            <div style="position:absolute;top:0;left:0;height:100%;width:${Math.min(co.pctEst,100)}%;background:var(--mu2);opacity:.35;border-radius:3px"></div>
            <div style="position:absolute;top:0;left:0;height:100%;width:${Math.min(co.pctReal,100)}%;background:${sc.color};border-radius:3px"></div>
          </div>
          ${co.obs ? `<div style="font-size:11.5px;color:var(--mu2);margin-top:8px;font-style:italic">"${co.obs}"</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span style="font-size:10px;font-weight:700;color:${sc.color};background:${sc.color}15;padding:3px 8px;border-radius:12px">${sc.lbl}</span>
          <button class="btn sm brd" onclick="elimCorte2(${co.id},${id})" style="padding:3px 7px">×</button>
        </div>
      </div>`;
    });
    html += '</div>';
  }

  return html;
}



// ─── ROUTING ─────────────────────────────────────────────
let view = 'dashboard';

document.querySelectorAll('.ni').forEach(el => {
  el.addEventListener('click', () => {
    // Si hay una pagina de contrato abierta, cerrarla
    const pg = document.getElementById('ctPage');
    if(pg && pg.classList.contains('on')) {
      const gfv2 = document.getElementById('ganttFullView');
      if(gfv2) gfv2.classList.remove('on');
      pg.className = '';
      document.getElementById('main').style.display = '';
    }
    document.querySelectorAll('.ni').forEach(n => n.classList.remove('on'));
    el.classList.add('on');
    view = el.dataset.v;
    render();
  });
});

function updateCounts() {
  const s = gstats();
  $('nc_sv').textContent = D.sv.length;
  if($('nc_ap')) $('nc_ap').textContent = D.ap.length;
  $('nc_ct').textContent = D.ct.filter(c=>!c.pid).length;
  if($('nc_pr')) $('nc_pr').textContent = D.pr.length;
  if($('nc_ad')) $('nc_ad').textContent = D.ad.length;

  if($('nc_pa')) $('nc_pa').textContent = D.pa.length;
  $('topInfo').textContent = new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}) + ` · ${s.a} activos`;
}

function render() {
  updateCounts();
  const pg = document.getElementById('ctPage');
  if(pg && pg.classList.contains('on')) return;
  const mn = $('main');
  mn.style.opacity = '0';
  mn.style.transform = 'translateY(6px)';
  mn.style.transition = 'none';
  mn.innerHTML = VIEWS[view] ? VIEWS[view]() : '';
  requestAnimationFrame(() => {
    mn.style.transition = 'opacity .18s ease, transform .18s ease';
    mn.style.opacity = '1';
    mn.style.transform = 'translateY(0)';
  });
}

// ─── VIEWS ───────────────────────────────────────────────
const VIEWS = {

// DASHBOARD
dashboard() {
  const s = gstats();
  const roots = D.ct.filter(c => !c.pid);
  const alerts = D.ct
    .filter(c => ['bw','br'].includes(status(c).cls))
    .sort((a,b) => (daysLeft(fechaFinReal(a)||a.fend)||999) - (daysLeft(fechaFinReal(b)||b.fend)||999));
  const avgReal = D.ct.length
    ? Math.round(D.ct.reduce((sum,c) => sum + pctReal(c.id), 0) / D.ct.length) : 0;

  // Generar tarjeta de contrato
  function ctCard(c) {
    const sv  = svEfectivo(c);
    const e   = status(c);
    const r   = pctReal(c.id);
    const est = pctEst2(c) ?? 0;
    const sem = semaforo(r, est);
    const d   = daysLeft(fechaFinReal(c) || c.fend);
    const tad = D.ad.filter(a => a.cid == c.id).reduce((s,a) => s+Number(a.valor||0), 0);
    const val = Number(c.valor||0) + tad;
    let diasHtml = '';
    if(d === null) diasHtml = '';
    else if(d < 0)  diasHtml = `<span class="ctc-dias danger"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="display:inline-block;vertical-align:-1px"><path d="M8 1L1 14h14L8 1z"/><path d="M8 6v4M8 11.5v.5"/></svg> Vencido hace ${Math.abs(d)}d</span>`;
    else if(d <= 30) diasHtml = `<span class="ctc-dias warn"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="display:inline-block;vertical-align:-1px;opacity:.6"><path d="M3 2h10M3 14h10M5 2C5 7 11 7 11 14M11 2C11 7 5 7 5 14"/></svg> Vence en ${d}d</span>`;
    else             diasHtml = `<span class="ctc-dias ok"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="display:inline-block;vertical-align:-1px;opacity:.6"><path d="M3 2h10M3 14h10M5 2C5 7 11 7 11 14M11 2C11 7 5 7 5 14"/></svg> ${d}d restantes</span>`;
    return `
    <div class="ctc" onclick="verCt(${c.id})">
      <div class="ctc-bar" style="background:${sem.color}"></div>
      <div class="ctc-body">
        <div class="ctc-hdr">
          <span class="ctc-num" style="color:${sem.color}">${c.num}${c.tipo?' · '+c.tipo:''}</span>
          ${badge(e.cls, e.lbl)}
        </div>
        <div class="ctc-obj">${c.obj}</div>
        <div class="ctc-meta">
          ${sv ? (sv.foto ? avatarHTML(sv.foto, sv.nombre, 38) : '<div class="av" style="background:'+sem.color+'18;color:'+sem.color+';border-color:'+sem.color+'30;width:26px;height:26px;font-size:9px">'+ini(sv.nombre)+'</div>') : '<div class="av" style="background:var(--sf2);width:26px;height:26px;font-size:9px">?</div>'}
          <span class="ctc-sv">${sv?sv.nombre:'Sin supervisor'}</span>
        </div>
        <div class="ctc-prog">
          <div class="ctc-prog-labels">
            <span>Programado ${est}%</span>
            <span style="color:${sem.color};font-weight:700">Real ${r}%</span>
          </div>
          <div class="ctc-track">
            <div class="ctc-bar-prog" style="width:${Math.min(est,100)}%;background:${sem.color}"></div>
            <div class="ctc-bar-real" style="width:${Math.min(r,100)}%;background:${sem.color}"></div>
          </div>
        </div>
        <div class="ctc-foot">
          <span class="ctc-val">${cop(val)}</span>
          ${diasHtml}
        </div>
      </div>
    </div>`;
  }

  return `<div class="dash-bg">

  <div class="krow2">
    <div class="kcard2">
      <div class="klbl">Contratos activos</div>
      <div class="kval2 green">${s.a}</div>
      <div class="ksub2">de ${D.ct.length} (${s.tot} raíz + ${D.ct.length-s.tot} derivados)</div>
    </div>
    <div class="kcard2">
      <div class="klbl">Por vencer (30d)</div>
      <div class="kval2 amber">${s.w}</div>
      <div class="ksub2">requieren atención</div>
    </div>
    <div class="kcard2">
      <div class="klbl">Valor contratado</div>
      <div class="kval2 blue sm">${cop(s.tv)}</div>
      <div class="ksub2">${cop(s.ta)} en adiciones</div>
    </div>
    <div class="kcard2">
      <div class="klbl">Avance promedio</div>

      <div class="ksub2">portafolio activo</div>

  </div>

  ${roots.length > 0 ? `
  <div class="ds-section">Contratos principales</div>
  <div class="ct-cards">
    ${roots.map(c => ctCard(c)).join('')}
  </div>
  ${(function(){
    var derivAlert = D.ct.filter(function(c){ return c.pid && ['bw','br'].includes(status(c).cls); });
    if(!derivAlert.length) return '';
    return '<div class="ds-section" style="margin-top:4px">Derivados con alertas</div>' +
           '<div class="ct-cards">' + derivAlert.map(function(c){ return ctCard(c); }).join('') + '</div>';
  })()}` : `
  <div style="background:#fff;border-radius:14px;border:1px solid var(--bd);padding:48px;text-align:center;margin-bottom:24px">
    <div style="font-size:32px;margin-bottom:12px"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="display:inline-block;vertical-align:-1px"><rect x="2" y="1" width="12" height="14" rx="1.5"/><path d="M5 5h6M5 8h6M5 11h4"/></svg></div>

supervisores() {

  const avancePromSv  = sv => {
    const cts = derivadosDeSv(sv);

  };

  return `

                      + '<span style="font-size:11px;color:var(--mu);margin-left:8px">' + (g.ia.obj||'').substring(0,70) + '…</span>'
                    + '</div>'
                    + '<span style="font-size:10px;background:var(--accent-d);color:var(--accent);padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap">' + g.cts.length + ' derivado(s)</span>'
                    + '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--mu);flex-shrink:0"><path d="M6 4l4 4-4 4"/></svg>'
                  + '</div>'

// APOYOS
apoyos() {
  // Agrupar por profesión y ordenar alfabéticamente dentro de cada grupo
  const SIN_GRUPO = '(Sin profesión)';
  const sorted = [...D.ap].sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));
  const grupos = {};
  sorted.forEach(ap => {
    const key = (ap.profesion||'').trim() || SIN_GRUPO;
    if(!grupos[key]) grupos[key] = [];
    grupos[key].push(ap);
  });
  // Ordenar grupos: primero los nombrados A-Z, "Sin profesión" al final
  const grupoKeys = Object.keys(grupos).sort((a,b) => {
    if(a === SIN_GRUPO) return 1;
    if(b === SIN_GRUPO) return -1;
    return a.localeCompare(b, 'es');
  });

  function apRow(ap) {
    const asignaciones = D.cta.filter(a => a.apid == ap.id);
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:10px">
        ${avatarHTML(ap.foto, ap.nombre, 44)}
        <div>
          <div style="font-weight:600;font-size:13px">${ap.nombre}</div>
          ${ap.email ? `<div style="font-size:11px;color:var(--mu)">${ap.email}</div>` : ''}
        </div>
      </div></td>
      <td style="font-size:12px;color:var(--mu2)">${ap.cargo||'—'}</td>
      <td style="font-size:12px;color:var(--mu2)">${ap.cedula||'—'}</td>
      <td style="font-size:12px;color:var(--mu2)">${ap.tel||'—'}</td>
      <td style="max-width:220px">
        ${asignaciones.length === 0
          ? '<span style="color:var(--mu);font-size:11px">Sin contratos</span>'
          : asignaciones.map(a => {
              const ct = D.ct.find(x => x.id == a.cid);
              return ct ? `<span class="b bi" style="margin:1px 2px 1px 0;font-size:9px">${ct.num}</span>` : '';
            }).join('')}
      </td>
      <td style="white-space:nowrap">
        <button class="btn sm bgh" onclick="openAp(${ap.id})">Editar</button>
        <button class="btn sm brd" onclick="delAp(${ap.id})">Eliminar</button>
      </td>
    </tr>`;
  }

  function grupoSection(key, apList) {
    const isSinGrupo = key === SIN_GRUPO;
    const COLOR_IDX = grupoKeys.filter(k=>k!==SIN_GRUPO).indexOf(key);
    const COLORS = ['#2563eb','#16a34a','#d97706','#7c3aed','#C8232A','#0891b2','#be185d','#ea580c','#059669','#4338ca'];
    const color = isSinGrupo ? 'var(--mu)' : COLORS[COLOR_IDX % COLORS.length];
    return `
    <div style="margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--sf2);border-top:3px solid ${color};border-radius:8px 8px 0 0;cursor:pointer"
           onclick="toggleGrupoAp(this)">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="${color}" stroke-width="2"
             style="flex-shrink:0;transition:transform .2s" class="grupo-arrow">
          <path d="M4 6l4 4 4-4"/>
        </svg>
        <span style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:${color}">${key}</span>
        <span style="font-size:11px;color:var(--mu);margin-left:4px">${apList.length} persona${apList.length!==1?'s':''}</span>
        <button class="btn sm bgh" style="margin-left:auto;font-size:10px" 
                onclick="event.stopPropagation();openAp(null,'${key.replace(/'/g,"\'")}')">
          + Agregar a este grupo
        </button>
      </div>
      <div class="grupo-body" style="border:1px solid var(--bd);border-top:none;border-radius:0 0 8px 8px;overflow:hidden">
        <table class="etbl" style="margin:0">
          <thead><tr>
            <th>Persona de apoyo</th><th>Cargo</th><th>Cédula</th>
            <th>Contacto</th><th>Contratos</th><th></th>
          </tr></thead>
          <tbody>${apList.map(ap => apRow(ap)).join('')}</tbody>
        </table>
      </div>
    </div>`;
  }

  return `
  <div class="row-hd">
    <div class="ptg">Apoyos a la supervisión</div>
    <div style="display:flex;gap:8px">
      <button class="btn bgh" onclick="gestionarGruposAp()" title="Administrar grupos de profesión">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="display:inline-block;vertical-align:-2px;margin-right:4px"><path d="M2 4h12M4 8h8M6 12h4"/></svg>
        Grupos
      </button>
      <button class="btn bgr" onclick="openAp()">+ Nuevo apoyo</button>
    </div>
  </div>
  ${D.ap.length === 0
    ? `<div class="panel"><div class="emp" style="padding:48px">
        <div style="font-size:28px;margin-bottom:12px">👥</div>
        <div style="font-weight:600;margin-bottom:6px">Sin apoyos registrados</div>
        <div style="font-size:12px;color:var(--mu);margin-bottom:16px">Agrega el primero para comenzar</div>
        <button class="btn bgr" onclick="openAp()">+ Agregar apoyo</button>
      </div></div>`
    : grupoKeys.map(k => grupoSection(k, grupos[k])).join('')
  }`;
},
