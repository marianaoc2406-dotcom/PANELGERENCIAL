function polizasHTML(cid) {
  const pols = D.pl.filter(p => p.cid == cid).sort((a,b) => a.ffin.localeCompare(b.ffin));
  const td = today();

  function polStatus(p) {
    if(!p.ffin) return { cls:'bi', lbl:'Sin fecha', color:'var(--mu2)' };
    const diff = Math.ceil((new Date(p.ffin+'T00:00:00') - new Date(td+'T00:00:00')) / 86400000);
    if(diff < 0)  return { cls:'br', lbl:'Vencida',    color:'var(--accent)', days: diff };
    if(diff <= 30) return { cls:'bw', lbl:'Por vencer', color:'var(--am)',     days: diff };
    return { cls:'bg', lbl:'Vigente', color:'var(--gr)', days: diff };
  }

  const polAlerta = polizasAlerta(cid);
  let html = '';
  if(polAlerta.length) {
    html += `<div style="background:var(--am-d);border:1px solid var(--am);border-radius:8px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--am-t)" stroke-width="1.5"><path d="M8 1l7 14H1L8 1z"/><path d="M8 6v4M8 12v.5"/></svg>
      <div>
        <div style="font-size:12.5px;font-weight:700;color:var(--am-t)">${polAlerta.length} póliza(s) vencen en los próximos 30 días</div>
        <div style="font-size:11px;color:var(--am-t);opacity:.85">${polAlerta.map(p=>{
          const d=Math.ceil((new Date(p.ffin+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
          return p.nombre+' ('+d+' días)';
        }).join(' · ')}</div>
      </div>
    </div>`;
  }
  html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:600">
      Pólizas del contrato (${pols.length})
    </div>
    <button class="btn bgr" onclick="openPol(${cid})">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:-1px;margin-right:5px"><path d="M8 3v10M3 8h10"/></svg>
      Nueva póliza
    </button>
  </div>`;

  if(!pols.length) {
    html += `<div style="background:var(--sf2);border-radius:8px;padding:28px;text-align:center;color:var(--mu);font-size:13px">
      <div style="margin-bottom:6px">Sin pólizas registradas</div>
      <div style="font-size:11px">Agrega las pólizas de seguro del contrato con sus fechas de vigencia.</div>
    </div>`;
    return html;
  }

  html += '<div style="display:flex;flex-direction:column;gap:8px">';
  pols.forEach(p => {
    const st = polStatus(p);
    const pct = p.finicio && p.ffin
      ? clamp(Math.round((new Date(td+'T00:00:00') - new Date(p.finicio+'T00:00:00')) /
          (new Date(p.ffin+'T00:00:00') - new Date(p.finicio+'T00:00:00')) * 100), 0, 100)
      : 0;
    html += `<div style="background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px 16px;border-left:3px solid ${st.color}">
      <div style="display:flex;align-items:flex-start;gap:16px">
        <div style="flex:1">
          <div style="font-size:13px;font-weight:600;color:var(--tx);margin-bottom:4px">${p.nombre}</div>
          <div style="display:flex;gap:20px;font-size:11.5px;color:var(--mu2);flex-wrap:wrap">
            <span>Inicio: <b>${fmt(p.finicio)||'—'}</b></span>
            <span>Vence: <b style="color:${st.color}">${fmt(p.ffin)||'—'}</b></span>
            ${st.days !== undefined
              ? `<span style="color:${st.color};font-weight:600">${st.days >= 0 ? st.days+' días restantes' : Math.abs(st.days)+' días vencida'}</span>`
              : ''}
          </div>
          ${p.finicio && p.ffin ? `
          <div style="height:5px;background:var(--bd2);border-radius:3px;margin-top:10px;overflow:hidden;position:relative">
            <div style="position:absolute;top:0;left:0;height:100%;width:${pct}%;background:${st.color};border-radius:3px;transition:width .5s"></div>
          </div>` : ''}
          ${p.obs ? `<div style="font-size:11px;color:var(--mu2);margin-top:6px;font-style:italic">"${p.obs}"</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span style="font-size:10px;font-weight:700;color:${st.color};background:${st.color}18;padding:3px 9px;border-radius:12px">${st.lbl}</span>
          <button class="btn sm bgh" onclick="openPol(${cid},${p.id})" style="padding:3px 7px"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 2l3 3L5 14H2v-3L11 2z"/></svg></button>
          <button class="btn sm brd" onclick="delPol(${p.id},${cid})" style="padding:3px 7px">×</button>
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function savePol(cid, id) {

function guardarCortePct(cid) {

  const obs   = $('coObs').value.trim();
  if(!fecha)            { toast('La fecha es obligatoria', true); return; }

  if(prog < 0 || prog > 100 || ejec < 0 || ejec > 100) { toast('El % debe estar entre 0 y 100', true); return; }
  D.co.push({ id: Date.now(), cid, fecha, pctReal: Math.round(ejec*10)/10, pctEst: Math.round(prog*10)/10, obs });

  if(ctPageCid) verCt(ctPageCid); else render();
  toast('Corte registrado');
}

function flujoCajaHTML(cid) {
  var ct  = D.ct.find(function(x){return x.id==cid;}); if(!ct) return '';
  var aiu = ct.aiu || {adm:0,imp:0,util:0};
  var pAdm = Number(aiu.adm||0)/100;
  var pImp = Number(aiu.imp||0)/100;
  var pUtil= Number(aiu.util||0)/100;
  var pAIU = pAdm+pImp+pUtil;

  if(!ct.fc) ct.fc = {};

  // Pre-populate from Gantt activities if empty
  if(Object.keys(ct.fc).length === 0) {
    var acts0 = D.ac.filter(function(a){return a.cid==cid && a.valor>0 && !D.ac.some(function(x){return x.pid==a.id;});});
    acts0.forEach(function(a){ ct.fc['ac_'+a.id] = {label:a.nombre}; });
    if(!acts0.length) ct.fc['row_'+Date.now()] = {label:'Actividad 1'};
  }

  if(!ct.fstart||!ct.fend) return '<div class="emp" style="padding:32px">El contrato no tiene fechas definidas.</div>';

  // Usar fecha acta de inicio si existe, si no fecha de firma
  var fechaInicioFC = ct.fai || ct.fstart;
  var meses=[], d0=new Date(fechaInicioFC+'T00:00:00'), d1=new Date(ct.fend+'T00:00:00');

  while(dm<=d1){meses.push(new Date(dm));dm=new Date(dm.getFullYear(),dm.getMonth()+1,1);}

  function keyM(m){return m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0');}

  h+='<div style="overflow-x:auto">';

  h+='<thead><tr>';
  h+='<th style="text-align:left;padding:8px 10px;background:var(--sf2);border:1px solid var(--bd);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);min-width:180px;position:sticky;left:0;z-index:3">Actividad / Concepto</th>';
  meses.forEach(function(m){
    h+='<th style="text-align:right;padding:8px 6px;background:var(--sf2);border:1px solid var(--bd);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);min-width:'+colW+'px;white-space:nowrap">'+lblM(m)+'</th>';
  });
  h+='<th style="text-align:right;padding:8px 10px;background:var(--sf2);border:1px solid var(--bd);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);min-width:90px">TOTAL</th>';
  h+='</tr></thead>';

  // Body rows
  h+='<tbody id="fc_body_'+cid+'">';
  Object.keys(ct.fc).forEach(function(rowId){
    h+=fcRowHTML(rowId,ct.fc[rowId],keys,cid);
  });
  h+='</tbody>';

  // Footer totals
  h+='<tfoot>';
  // Costo directo
  h+='<tr id="fc_tot_'+cid+'" style="background:rgba(37,99,235,.05)">';
  h+='<td style="padding:8px 10px;border:1px solid var(--bd);font-weight:700;font-size:12px;color:var(--bl);position:sticky;left:0;background:rgba(37,99,235,.05)">Costo directo mensual</td>';
  keys.forEach(function(k){h+='<td id="fct_'+cid+'_'+k+'" style="text-align:right;padding:8px 6px;border:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--bl)">—</td>';});
  h+='<td id="fct_'+cid+'_total" style="text-align:right;padding:8px 10px;border:1px solid var(--bd);font-weight:700;color:var(--bl)">—</td>';
  h+='</tr>';

  if(pAIU>0){
    if(pAdm>0){
      h+='<tr style="background:#fff"><td style="padding:6px 10px 6px 20px;border:1px solid var(--bd);font-size:11.5px;color:var(--mu2);position:sticky;left:0;background:#fff">Administración ('+aiu.adm+'%)</td>';
      keys.forEach(function(k){h+='<td id="fcadm_'+cid+'_'+k+'" style="text-align:right;padding:6px;border:1px solid var(--bd);font-size:11px;color:var(--mu2)">—</td>';});
      h+='<td id="fcadm_'+cid+'_total" style="text-align:right;padding:6px 10px;border:1px solid var(--bd);font-size:11px;color:var(--mu2)">—</td></tr>';
    }
    if(pImp>0){
      h+='<tr style="background:#fff"><td style="padding:6px 10px 6px 20px;border:1px solid var(--bd);font-size:11.5px;color:var(--mu2);position:sticky;left:0;background:#fff">Imprevistos ('+aiu.imp+'%)</td>';
      keys.forEach(function(k){h+='<td id="fcimp_'+cid+'_'+k+'" style="text-align:right;padding:6px;border:1px solid var(--bd);font-size:11px;color:var(--mu2)">—</td>';});
      h+='<td id="fcimp_'+cid+'_total" style="text-align:right;padding:6px 10px;border:1px solid var(--bd);font-size:11px;color:var(--mu2)">—</td></tr>';
    }
    if(pUtil>0){
      h+='<tr style="background:#fff"><td style="padding:6px 10px 6px 20px;border:1px solid var(--bd);font-size:11.5px;color:var(--mu2);position:sticky;left:0;background:#fff">Utilidad ('+aiu.util+'%)</td>';
      keys.forEach(function(k){h+='<td id="fcutil_'+cid+'_'+k+'" style="text-align:right;padding:6px;border:1px solid var(--bd);font-size:11px;color:var(--mu2)">—</td>';});
      h+='<td id="fcutil_'+cid+'_total" style="text-align:right;padding:6px 10px;border:1px solid var(--bd);font-size:11px;color:var(--mu2)">—</td></tr>';
    }
    // Valor mensual con AIU
    h+='<tr style="background:rgba(22,163,74,.06)">';
    h+='<td style="padding:9px 10px;border:1px solid var(--bd);font-weight:700;font-size:12.5px;color:var(--gr);position:sticky;left:0;background:rgba(22,163,74,.06)">VALOR MENSUAL (con AIU)</td>';
    keys.forEach(function(k){h+='<td id="fcaiu_'+cid+'_'+k+'" style="text-align:right;padding:9px 6px;border:1px solid var(--bd);font-weight:700;font-size:12px;color:var(--gr)">—</td>';});
    h+='<td id="fcaiu_'+cid+'_total" style="text-align:right;padding:9px 10px;border:1px solid var(--bd);font-weight:800;color:var(--gr)">—</td>';
    h+='</tr>';
    // Acumulado
    h+='<tr style="background:rgba(22,163,74,.03)">';
    h+='<td style="padding:7px 10px;border:1px solid var(--bd);font-weight:600;font-size:11.5px;color:var(--gr);position:sticky;left:0;background:rgba(22,163,74,.03)">Acum. flujo (con AIU)</td>';
    keys.forEach(function(k){h+='<td id="fcacum_'+cid+'_'+k+'" style="text-align:right;padding:7px 6px;border:1px solid var(--bd);font-weight:500;font-size:11px;color:var(--gr)">—</td>';});
    h+='<td style="border:1px solid var(--bd)"></td></tr>';
  } else {
    h+='<tr style="background:rgba(37,99,235,.03)">';
    h+='<td style="padding:7px 10px;border:1px solid var(--bd);font-weight:600;font-size:11.5px;color:var(--bl);position:sticky;left:0;background:rgba(37,99,235,.03)">Acum. flujo</td>';
    keys.forEach(function(k){h+='<td id="fcacum_'+cid+'_'+k+'" style="text-align:right;padding:7px 6px;border:1px solid var(--bd);font-weight:500;font-size:11px;color:var(--bl)">—</td>';});
    h+='<td style="border:1px solid var(--bd)"></td></tr>';
  }
  h+='</tfoot></table></div>';

  // KPI cards
  h+='<div id="fc_kpi_'+cid+'" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px"></div>';

  // Curva S
  var chartId='fc_chart_'+cid;
  h+='<div style="background:var(--sf2);border-radius:10px;padding:16px;margin-top:16px">';
  h+='<div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:12px;font-weight:600">Curva S — Flujo acumulado'+(pAIU>0?' (con AIU)':'')+'</div>';
  h+='<div style="position:relative;height:200px"><canvas id="'+chartId+'"></canvas></div>';
  h+='</div>';

  h+='</div>';

  // Auto-calc on load
  h+='<script>setTimeout(function(){fcRecalc('+cid+',"'+keysJ+'",'+pAdm+','+pImp+','+pUtil+');},100);<\/script>';

}

function fcRowHTML(rowId,rowData,keys,cid){
  var h='<tr id="fcrow_'+rowId+'">';
  var lbl=(rowData.label||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  h+='<td style="border:1px solid var(--bd);padding:0;position:sticky;left:0;background:#fff;z-index:1">';
  h+='<div style="display:flex;align-items:center">';
  h+='<input value="'+lbl+'" style="flex:1;border:none;outline:none;padding:8px 6px 8px 10px;font-family:\'Instrument Sans\',sans-serif;font-size:12.5px;color:var(--tx);background:transparent;min-width:130px" onchange="fcUpdateLabel('+cid+',\''+rowId+'\',this.value)">';
  h+='<button onclick="fcDelRow('+cid+',\''+rowId+'\')" title="Eliminar fila" style="border:none;background:none;cursor:pointer;color:var(--mu);padding:4px 7px;font-size:13px;flex-shrink:0">&#215;</button>';
  h+='</div></td>';
  keys.forEach(function(k){
    var v=rowData[k]||'';
    h+='<td style="border:1px solid var(--bd);padding:0">';
    h+='<input type="number" min="0" step="1000" value="'+(v||'')+'" placeholder="" ';
    h+='style="width:100%;border:none;outline:none;padding:7px 6px;text-align:right;font-family:\'Instrument Sans\',sans-serif;font-size:12px;color:'+(v>0?'var(--tx)':'var(--mu)')+';background:transparent" ';
    h+='oninput="fcRecalc('+cid+',\''+keys.join(',')+'\',0,0,0)" ';
    h+='onfocus="this.style.background=\'#fffde7\'" onblur="this.style.background=\'transparent\'">';
    h+='</td>';
  });
  h+='<td id="fcrow_tot_'+rowId+'" style="text-align:right;padding:8px 10px;border:1px solid var(--bd);font-size:11.5px;font-weight:600;color:var(--tx)">—</td>';
  h+='</tr>';
  return h;
}

function fcRecalc(cid,keysStr,pAdm,pImp,pUtil){
  var keys=keysStr.split(',');
  var ct=D.ct.find(function(x){return x.id==cid;});
  if(!ct) return;
  if(!pAdm&&!pImp&&!pUtil&&ct.aiu){
    pAdm=Number(ct.aiu.adm||0)/100;
    pImp=Number(ct.aiu.imp||0)/100;
    pUtil=Number(ct.aiu.util||0)/100;
  }
  var pAIU=pAdm+pImp+pUtil;
  var body=document.getElementById('fc_body_'+cid);
  if(!body) return;

  var colTotals={};
  keys.forEach(function(k){colTotals[k]=0;});
  var grandTotal=0;

  var rows=body.querySelectorAll('tr');
  rows.forEach(function(row){
    if(!row.id) return;
    var rowId=row.id.replace('fcrow_','');
    var numInps=row.querySelectorAll('input[type="number"]');
    var rowSum=0;
    keys.forEach(function(k,i){
      var v=numInps[i]?Number(numInps[i].value)||0:0;
      colTotals[k]+=v; rowSum+=v; grandTotal+=v;
    });
    var totEl=document.getElementById('fcrow_tot_'+rowId);
    if(totEl) totEl.textContent=rowSum>0?'$'+rowSum.toLocaleString('es-CO'):'—';
  });

  // Column totals
  keys.forEach(function(k){
    var el=document.getElementById('fct_'+cid+'_'+k);
    if(el) el.textContent=colTotals[k]>0?'$'+colTotals[k].toLocaleString('es-CO'):'—';
  });
  var totEl=document.getElementById('fct_'+cid+'_total');
  if(totEl) totEl.textContent=grandTotal>0?'$'+grandTotal.toLocaleString('es-CO'):'—';

  // AIU rows
  var acum=0;
  var aiuMenses=[];
  keys.forEach(function(k){
    var v=colTotals[k];
    var adm=Math.round(v*pAdm), imp=Math.round(v*pImp), util=Math.round(v*pUtil);
    var total=v+adm+imp+util;
    aiuMenses.push(total); acum+=total;
    var eAdm=document.getElementById('fcadm_'+cid+'_'+k);
    var eImp=document.getElementById('fcimp_'+cid+'_'+k);
    var eUtil=document.getElementById('fcutil_'+cid+'_'+k);
    var eAIU=document.getElementById('fcaiu_'+cid+'_'+k);
    var eAcum=document.getElementById('fcacum_'+cid+'_'+k);
    if(eAdm)  eAdm.textContent =adm >0?'$'+adm.toLocaleString('es-CO'):'—';
    if(eImp)  eImp.textContent =imp >0?'$'+imp.toLocaleString('es-CO'):'—';
    if(eUtil) eUtil.textContent=util>0?'$'+util.toLocaleString('es-CO'):'—';
    if(eAIU)  eAIU.textContent =total>0?'$'+total.toLocaleString('es-CO'):'—';
    if(eAcum) eAcum.textContent=acum>0?'$'+acum.toLocaleString('es-CO'):'$0';
  });

  var totalAIU=Math.round(grandTotal*(1+pAIU));
  var eAdmT=document.getElementById('fcadm_'+cid+'_total');
  var eImpT=document.getElementById('fcimp_'+cid+'_total');
  var eUtilT=document.getElementById('fcutil_'+cid+'_total');
  var eAIUT=document.getElementById('fcaiu_'+cid+'_total');
  if(eAdmT)  eAdmT.textContent =grandTotal>0?'$'+Math.round(grandTotal*pAdm).toLocaleString('es-CO'):'—';
  if(eImpT)  eImpT.textContent =grandTotal>0?'$'+Math.round(grandTotal*pImp).toLocaleString('es-CO'):'—';
  if(eUtilT) eUtilT.textContent=grandTotal>0?'$'+Math.round(grandTotal*pUtil).toLocaleString('es-CO'):'—';
  if(eAIUT)  eAIUT.textContent =totalAIU>0?'$'+totalAIU.toLocaleString('es-CO'):'—';

  // KPIs
  var valorCt=Number(ct.valor||0)+D.ad.filter(function(a){return a.cid==cid;}).reduce(function(s,a){return s+Number(a.valor||0);},0);
  var kpiEl=document.getElementById('fc_kpi_'+cid);
  if(kpiEl){
    kpiEl.innerHTML=
      '<div class="kcard bl"><div class="klbl">Valor contrato</div><div class="kval sm">'+(valorCt>0?'$'+valorCt.toLocaleString('es-CO'):'—')+'</div></div>'
      +'<div class="kcard"><div class="klbl">Costo directo total</div><div class="kval sm">$'+grandTotal.toLocaleString('es-CO')+'</div></div>'
      +(pAIU>0?'<div class="kcard go"><div class="klbl">Total con AIU</div><div class="kval sm">$'+totalAIU.toLocaleString('es-CO')+'</div></div>':'')
      +'<div class="kcard '+(valorCt>0&&grandTotal>0?(grandTotal/valorCt>=0.9?'go':grandTotal/valorCt>=0.6?'am':'rd'):'')+'"><div class="klbl">% vs contrato</div><div class="kval">'+(valorCt>0?Math.round(grandTotal/valorCt*100)+'%':'—')+'</div></div>';
  }

  // Curva S
  var chartId='fc_chart_'+cid;
  var ctx=document.getElementById(chartId);
  if(ctx&&window.Chart){
    var labels=keys.map(function(k){var p=k.split('-');return new Date(p[0],p[1]-1,1).toLocaleDateString('es-CO',{month:'short',year:'2-digit'});});
    var data=pAIU>0?aiuMenses:keys.map(function(k){return colTotals[k];});
    var acc=0;
    var acumData=data.map(function(v){acc+=v;return acc;});
    if(ctx._fc) ctx._fc.destroy();
    ctx._fc=new Chart(ctx,{
      type:'line',
      data:{labels:labels,datasets:[{label:'Flujo acumulado'+(pAIU>0?' c/AIU':''),data:acumData,borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.1)',borderWidth:2.5,fill:true,tension:0.4,pointRadius:3}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.dataset.label+': $'+Number(c.parsed.y).toLocaleString('es-CO');}}}},scales:{y:{ticks:{callback:function(v){return '$'+Number(v/1000000).toFixed(1)+'M';}},grid:{color:'#e2e5ea'}},x:{grid:{display:false}}}}
    });
  }
}

function fcAddRow(cid){
  var ct=D.ct.find(function(x){return x.id==cid;}); if(!ct) return;
  if(!ct.fc) ct.fc={};
  var rowId='row_'+Date.now();
  ct.fc[rowId]={label:'Nueva actividad'};
  var body=document.getElementById('fc_body_'+cid); if(!body) return;
  var keys=[];
  var allCells=document.querySelectorAll('[id^="fct_'+cid+'_"]:not([id$="_total"])');
  allCells.forEach(function(el){keys.push(el.id.replace('fct_'+cid+'_',''));});
  var tmp=document.createElement('tbody');
  tmp.innerHTML=fcRowHTML(rowId,{label:'Nueva actividad'},keys,cid);
  var newRow=tmp.firstElementChild;
  if(newRow){ body.appendChild(newRow); var inp=newRow.querySelector('input'); if(inp){inp.focus();inp.select();} }
}

function fcDelRow(cid,rowId){
  var row=document.getElementById('fcrow_'+rowId); if(row) row.remove();
  var ct=D.ct.find(function(x){return x.id==cid;}); if(ct&&ct.fc) delete ct.fc[rowId];
  var keys=[];
  document.querySelectorAll('[id^="fct_'+cid+'_"]:not([id$="_total"])').forEach(function(el){keys.push(el.id.replace('fct_'+cid+'_',''));});
  var aiu=ct&&ct.aiu?ct.aiu:{adm:0,imp:0,util:0};
  fcRecalc(cid,keys.join(','),Number(aiu.adm||0)/100,Number(aiu.imp||0)/100,Number(aiu.util||0)/100);
}

function fcUpdateLabel(cid,rowId,val){
  var ct=D.ct.find(function(x){return x.id==cid;}); if(ct&&ct.fc&&ct.fc[rowId]) ct.fc[rowId].label=val;
}

function fcGuardar(cid,keysStr){
  var ct=D.ct.find(function(x){return x.id==cid;}); if(!ct) return;
  if(!ct.fc) ct.fc={};
  var keys=keysStr.split(',');
  var body=document.getElementById('fc_body_'+cid); if(!body) return;
  Object.keys(ct.fc).forEach(function(rid){keys.forEach(function(k){delete ct.fc[rid][k];});});
  var rows=body.querySelectorAll('tr');
  rows.forEach(function(row){
    if(!row.id) return;
    var rowId=row.id.replace('fcrow_','');
    if(!ct.fc[rowId]) ct.fc[rowId]={};
    var lInp=row.querySelector('input:not([type="number"])');
    if(lInp) ct.fc[rowId].label=lInp.value;
    var nInps=row.querySelectorAll('input[type="number"]');
    keys.forEach(function(k,i){
      var v=nInps[i]?Number(nInps[i].value)||0:0;
      if(v>0) ct.fc[rowId][k]=v; else delete ct.fc[rowId][k];
    });
  });
  save(); toast('Flujo de caja guardado');
}

function fcReset(cid){
  if(!confirm('&#191;Reiniciar el flujo de caja? Se borrar&#225;n todos los valores ingresados.')) return;
  var ct=D.ct.find(function(x){return x.id==cid;}); if(!ct) return;
  ct.fc={}; save(); renderFlujoCaja(cid); toast('Flujo de caja reiniciado');
}

function renderPagosContrato(cid) {
  var el = document.getElementById('pagos_ct_' + cid);
  if(!el) return;
  el.innerHTML = pagosContratoHTML(cid);
}

function pagosContratoHTML(cid) {
  var ct = D.ct.find(function(x){ return x.id == cid; }); if(!ct) return '';
  var tad = D.ad.filter(function(a){ return a.cid == cid; }).reduce(function(s,a){ return s+Number(a.valor||0); }, 0);
  var valTotal = Number(ct.valor||0) + tad;
  var pagos = D.pa.filter(function(p){ return p.cid == cid; }).sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||''); });
  var totalPagado = pagos.reduce(function(s,p){ return s+Number(p.valor||0); }, 0);
  var saldo = valTotal - totalPagado;
  var pct2 = valTotal ? Math.round(totalPagado/valTotal*100) : 0;
  var pctColor = pct2 >= 90 ? 'var(--gr)' : pct2 >= 50 ? 'var(--am)' : 'var(--accent)';

  var h = '<div style="max-width:900px">';

  // KPI cards
  h += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">';
  h += '<div class="kcard bl"><div class="klbl">Valor total contrato</div><div class="kval sm">' + cop(valTotal) + '</div>';
  if(tad) h += '<div class="ksub">' + cop(ct.valor) + ' + ' + cop(tad) + ' adiciones</div>';
  h += '</div>';
  h += '<div class="kcard"><div class="klbl">Total pagado</div><div class="kval sm" style="color:var(--gr)">' + cop(totalPagado) + '</div><div class="ksub">' + pagos.length + ' pago(s)</div><div class="kbar"><div class="kfill" style="width:' + Math.min(100,pct2) + '%"></div></div></div>';
  h += '<div class="kcard am"><div class="klbl">Saldo por pagar</div><div class="kval sm">' + cop(Math.max(0,saldo)) + '</div><div class="ksub">' + (100-pct2) + '% pendiente</div></div>';

      acumM += Number(p.valor||0);
      var pos = Math.min(100, Math.round(acumM/valTotal*100));
      h += '<div style="position:absolute;left:' + pos + '%;transform:translateX(-50%);width:2px;height:6px;background:var(--bl-t);border-radius:1px" title="Pago ' + (p.num||i+1) + '"></div>';

    h += '</tr></thead><tbody>';
    var acum = 0;

      acum += Number(p.valor||0);

      h += '<tr>';
      h += '<td style="font-weight:700;color:var(--bl)">' + (p.num||'—') + '</td>';

function guardarPago(pid) {
  var cid   = Number($('pa_cid').value);
  var num   = $('pa_num').value.trim();
  var fecha = $('pa_fecha').value;
  var valor = Number($('pa_valor').value)||0;
  var obs   = $('pa_obs').value.trim();

  if(!cid) { toast('Selecciona un contrato.', true); return; }
  if(!fecha) { toast('La fecha es obligatoria.', true); return; }
  if(!valor) { toast('El valor debe ser mayor a cero.', true); return; }

  if(pid) {
    var p = D.pa.find(function(x){ return x.id == pid; });
    if(p) { p.cid=cid; p.num=num; p.fecha=fecha; p.valor=valor; p.obs=obs; }
  } else {
    D.pa.push({ id: Date.now()+Math.random(), cid, num, fecha, valor, obs });
  }
  save();
  closeModal();
  toast(pid ? 'Pago actualizado' : 'Pago registrado');
  // Si estamos en la ficha del contrato, recargar la tab de pagos
  if(ctPageCid == cid) {
    renderPagosContrato(cid);
    updateCounts();
  } else {
    render();
  }
}

function delPago(pid) {
  if(!confirm('¿Eliminar este pago?')) return;
  var p = D.pa.find(function(x){ return x.id == pid; });
  var cid = p ? p.cid : null;
  D.pa = D.pa.filter(function(x){ return x.id != pid; });
  save();
  toast('Pago eliminado');
  if(cid && ctPageCid == cid) {
    renderPagosContrato(cid);
    updateCounts();
  } else {
    render();
  }
}

function exportPagosCSV() {
  var rows = [['No.Pago','Contrato','Contratista','Fecha','Valor','Saldo','Observaciones']];
  D.ct.forEach(function(c) {
    var tad = D.ad.filter(function(a){ return a.cid==c.id; }).reduce(function(s,a){ return s+Number(a.valor||0); },0);
    var valTotal = Number(c.valor||0)+tad;
    var pagos = D.pa.filter(function(p){ return p.cid==c.id; }).sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||''); });
    var acum = 0;
    pagos.forEach(function(p) {
      acum += Number(p.valor||0);
      rows.push([p.num||'', c.num+' - '+c.obj, c.contratista||'', p.fecha||'', p.valor||0, valTotal-acum, p.obs||'']);
    });
  });
  var csv = rows.map(function(r){ return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download='EDESO_pagos_'+today()+'.csv'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

function previewFoto(input, prevId, hiddenId) {
  const file = input.files[0]; if(!file) return;
  if(file.size > 10*1024*1024) { toast('La imagen no debe superar 10 MB', true); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      // Redimensionar a máx 600x600 manteniendo proporción, sin perder calidad
      const MAX = 600;
      let w = img.width, h = img.height;
      if(w > MAX || h > MAX) {
        if(w > h) { h = Math.round(h * MAX/w); w = MAX; }
        else { w = Math.round(w * MAX/h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      const prev = $(prevId);
      if(prev) prev.innerHTML = '<img src="'+dataUrl+'" alt="foto" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
      const hidden = $(hiddenId);
      if(hidden) hidden.value = dataUrl;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Fotos de contrato
function addFotoCt(cid) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  input.onchange = function() {
    const c = D.ct.find(x => x.id == cid); if(!c) return;
    if(!c.fotos) c.fotos = [];
    let pending = input.files.length;
    Array.from(input.files).forEach(file => {
      if(file.size > 3*1024*1024) { toast('Imagen muy grande: '+file.name, true); pending--; return; }
      const reader = new FileReader();
      reader.onload = function(e) {
        c.fotos.push({ id: Date.now()+Math.random(), data: e.target.result, nombre: file.name });
        pending--;
        if(pending <= 0) { save(); renderFotos(cid); toast('Foto(s) agregada(s)'); }
      };
      reader.readAsDataURL(file);
    });
  };
  input.click();
}

function delFotoCt(cid, fid) {
  const c = D.ct.find(x => x.id == cid); if(!c||!c.fotos) return;
  c.fotos = c.fotos.filter(f => f.id != fid);
  save(); renderFotos(cid);
}

  const el = $('ct-fotos-wrap-'+cid); if(!el) return;

}


function ganttToggle(rowId, cid, prefix) {
  const ac = D.ac.find(a => rowId === `gr_${prefix}_${a.id}`);
  if(!ac) return;
  function childIds(pid) {
    const ch = D.ac.filter(a => a.cid==cid && String(a.pid)==String(pid));
    return ch.flatMap(c => [`gr_${prefix}_${c.id}`, ...childIds(c.id)]);
  }
  const ids = childIds(ac.id);
  const toggle = document.getElementById(`gt_${rowId}`);
  const collapsed = toggle && toggle.style.transform === 'rotate(-90deg)';
  ids.forEach(id => {
    const el  = document.getElementById(id);
    const bar = document.getElementById('bar_'+id);
    if(el)  el.style.display  = collapsed ? '' : 'none';
    if(bar) bar.style.display = collapsed ? '' : 'none';
  });
  if(toggle) toggle.style.transform = collapsed ? '' : 'rotate(-90deg)';
}

function syncGanttScrollV(el, prefix, cid) {
  // Sync vertical scroll between left rows and right bars
  const left  = document.getElementById('gleft_'+prefix+'_'+cid);
  const bars  = document.getElementById('gbars_'+prefix+'_'+cid);
  if(left  && el !== left)  left.scrollTop  = el.scrollTop;
  if(bars  && el !== bars)  bars.scrollTop  = el.scrollTop;
}

// ── SUSPENSIONES / REINICIOS ─────────────────────────────────
function suspensionesHTML(cid) {
  const c    = D.ct.find(x => x.id == cid); if(!c) return '';
  const sus  = D.su.filter(s => s.cid == cid).sort((a,b) => a.finicio.localeCompare(b.finicio));
  const td   = today();
  const activa = sus.find(s => !s.freinicio);
  const totalDias = diasSuspendidos(cid);
  const finReal = fechaFinReal(c);          // vigente (solo prórrogas)
  const finRef  = fechaFinConSusp(c);       // referencia informativa

  let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div>
      <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:600">Suspensiones y reinicios (${sus.length})</div>
      ${totalDias > 0 ? `<div style="font-size:12px;color:var(--mu2);margin-top:3px">
        Días suspendidos: <b style="color:var(--am)">${totalDias} días</b>
        ${finReal ? ` · Fecha fin vigente: <b style="color:var(--accent)">${fmt(finReal)}</b> <span style="font-size:10.5px;opacity:.8">(según prórrogas)</span>` : ''}
      </div>
      <div style="font-size:11px;color:var(--mu);margin-top:2px">
        Las suspensiones no modifican la fecha de terminación${finRef && finRef !== finReal ? ` — de reconocerse el plazo suspendido sería ${fmt(finRef)}` : ''}
      </div>` : ''}
    </div>
    ${!activa ? `<button class="btn bgr" onclick="openSusp(${cid})">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:-1px;margin-right:5px"><rect x="3" y="2" width="3" height="12" rx="1"/><rect x="10" y="2" width="3" height="12" rx="1"/></svg>
      Registrar suspensión
    </button>` : `<button class="btn" style="background:var(--gr-d);color:var(--gr-t);border:none;cursor:pointer;padding:7px 14px;border-radius:5px;font-family:\'Instrument Sans\',sans-serif;font-size:12.5px" onclick="openReinicio(${activa.id},${cid})">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:-1px;margin-right:5px"><polygon points="5,3 14,8 5,13"/></svg>
      Registrar reinicio
    </button>`}
  </div>`;

  // Alerta si hay suspensión activa
  if(activa) {
    const diasActivos = Math.ceil((new Date(td+'T00:00:00') - new Date(activa.finicio+'T00:00:00')) / 86400000);
    html += `<div style="background:var(--am-d);border:1px solid var(--am);border-radius:8px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="var(--am-t)" stroke-width="1.5"><rect x="3" y="2" width="3" height="12" rx="1"/><rect x="10" y="2" width="3" height="12" rx="1"/></svg>
      <div>
        <div style="font-size:12.5px;font-weight:700;color:var(--am-t)">Contrato suspendido desde ${fmt(activa.finicio)}</div>
        <div style="font-size:11.5px;color:var(--am-t);opacity:.85">${diasActivos} día(s) suspendido${activa.obs ? ' · '+activa.obs : ''}</div>
      </div>
    </div>`;
  }

  if(!sus.length) {
    html += `<div style="background:var(--sf2);border-radius:8px;padding:24px;text-align:center;color:var(--mu);font-size:13px">
      Sin suspensiones registradas
    </div>`;
    return html;
  }

  html += '<div style="display:flex;flex-direction:column;gap:8px">';
  sus.forEach((s, i) => {
    const ini  = new Date(s.finicio+'T00:00:00');
    const fin2 = s.freinicio ? new Date(s.freinicio+'T00:00:00') : new Date(td+'T00:00:00');
    const dias = Math.max(0, Math.ceil((fin2 - ini) / 86400000));
    const cerrada = !!s.freinicio;
    html += `<div style="background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px 16px;border-left:3px solid ${cerrada?'var(--gr)':'var(--am)'}">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="flex:1">
          <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-bottom:6px">
            <span><b style="color:var(--mu)">Suspensión:</b> <b>${fmt(s.finicio)}</b></span>
            <span><b style="color:var(--mu)">Reinicio:</b> <b style="color:${cerrada?'var(--gr)':'var(--am)'}">${s.freinicio ? fmt(s.freinicio) : 'Pendiente'}</b></span>
            <span style="font-weight:700;color:${cerrada?'var(--mu2)':'var(--am)'}">⏱ ${dias} día(s)</span>
            <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:${cerrada?'var(--gr-d)':'var(--am-d)'};color:${cerrada?'var(--gr-t)':'var(--am-t)'}">${cerrada?'Cerrada':'Activa'}</span>
          </div>
          ${s.obs ? `<div style="font-size:11.5px;color:var(--mu2);font-style:italic">"${s.obs}"</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          ${!cerrada ? `<button class="btn sm bgh" onclick="openReinicio(${s.id},${cid})" title="Registrar reinicio">▶ Reinicio</button>` : ''}
          <button class="btn sm brd" onclick="delSusp(${s.id},${cid})" title="Eliminar">×</button>
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function openSusp(cid) {
  const c = D.ct.find(x => x.id == cid);
  $('mTitle').textContent = 'Registrar suspensión';
  $('mBody').innerHTML = `<div class="fg">
    <div class="fl2 full" style="background:var(--am-d);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--am-t);margin-bottom:4px">
      El tiempo de ejecución se detendrá desde la fecha de suspensión. La fecha fin del contrato NO cambia: solo se modifica mediante prórrogas.
    </div>
    <div class="fl2"><label>Fecha de suspensión *</label><input id="su_fi" type="date" value="${today()}"></div>
    <div class="fl2 full"><label>Motivo / Observaciones</label><textarea id="su_obs" placeholder="Ej: Suspensión por condiciones climáticas, orden judicial, etc."></textarea></div>
  </div>`;
  $('mFoot').innerHTML = `<button class="btn bgh" onclick="closeModal()">Cancelar</button>
    <button class="btn bgr" onclick="saveSusp(${cid})">Registrar suspensión</button>`;
  openModal();
}

function saveSusp(cid) {
  const fi = $('su_fi').value;
  if(!fi) { toast('La fecha de suspensión es obligatoria', true); return; }
  if(suspActiva(cid)) { toast('Ya hay una suspensión activa — regístrala como reiniciada primero', true); return; }
  D.su.push({ id: Date.now(), cid, finicio: fi, freinicio: '', obs: $('su_obs').value.trim() });
  save(); closeModal();
  if(ctPageCid) verCt(ctPageCid);
  toast('Suspensión registrada');
}

function openReinicio(suId, cid) {
  const s = D.su.find(x => x.id == suId);
  $('mTitle').textContent = 'Registrar reinicio';
  $('mBody').innerHTML = `<div class="fg">
    <div class="fl2 full" style="background:var(--gr-d);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--gr-t);margin-bottom:4px">
      La fecha fin del contrato se extenderá automáticamente por los días suspendidos.
    </div>
    <div class="fl2"><label>Suspendido desde</label><input type="date" value="${s?.finicio||''}" disabled style="opacity:.6"></div>
    <div class="fl2"><label>Fecha de reinicio *</label><input id="su_fr" type="date" value="${today()}"></div>
    <div class="fl2 full"><label>Observaciones del reinicio</label><textarea id="su_robs" placeholder="Ej: Se retoman obras, condición superada…"></textarea></div>
  </div>`;
  $('mFoot').innerHTML = `<button class="btn bgh" onclick="closeModal()">Cancelar</button>
    <button class="btn bgr" onclick="saveReinicio(${suId},${cid})">Registrar reinicio</button>`;
  openModal();
}

function saveReinicio(suId, cid) {
  const fr = $('su_fr').value;
  if(!fr) { toast('La fecha de reinicio es obligatoria', true); return; }
  const s = D.su.find(x => x.id == suId);
  if(!s) return;
  if(fr <= s.finicio) { toast('El reinicio debe ser posterior a la suspensión', true); return; }
  s.freinicio = fr;
  if($('su_robs').value.trim()) s.obs = (s.obs ? s.obs+' | ' : '') + 'Reinicio: '+$('su_robs').value.trim();
  save(); closeModal();
  if(ctPageCid) verCt(ctPageCid);
  const dias = Math.ceil((new Date(fr+'T00:00:00') - new Date(s.finicio+'T00:00:00')) / 86400000);
  toast(`Reinicio registrado — ${dias} días suspendidos`);
}

function delSusp(id, cid) {
  if(!confirm('¿Eliminar esta suspensión?')) return;
  D.su = D.su.filter(s => s.id != id);
  save();
  if(ctPageCid) verCt(ctPageCid);
  toast('Suspensión eliminada');
}

function exportarDatos() {
  var exportData = {
    version: '1.0',
    fecha: new Date().toISOString(),
    sistema: 'EDESO Panel Gerencial',
    datos: {
      estados:      D.estados || [],
      supervisores: D.sv,
      contratos:    D.ct,
      prorrogas:    D.pr,
      adiciones:    D.ad,
      actividades:  D.ac,
      apoyos:       D.ap,
      asignaciones: D.cta || [],
      cortes:       D.co  || [],
      polizas:      D.pl  || [],
      suspensiones: D.su  || [],
      pagos:        D.pa  || []
    }
  };
  var json = JSON.stringify(exportData, null, 2);
  var blob = new Blob([json], {type:'application/json'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  var hoy  = new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'-');
  a.href = url; a.download = 'EDESO_backup_'+hoy+'.json'; a.click();
  URL.revokeObjectURL(url);
  toast('Datos exportados correctamente');
}

function importarDatos(input) {
  var file = input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var parsed = JSON.parse(e.target.result);
      var datos  = parsed.datos || parsed;
      if(!datos.contratos && !datos.ct) { toast('Archivo no válido', true); return; }
      var nuevo = {
        estados: datos.estados             || datos.est  || D.estados || [],
        sv:  datos.supervisores        || datos.sv  || [],
        ct:  datos.contratos           || datos.ct  || [],
        pr:  datos.prorrogas           || datos.pr  || [],
        ad:  datos.adiciones           || datos.ad  || [],
        ac:  datos.actividades         || datos.ac  || [],
        ap:  datos.apoyos              || datos.ap  || [],
        cta: datos.asignaciones        || datos.cta || [],
        co:  datos.cortes             || datos.cortesSeguimiento || datos.co  || [],
        pl:  datos.polizas             || datos.pl  || [],
        su:  datos.suspensiones        || datos.su  || [],
        pa:  datos.pagos               || datos.pa  || []
      };
      var total = nuevo.sv.length + nuevo.ct.length;
      if(!confirm(
        'Importar datos del backup?\n\n' +
        '• ' + nuevo.sv.length + ' supervisores\n' +
        '• ' + nuevo.ct.length + ' contratos\n' +
        '• ' + nuevo.pr.length + ' prórrogas\n' +
        '• ' + nuevo.ad.length + ' adiciones\n' +
        '• ' + nuevo.ac.length + ' actividades\n' +
        '• ' + nuevo.ap.length + ' apoyos\n' +
        '• ' + (nuevo.pa||[]).length + ' pagos\n\n' +
        'ATENCIÓN: esto reemplazará todos los datos actuales.'
      )) { input.value=''; return; }
      Object.assign(D, nuevo);
      save(); render();
      toast('Importación exitosa — ' + total + ' registros principales cargados');
    } catch(err) {
      toast('Error al leer el archivo — verifica que sea un JSON válido', true);
    }
    input.value = '';
  };
  reader.readAsText(file);
}
