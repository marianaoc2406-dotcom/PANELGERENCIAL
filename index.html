// ── EXCEL EXPORT / IMPORT ─────────────────────────────────

function importarDesdePlantilla(wb, errores, cb) {
  let creados=0, actualizados=0;
  function isoDateLocal(dt) {
    return String(dt.getFullYear())+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  }
  function normSheetName(v) {
    return (v||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  }
  function getSheetByName(sheetName) {
    const target = normSheetName(sheetName);
    const realName = wb.SheetNames.find(function(name){ return normSheetName(name) === target; });
    return realName ? wb.Sheets[realName] : null;
  }

  // Helper: convert Excel cell to date string YYYY-MM-DD
  function xd(v) {
    if(!v || v==='') return null;
    if(v instanceof Date) { return isoDateLocal(v); }
    if(typeof v === 'number') {
      // Excel serial date
      const d = XLSX.SSF.parse_date_code(v);
      if(d) return String(d.y)+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');
    }
    if(typeof v === 'string') {
      // DD/MM/YYYY
      const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
      // YYYY-MM-DD
      if(v.match(/^\d{4}-\d{2}-\d{2}/)) return v.slice(0,10);
    }
    return null;
  }
  function xn(v) { const n=Number(v); return isNaN(n)?0:n; }
  function xs(v) { return (v===null||v===undefined||v==='') ? '' : String(v).trim(); }
  function tipo_norm(v) {
    const t=xs(v).toLowerCase();
    if(t.includes('obra')) return 'obra';
    if(t.includes('consult')) return 'consultoria';
    if(t.includes('intervent')) return 'interventoria';
    if(t.includes('interadmin')) return 'interadministrativo';
    return t;
  }
  function mod_norm(v) {
    const s=xs(v);
    if(s.startsWith('CD')) return 'CD';
    if(s.startsWith('IP')) return 'IP';
    if(s.startsWith('IA')) return 'IA';
    if(s.startsWith('OC')) return 'OC';
    return s.substring(0,2);
  }
  function estado_norm(v) {
    const s=xs(v);
    const est = (D.estados||[]).find(function(e){ return e.label===s; });
    return est ? est.id : '';
  }

  // Rows helper — skip header rows (row 1 = title, row 2 = headers)
  function getRows(sheetName) {
    const ws = getSheetByName(sheetName);
    if(!ws) return [];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    // Skip rows 0 (title) and 1 (headers), start from row 2
    return rows.slice(2).filter(function(r){ return r.some(function(c){ return c!==''; }); });
  }

  // ── CONTRATOS PRINCIPALES ─────────────────────────────────
  // Cols: 0=No.Contrato, 1=Tipo, 2=Objeto, 3=Supervisor, 4=Contratista,
  //       5=Contratante, 6=RepLegal, 7=Valor, 8=Modalidad,
  //       9=FechaFirma, 10=FechaActa, 11=FechaFin, 12=Estado,
  //       13=AdmPct, 14=ImpPct, 15=UtilPct, 16=Lat, 17=Lng, 18=Obs
  getRows('Contratos Principales').forEach(function(r) {
    const num = xs(r[0]); if(!num) return;
    const obj = xs(r[2]); if(!obj) return;

    // Find supervisor
    const svNombre = xs(r[3]);
    const sv = D.sv.find(function(s){ return s.nombre.toUpperCase()===svNombre.toUpperCase(); });
    const svid = sv ? sv.id : null;

    // Check if contract already exists by number
    let ct = D.ct.find(function(x){ return xs(x.num)===num; });
    if(ct) {
      // Update existing
      ct.tipo=tipo_norm(r[1])||ct.tipo; ct.obj=obj;
      if(svid) ct.svid=svid;
      if(xs(r[4])) ct.contratista=xs(r[4]);
      if(xs(r[5])) ct.contratante=xs(r[5]);
      if(xs(r[6])) ct.repLegal=xs(r[6]);
      if(xn(r[7])>0) ct.valor=xn(r[7]);
      if(xs(r[8])) ct.mod=mod_norm(r[8]);
      if(xd(r[9]))  ct.fstart=xd(r[9]);
      if(xd(r[10])) ct.fai=xd(r[10]);
      if(xd(r[11])) ct.fend=xd(r[11]);
      if(xs(r[12])) ct.estado=estado_norm(r[12]);
      ct.aiu={adm:xn(r[13]),imp:xn(r[14]),util:xn(r[15])};
      if(xn(r[16])) ct.lat=xn(r[16]);
      if(xn(r[17])) ct.lng=xn(r[17]);
      if(xs(r[18])) ct.obs=xs(r[18]);
      actualizados++;
    } else {
      // Create new
      const fstart = xd(r[9]);
      const fend   = xd(r[11]);
      const nuevo = {
        id: Date.now()+Math.random(), num, obj,
        tipo: tipo_norm(r[1])||'obra', pid: null,
        svid: svid||null,
        contratista:xs(r[4]), contratante:xs(r[5]), repLegal:xs(r[6]),
        valor: xn(r[7]), mod: mod_norm(r[8]),
        fstart: fstart||'', fai: xd(r[10])||null, fend: fend||'',
        estado: estado_norm(r[12]),
        aiu:{adm:xn(r[13]),imp:xn(r[14]),util:xn(r[15])},
        lat:xn(r[16])||null, lng:xn(r[17])||null,
        obs:xs(r[18]), fc:{}, baseline:null,
      };
      D.ct.push(nuevo);
      creados++;
    }
  });

  // ── CONTRATOS DERIVADOS ───────────────────────────────────
  // Cols: 0=No.Contrato, 1=No.Padre, 2=Tipo, 3=Objeto, 4=Supervisor,
  //       5=Contratista, 6=Contratante, 7=RepLegal, 8=Valor, 9=Modalidad,
  //       10=FechaFirma, 11=FechaActa, 12=FechaFin, 13=Estado,
  //       14=AdmPct, 15=ImpPct, 16=UtilPct, 17=Lat, 18=Lng, 19=Obs
  getRows('Contratos Derivados').forEach(function(r) {
    const num = xs(r[0]); if(!num) return;
    const obj = xs(r[3]); if(!obj) return;

    // Find parent
    const numPadre = xs(r[1]);
    const ctPadre  = numPadre ? D.ct.find(function(x){ return xs(x.num)===numPadre; }) : null;
    const pid = ctPadre ? ctPadre.id : null;
    if(numPadre && !pid) errores.push('Contrato padre no encontrado: '+numPadre+' (para '+num+')');

    const svNombre = xs(r[4]);
    const sv = D.sv.find(function(s){ return s.nombre.toUpperCase()===svNombre.toUpperCase(); });
    const svid = sv ? sv.id : null;  // cada contrato derivado tiene su propio supervisor

    let ct = D.ct.find(function(x){ return xs(x.num)===num; });
    if(ct) {
      ct.pid=pid||ct.pid; ct.tipo=tipo_norm(r[2])||ct.tipo; ct.obj=obj;
      if(svid) ct.svid=svid;
      if(xs(r[5])) ct.contratista=xs(r[5]);
      if(xs(r[6])) ct.contratante=xs(r[6]);
      if(xs(r[7])) ct.repLegal=xs(r[7]);
      if(xn(r[8])>0) ct.valor=xn(r[8]);
      if(xs(r[9])) ct.mod=mod_norm(r[9]);
      if(xd(r[10])) ct.fstart=xd(r[10]);
      if(xd(r[11])) ct.fai=xd(r[11]);
      if(xd(r[12])) ct.fend=xd(r[12]);
      if(xs(r[13])) ct.estado=estado_norm(r[13]);
      ct.aiu={adm:xn(r[14]),imp:xn(r[15]),util:xn(r[16])};
      if(xn(r[17])) ct.lat=xn(r[17]);
      if(xn(r[18])) ct.lng=xn(r[18]);
      if(xs(r[19])) ct.obs=xs(r[19]);
      actualizados++;
    } else {
      const nuevo = {
        id: Date.now()+Math.random(), num, obj,
        tipo: tipo_norm(r[2])||'obra', pid: pid||null,
        svid: svid||null,
        contratista:xs(r[5]), contratante:xs(r[6]), repLegal:xs(r[7]),
        valor: xn(r[8]), mod: mod_norm(r[9]),
        fstart: xd(r[10])||'', fai: xd(r[11])||null, fend: xd(r[12])||'',
        estado: estado_norm(r[13]),
        aiu:{adm:xn(r[14]),imp:xn(r[15]),util:xn(r[16])},
        lat:xn(r[17])||null, lng:xn(r[18])||null,
        obs:xs(r[19]), fc:{}, baseline:null,
      };
      D.ct.push(nuevo);
      creados++;
    }
  });

  // ── PRÓRROGAS ─────────────────────────────────────────────
  // Cols: 0=No.Contrato, 1=No.Prórroga, 2=NuevaFechaFin, 3=DiasAdicionales, 4=Justificación
  getRows('Prórrogas').forEach(function(r) {
    const numCt = xs(r[0]); if(!numCt) return;
    const ct = D.ct.find(function(x){ return xs(x.num)===numCt; });
    if(!ct) { errores.push('Contrato no encontrado para prórroga: '+numCt); return; }
    const nfin = xd(r[2]); if(!nfin) return;
    const num  = xs(r[1])||'1';
    // Check if this prórroga already exists (same contract + same num)
    const exists = D.pr.find(function(p){ return p.cid==ct.id && xs(p.num)===num; });
    if(exists) {
      exists.nfin=nfin; if(xs(r[3])) exists.dias=xs(r[3]); if(xs(r[4])) exists.just=xs(r[4]);
      actualizados++;
    } else {
      D.pr.push({id:Date.now()+Math.random(), cid:ct.id, num, nfin, dias:xs(r[3]), just:xs(r[4])});
      creados++;
    }
  });

  // ── ADICIONES ─────────────────────────────────────────────
  // Cols: 0=No.Contrato, 1=No.Adición, 2=Valor, 3=Fecha, 4=Justificación
  getRows('Adiciones').forEach(function(r) {
    const numCt = xs(r[0]); if(!numCt) return;
    const ct = D.ct.find(function(x){ return xs(x.num)===numCt; });
    if(!ct) { errores.push('Contrato no encontrado para adición: '+numCt); return; }
    const valor = xn(r[2]); if(!valor) return;
    const num   = xs(r[1])||'1';
    const exists = D.ad.find(function(a){ return a.cid==ct.id && xs(a.num)===num; });
    if(exists) {
      exists.valor=valor; if(xd(r[3])) exists.fecha=xd(r[3]); if(xs(r[4])) exists.just=xs(r[4]);
      actualizados++;
    } else {
      D.ad.push({id:Date.now()+Math.random(), cid:ct.id, num, valor, fecha:xd(r[3])||'', just:xs(r[4])});
      creados++;
    }
  });

  // ── SUSPENSIONES ──────────────────────────────────────────
  // Cols: 0=No.Contrato, 1=FechaSuspensión, 2=Motivo
  getRows('Suspensiones').forEach(function(r) {
    const numCt = xs(r[0]); if(!numCt) return;
    const ct = D.ct.find(function(x){ return xs(x.num)===numCt; });
    if(!ct) { errores.push('Contrato no encontrado para suspensión: '+numCt); return; }
    const fi = xd(r[1]); if(!fi) return;
    const exists = D.su.find(function(s){ return s.cid==ct.id && s.finicio===fi; });
    if(exists) {
      if(xs(r[2])) exists.obs=xs(r[2]);
      actualizados++;
    } else {
      D.su.push({id:Date.now()+Math.random(), cid:ct.id, finicio:fi, freinicio:'', obs:xs(r[2])});
      creados++;
    }
  });

  // ── REINICIOS ─────────────────────────────────────────────
  // Cols: 0=No.Contrato, 1=FechaReinicio, 2=Observación
  // Match with existing suspension by contract — set freinicio
  getRows('Reinicios').forEach(function(r) {
    const numCt = xs(r[0]); if(!numCt) return;
    const ct = D.ct.find(function(x){ return xs(x.num)===numCt; });
    if(!ct) { errores.push('Contrato no encontrado para reinicio: '+numCt); return; }
    const fr = xd(r[1]); if(!fr) return;
    // Find the open suspension for this contract (no freinicio)
    const susp = D.su.filter(function(s){ return s.cid==ct.id; })
                     .sort(function(a,b){ return (a.finicio||'').localeCompare(b.finicio||''); });
    if(susp.length) {
      // Assign reinicio to last suspension that doesn't have one yet
      const open = susp.filter(function(s){ return !s.freinicio; });
      const target = open.length ? open[0] : susp[susp.length-1];
      target.freinicio = fr;
      if(xs(r[2])) target.obs = (target.obs?target.obs+' | ':'')+xs(r[2]);
      actualizados++;
    } else {
      errores.push('No se encontró suspensión abierta para reinicio en contrato: '+numCt);
    }
  });

  cb(creados, actualizados);
}

// ── IMPORTAR DESDE EXPORTACIÓN DEL SISTEMA (formato original) ────────────────
function importarDesdeExportacion(wb, errores, cb) {
  let creados=0, actualizados=0;

  function getRows(sheetName) {
    if(!wb.SheetNames.includes(sheetName)) return [];
    const ws = wb.Sheets[sheetName];
    return XLSX.utils.sheet_to_json(ws, {header:1, defval:''}).slice(1)
               .filter(function(r){ return r.some(function(c){ return c!==''; }); });
  }

  // Hoja CONTRATOS — busca por ID interno
  getRows('Contratos').forEach(function(r) {
    const id=Number(r[1]); if(!id) return;
    const ct=D.ct.find(function(x){ return x.id==id; });
    if(!ct){ errores.push('Contrato ID '+id+' no encontrado'); return; }
    if(r[11]) ct.fstart = xlDate(r[11]);
    if(r[12]) ct.fai    = xlDate(r[12]);
    if(r[13]) ct.fend   = xlDate(r[13]);
    if(r[21]!=='') ct.obs = String(r[21]);
    actualizados++;
  });

  // Prórrogas, Suspensiones, Adiciones, Pólizas — formato original con IDs
  getRows('Prórrogas').forEach(function(r) {
    const pid=Number(r[0]); const cid=Number(r[1]); if(!cid) return;
    if(pid) {
      const p=D.pr.find(function(x){ return x.id==pid; });
      if(p){ if(r[5]!=='') p.num=String(r[5]); if(r[6]) p.nfin=xlDate(r[6]); if(r[7]!=='') p.dias=String(r[7]); if(r[8]!=='') p.just=String(r[8]); actualizados++; }
    } else {
      const nfin=r[6]?xlDate(r[6]):'';
      if(nfin && D.ct.find(function(x){ return x.id==cid; })){
        D.pr.push({id:Date.now()+Math.random(),cid,num:String(r[5]||''),nfin,dias:String(r[7]||''),just:String(r[8]||'')}); creados++;
      }
    }
  });
  getRows('Suspensiones').forEach(function(r) {
    const sid=Number(r[0]); const cid=Number(r[1]); if(!cid) return;
    if(sid) {
      const s=D.su.find(function(x){ return x.id==sid; });
      if(s){ if(r[5]) s.finicio=xlDate(r[5]); if(r[6]) s.freinicio=xlDate(r[6]); if(r[9]!=='') s.obs=String(r[9]); actualizados++; }
    } else {
      const fi=r[5]?xlDate(r[5]):'';
      if(fi && D.ct.find(function(x){ return x.id==cid; })){
        D.su.push({id:Date.now()+Math.random(),cid,finicio:fi,freinicio:r[6]?xlDate(r[6]):'',obs:String(r[9]||'')}); creados++;
      }
    }
  });
  getRows('Adiciones').forEach(function(r) {
    const aid=Number(r[0]); const cid=Number(r[1]); if(!cid) return;
    if(aid) {
      const a=D.ad.find(function(x){ return x.id==aid; });
      if(a){ if(r[5]!=='') a.num=String(r[5]); if(r[6]!=='') a.valor=Number(r[6])||0; if(r[7]) a.fecha=xlDate(r[7]); if(r[8]!=='') a.just=String(r[8]); actualizados++; }
    } else {
      const valor=Number(r[6])||0;
      if(valor && D.ct.find(function(x){ return x.id==cid; })){
        D.ad.push({id:Date.now()+Math.random(),cid,num:String(r[5]||''),valor,fecha:r[7]?xlDate(r[7]):'',just:String(r[8]||'')}); creados++;
      }
    }
  });

  cb(creados, actualizados);
}


function exportarExcel() {
  // SheetJS should be loaded — check
  if(typeof XLSX === 'undefined') {
    toast('Cargando librería Excel, intenta de nuevo...', true);
    return;
  }

  const wb = XLSX.utils.book_new();
  const hoy = new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'});

  // ── Hoja 1: CONTRATOS (orden jerárquico agrupado por supervisor) ──
  const ctRows = [
    ['Supervisor','ID','No. Contrato','Tipo','Nivel','Objeto','Contratista','Contratante','Rep. Legal',
     'Valor Inicial (COP)','Modalidad','Fecha Firma','Fecha Acta Inicio','Fecha Fin Original',
     'Días Suspendidos','Fecha Fin Vigente (con prórrogas)','Estado','% Avance Real','% Avance Estimado',
     'Valor Adiciones (COP)','Valor Total (COP)','Observaciones']
  ];

  // Construir orden jerárquico: para cada supervisor, sus contratos raíz y derivados
  function addCtRow(c, nivel) {
    const sv   = svEfectivo(c);
    const ads  = D.ad.filter(a => a.cid == c.id);
    const tad  = ads.reduce((s,a) => s + Number(a.valor||0), 0);
    const e    = status(c);
    const real = pctReal(c.id);
    const est  = pctEst2(c) ?? 0;
    const finR = fechaFinReal(c);
    const diasSusp = diasSuspendidos(c.id);
    const nivelLabel = nivel === 0 ? 'Principal' : '  ↳ Derivado';
    ctRows.push([
      sv ? sv.nombre : '(Sin supervisor)',
      c.id, c.num, c.tipo||'obra', nivelLabel, c.obj,
      c.contratista||'', c.contratante||'', c.repLegal||'',
      Number(c.valor||0), c.mod||'',
      c.fstart||'', c.fai||'', c.fend||'',
      diasSusp, finR||c.fend||'',
      e.lbl, real, est,
      tad, Number(c.valor||0)+tad,
      c.obs||''
    ]);
    // Agregar derivados inmediatos recursivamente
    kids(c.id).forEach(h => addCtRow(h, nivel + 1));
  }

  // Ordenar supervisores alfabéticamente; sin supervisor al final
  const svOrden = [...D.sv].sort((a,b) => a.nombre.localeCompare(b.nombre));
  const sinSv   = D.ct.filter(c => !c.pid && !svEfectivo(c));

  svOrden.forEach(sv => {
    const raices = D.ct.filter(c => !c.pid && svEfectivo(c)?.id == sv.id);
    raices.forEach(c => addCtRow(c, 0));
  });
  sinSv.forEach(c => addCtRow(c, 0));

  const wsCtFull = XLSX.utils.aoa_to_sheet(ctRows);
  wsCtFull['!cols'] = [
    {wch:24},{wch:10},{wch:16},{wch:16},{wch:10},{wch:55},{wch:28},{wch:20},{wch:22},
    {wch:18},{wch:8},{wch:13},{wch:14},{wch:13},
    {wch:12},{wch:13},
    {wch:16},{wch:10},{wch:10},
    {wch:18},{wch:18},{wch:30}
  ];
  XLSX.utils.book_append_sheet(wb, wsCtFull, 'Contratos');

  // ── Hoja 2: PRÓRROGAS ─────────────────────────────────
  const prRows = [
    ['ID Prórroga','ID Contrato','No. Contrato','Objeto Contrato','Supervisor',
     'No. Prórroga','Nueva Fecha Fin','Días Adicionales','Justificación']
  ];
  D.pr.forEach(p => {
    const c  = D.ct.find(x => x.id == p.cid);
    const sv = c ? svEfectivo(c) : null;
    prRows.push([
      p.id, p.cid, c?c.num:'', c?c.obj:'', sv?sv.nombre:'',
      p.num||'', p.nfin||'', p.dias||'', p.just||''
    ]);
  });
  const wsPr = XLSX.utils.aoa_to_sheet(prRows);
  wsPr['!cols'] = [{wch:12},{wch:12},{wch:14},{wch:40},{wch:24},{wch:10},{wch:13},{wch:12},{wch:40}];
  XLSX.utils.book_append_sheet(wb, wsPr, 'Prórrogas');

  // ── Hoja 3: SUSPENSIONES ──────────────────────────────
  const suRows = [
    ['ID Suspensión','ID Contrato','No. Contrato','Objeto Contrato','Supervisor',
     'Fecha Suspensión','Fecha Reinicio','Estado','Días Suspendidos','Motivo / Observaciones']
  ];
  D.su.forEach(s => {
    const c  = D.ct.find(x => x.id == s.cid);
    const sv = c ? svEfectivo(c) : null;
    const ini2 = new Date(s.finicio+'T00:00:00');
    const fin2 = s.freinicio ? new Date(s.freinicio+'T00:00:00') : new Date();
    const dias = Math.max(0, Math.ceil((fin2 - ini2) / 86400000));
    suRows.push([
      s.id, s.cid, c?c.num:'', c?c.obj:'', sv?sv.nombre:'',
      s.finicio||'', s.freinicio||'', s.freinicio?'Cerrada':'Activa',
      dias, s.obs||''
    ]);
  });
  const wsSu = XLSX.utils.aoa_to_sheet(suRows);
  wsSu['!cols'] = [{wch:12},{wch:12},{wch:14},{wch:40},{wch:24},{wch:13},{wch:13},{wch:10},{wch:13},{wch:50}];
  XLSX.utils.book_append_sheet(wb, wsSu, 'Suspensiones');

  // ── Hoja 4: ADICIONES ─────────────────────────────────
  const adRows = [
    ['ID Adición','ID Contrato','No. Contrato','Objeto Contrato','Supervisor',
     'No. Adición','Valor (COP)','Fecha','Justificación']
  ];
  D.ad.forEach(a => {
    const c  = D.ct.find(x => x.id == a.cid);
    const sv = c ? svEfectivo(c) : null;
    adRows.push([
      a.id, a.cid, c?c.num:'', c?c.obj:'', sv?sv.nombre:'',
      a.num||'', Number(a.valor||0), a.fecha||'', a.just||''
    ]);
  });
  const wsAd = XLSX.utils.aoa_to_sheet(adRows);
  wsAd['!cols'] = [{wch:12},{wch:12},{wch:14},{wch:40},{wch:24},{wch:10},{wch:16},{wch:12},{wch:40}];
  XLSX.utils.book_append_sheet(wb, wsAd, 'Adiciones');

  // ── Hoja 5: PÓLIZAS ───────────────────────────────────
  const plRows = [
    ['ID Póliza','ID Contrato','No. Contrato','Objeto Contrato','Supervisor',
     'Nombre / Tipo Póliza','Fecha Inicio','Fecha Fin (Vencimiento)','Estado','Días Restantes','Observaciones']
  ];
  D.pl.forEach(p => {
    const c  = D.ct.find(x => x.id == p.cid);
    const sv = c ? svEfectivo(c) : null;
    const d  = daysLeft(p.ffin);
    let est  = 'Sin fecha';
    if(d !== null) { est = d < 0 ? 'Vencida' : d <= 30 ? 'Por vencer' : 'Vigente'; }
    plRows.push([
      p.id, p.cid, c?c.num:'', c?c.obj:'', sv?sv.nombre:'',
      p.nombre||'', p.finicio||'', p.ffin||'', est, d!==null?d:'', p.obs||''
    ]);
  });
  const wsPl = XLSX.utils.aoa_to_sheet(plRows);
  wsPl['!cols'] = [{wch:12},{wch:12},{wch:14},{wch:40},{wch:24},{wch:24},{wch:13},{wch:14},{wch:10},{wch:12},{wch:40}];
  XLSX.utils.book_append_sheet(wb, wsPl, 'Pólizas');

  // ── Hoja 6: APOYOS ────────────────────────────────────
  const apRows = [
    ['ID Apoyo','Nombre','Cargo / Rol','Cédula','Teléfono','Correo',
     'Contratos Asignados (Nos.)','Contratos Asignados (Objetos)']
  ];
  D.ap.forEach(a => {
    const asigs = D.cta.filter(x => x.apid == a.id);
    const cts   = asigs.map(x => D.ct.find(c => c.id == x.cid)).filter(Boolean);
    apRows.push([
      a.id, a.nombre||'', a.cargo||'', a.cedula||'', a.tel||'', a.email||'',
      cts.map(c=>c.num).join(', '),
      cts.map(c=>c.obj).join(' | ')
    ]);
  });
  const wsAp = XLSX.utils.aoa_to_sheet(apRows);
  wsAp['!cols'] = [{wch:12},{wch:24},{wch:20},{wch:14},{wch:14},{wch:28},{wch:30},{wch:60}];
  XLSX.utils.book_append_sheet(wb, wsAp, 'Apoyos');

  // ── Hoja 7: SUPERVISORES ──────────────────────────────
  const svRows = [
    ['ID','Nombre','Cargo','Cédula','Teléfono','Correo',
     'No. Contratos Raíz','Contratos Raíz (Nos.)','No. Contratos Derivados','Contratos Derivados (Nos.)']
  ];
  D.sv.forEach(s => {
    const raices  = D.ct.filter(c => !c.pid && svEfectivo(c)?.id == s.id);
    // Todos los contratos (directos e indirectos) donde este sv es efectivo
    const todos   = D.ct.filter(c => svEfectivo(c)?.id == s.id);
    const derivados = todos.filter(c => c.pid);
    svRows.push([
      s.id, s.nombre||'', s.cargo||'', s.cedula||'', s.tel||'', s.email||'',
      raices.length,   raices.map(c=>c.num).join(', '),
      derivados.length, derivados.map(c=>c.num).join(', ')
    ]);
  });
  const wsSv = XLSX.utils.aoa_to_sheet(svRows);
  wsSv['!cols'] = [{wch:12},{wch:24},{wch:20},{wch:14},{wch:14},{wch:28},{wch:14},{wch:40},{wch:16},{wch:60}];
  XLSX.utils.book_append_sheet(wb, wsSv, 'Supervisores');

  // ── Hoja: PAGOS ───────────────────────────────────────
  const paRows = [
    ['ID Pago','ID Contrato','No. Contrato','Objeto','Contratista','Valor Total Contrato',
     'No. Pago','Fecha Pago','Valor Pago','Acumulado','Saldo','Observaciones']
  ];
  D.ct.forEach(function(c) {
    var tad = D.ad.filter(function(a){ return a.cid==c.id; }).reduce(function(s,a){ return s+Number(a.valor||0); },0);
    var valTotal = Number(c.valor||0)+tad;
    var pagos = D.pa.filter(function(p){ return p.cid==c.id; }).sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||''); });
    var acumP = 0;
    pagos.forEach(function(p) {
      acumP += Number(p.valor||0);
      paRows.push([
        p.id, c.id, c.num, c.obj, c.contratista||'', valTotal,
        p.num||'', p.fecha||'', Number(p.valor||0), acumP, valTotal-acumP, p.obs||''
      ]);
    });
  });
  const wsPa = XLSX.utils.aoa_to_sheet(paRows);
  wsPa['!cols'] = [{wch:12},{wch:10},{wch:16},{wch:50},{wch:24},{wch:18},{wch:14},{wch:12},{wch:16},{wch:16},{wch:16},{wch:40}];
  XLSX.utils.book_append_sheet(wb, wsPa, 'Pagos');

  // ── Descargar ──────────────────────────────────────────
  const fname = 'EDESO_Resumen_'+hoy.replace(/\//g,'-')+'.xlsx';
  XLSX.writeFile(wb, fname);
  toast('Resumen Excel exportado: ' + fname);
}

// ── IMPORTAR DESDE EXCEL ──────────────────────────────────
// Soporta dos formatos:
//   1. Exportación EDESO (hojas: Contratos, Prórrogas, Suspensiones, Adiciones, Pólizas, Pagos)
//   2. Plantilla Semanal de Supervisores (hojas: AVANCE, PAGOS, PRÓRROGAS, ADICIONES, SUSPENSIONES, OBSERVACIONES)
function importarExcel(input) {
  const file = input.files[0]; if(!file) return;
  if(typeof XLSX === 'undefined') { toast('Librería Excel no cargada', true); input.value=''; return; }

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(e.target.result, { type:'array', cellDates:true });

      // Normaliza nombre de hoja: quita tildes, emojis, espacios extras, pasa a minúsculas
      function normSheet(v) {
        return (v||'').toString()
          .replace(/[\u{1F300}-\u{1FFFF}]/gu, '')   // quita emojis
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .toLowerCase().trim();
      }

      function getSheet(/* ...aliases */) {
        const aliases = Array.from(arguments).map(normSheet);
        const name = wb.SheetNames.find(function(n){ return aliases.includes(normSheet(n)); });
        return name ? wb.Sheets[name] : null;
      }

      // Detectar formato: la plantilla semanal tiene la hoja "AVANCE" o "INSTRUCCIONES"
      const esPlantillaSemanal = !!getSheet('AVANCE', 'avance', '📊 AVANCE') ||
                                  !!getSheet('INSTRUCCIONES', '📋 INSTRUCCIONES');

      let cambios = 0;
      const errores   = [];
      const resumen   = { avance:0, pagos:0, prorrogas:0, adiciones:0, suspensiones:0, obs:0, contratos:0, polizas:0 };

      // ──────────────────────────────────────────────────────
      // FORMATO 1: Plantilla semanal de supervisores
      // ──────────────────────────────────────────────────────
      if(esPlantillaSemanal) {

        // ── AVANCE (col: B=cid, C=nombre, D=actividad, E=%ant, F=%actual, I=obs) ──
        {
          const ws = getSheet('AVANCE', '📊 AVANCE');
          if(ws) {
            // Filas de datos desde fila 7 (índice 6 tras skip de 6 cabeceras)
            const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', range:6 });
            rows.forEach(function(r) {
              const cid  = Number(r[0]); if(!cid) return;
              const ct   = D.ct.find(function(x){ return x.id == cid; });
              if(!ct) { errores.push('Avance: contrato ID ' + cid + ' no encontrado'); return; }

              const pctActual = r[4] !== '' ? Number(r[4]) : null;
              const nomAct    = String(r[2]||'').trim();
              const obsAv     = String(r[7]||'').trim();

              if(pctActual === null || isNaN(pctActual)) return;

              // Buscar actividad por nombre dentro del contrato
              if(nomAct) {
                const ac = D.ac.find(function(a){
                  return a.cid == cid && (a.nombre||'').toLowerCase().trim() === nomAct.toLowerCase();
                });
                if(ac) {
                  ac.pr = Math.min(100, Math.max(0, Math.round(pctActual)));
                  cambios++; resumen.avance++;
                } else if(ct.trackingMode === 'pct') {
                  // Para contratos en modo %, crear un corte con los valores
                  var pctProg = r[3] !== '' ? Number(r[3]) : null;
                  if(!isNaN(pctActual) && pctActual !== null) {
                    D.co.push({ id: Date.now()+Math.random(), cid, fecha: fecha || hoy,
                      pctReal: Math.min(100,Math.max(0,Math.round(pctActual*10)/10)),
                      pctEst: pctProg !== null && !isNaN(pctProg) ? Math.min(100,Math.max(0,pctProg)) : 0, obs: obsAv });
                    cambios++; resumen.avance++;
                  }
                } else {
                  // Actividad no encontrada por nombre — actualizar todas las raíz si hay una sola
                  const roots = D.ac.filter(function(a){ return a.cid == cid && !a.pid; });
                  if(roots.length === 1) {
                    roots[0].pr = Math.min(100, Math.max(0, Math.round(pctActual)));
                    cambios++; resumen.avance++;
                  } else {
                    errores.push('Avance: actividad "' + nomAct + '" no encontrada en contrato ' + (ct.num||cid));
                  }
                }
              } else {
                // Sin nombre de actividad: actualizar todas las raíz
                const roots = D.ac.filter(function(a){ return a.cid == cid && !a.pid; });
                roots.forEach(function(a){
                  a.pr = Math.min(100, Math.max(0, Math.round(pctActual)));
                  cambios++; resumen.avance++;
                });
              }

              // Guardar obs de avance en el contrato si viene
              if(obsAv && obsAv !== '—') { ct.obs_avance = obsAv; }
            });
          }
        }

        // ── PAGOS (col: B=cid, C=nombre, D=numPago, E=fecha, F=valor, G=saldo, H=obs) ──
        {
          const ws = getSheet('PAGOS', '💰 PAGOS');
          if(ws) {
            const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', range:6 });
            rows.forEach(function(r) {
              const cid   = Number(r[0]); if(!cid) return;
              const ct    = D.ct.find(function(x){ return x.id == cid; });
              if(!ct) { errores.push('Pagos: contrato ID ' + cid + ' no encontrado'); return; }

              const numPago = String(r[2]||'').trim();
              const fecha   = r[3] ? xlDate(r[3]) : '';
              const valor   = Number(r[4])||0;
              const obs     = String(r[6]||'').trim();

              if(!fecha || !valor) return;

              // Evitar duplicados: mismo contrato + mismo número de pago
              const existe = numPago && D.pa.find(function(p){
                return p.cid == cid && (p.num||'').toLowerCase() === numPago.toLowerCase();
              });
              if(existe) {
                // Actualizar
                existe.fecha = fecha; existe.valor = valor; if(obs) existe.obs = obs;
                cambios++; resumen.pagos++;
              } else {
                D.pa.push({ id: Date.now()+Math.random(), cid, num:numPago, fecha, valor, obs });
                cambios++; resumen.pagos++;
              }
            });
          }
        }

        // ── PRÓRROGAS (col: B=cid, C=nombre, D=fAnterior, E=fNueva, F=numPr, G=dias, H=just) ──
        {
          const ws = getSheet('PRÓRROGAS', 'PRORROGAS', '📅 PRÓRROGAS', '📅 PRORROGAS');
          if(ws) {
            const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', range:6 });
            rows.forEach(function(r) {
              const cid  = Number(r[0]); if(!cid) return;
              const ct   = D.ct.find(function(x){ return x.id == cid; }); if(!ct) return;

              const nfin = r[3] ? xlDate(r[3]) : '';
              const num  = String(r[4]||'').trim();
              const just = String(r[6]||'').trim();
              const dias = r[5] !== '' ? String(r[5]) : '';

              if(!nfin) return;

              // Evitar duplicado: mismo contrato + misma nueva fecha fin
              const existe = D.pr.find(function(p){ return p.cid == cid && p.nfin === nfin; });
              if(!existe) {
                D.pr.push({ id: Date.now()+Math.random(), cid, num, nfin, dias, just });
                cambios++; resumen.prorrogas++;
              }
            });
          }
        }

        // ── ADICIONES (col: B=cid, C=nombre, D=numAd, E=valor, F=fecha, G=just) ──
        {
          const ws = getSheet('ADICIONES', '➕ ADICIONES');
          if(ws) {
            const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', range:6 });
            rows.forEach(function(r) {
              const cid   = Number(r[0]); if(!cid) return;
              const ct    = D.ct.find(function(x){ return x.id == cid; }); if(!ct) return;

              const num   = String(r[2]||'').trim();
              const valor = Number(r[3])||0;
              const fecha = r[4] ? xlDate(r[4]) : '';
              const just  = String(r[5]||'').trim();

              if(!valor) return;

              // Evitar duplicado: mismo contrato + mismo número de adición
              const existe = num && D.ad.find(function(a){
                return a.cid == cid && (a.num||'').toLowerCase() === num.toLowerCase();
              });
              if(!existe) {
                D.ad.push({ id: Date.now()+Math.random(), cid, num, valor, fecha, just });
                cambios++; resumen.adiciones++;
              }
            });
          }
        }

        // ── SUSPENSIONES (col: B=cid, C=nombre, D=tipo, E=finicio, F=freinicio, G=obs) ──
        {
          const ws = getSheet('SUSPENSIONES', '⏸ SUSPENSIONES');
          if(ws) {
            const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', range:6 });
            rows.forEach(function(r) {
              const cid     = Number(r[0]); if(!cid) return;
              const ct      = D.ct.find(function(x){ return x.id == cid; }); if(!ct) return;

              const finicio   = r[3] ? xlDate(r[3]) : '';
              const freinicio = r[4] ? xlDate(r[4]) : '';
              const obs       = String(r[5]||'').trim();

              if(!finicio) return;

              // Evitar duplicado: mismo contrato + misma fecha inicio
              const existe = D.su.find(function(s){ return s.cid == cid && s.finicio === finicio; });
              if(!existe) {
                D.su.push({ id: Date.now()+Math.random(), cid, finicio, freinicio, obs });
                cambios++; resumen.suspensiones++;
              } else if(freinicio && !existe.freinicio) {
                // Actualizar fecha de reinicio si se completó
                existe.freinicio = freinicio;
                cambios++; resumen.suspensiones++;
              }
            });
          }
        }

        // ── OBSERVACIONES (col: B=cid, C=nombre, D=tipo, E=nivel, F=desc) ──
        {
          const ws = getSheet('OBSERVACIONES', '📝 OBSERVACIONES');
          if(ws) {
            const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', range:6 });
            rows.forEach(function(r) {
              const cid  = Number(r[0]); if(!cid) return;
              const ct   = D.ct.find(function(x){ return x.id == cid; }); if(!ct) return;

              const tipo  = String(r[2]||'').trim();
              const nivel = String(r[3]||'').trim();
              const desc  = String(r[4]||'').trim();
              if(!desc) return;

              if(!ct.observaciones) ct.observaciones = [];
              ct.observaciones.push({
                fecha: today(), tipo, nivel, desc,
                id: Date.now()+Math.random()
              });
              cambios++; resumen.obs++;
            });
          }
        }

        // Resumen amigable
        save(); render();
        const partes = [];
        if(resumen.avance)       partes.push(resumen.avance + ' actividades actualizadas');
        if(resumen.pagos)        partes.push(resumen.pagos + ' pago(s) registrado(s)');
        if(resumen.prorrogas)    partes.push(resumen.prorrogas + ' prórroga(s)');
        if(resumen.adiciones)    partes.push(resumen.adiciones + ' adición(es)');
        if(resumen.suspensiones) partes.push(resumen.suspensiones + ' suspensión(es)');
        if(resumen.obs)          partes.push(resumen.obs + ' observación(es)');

        if(partes.length === 0) {
          toast('El archivo no tenía datos nuevos para importar.', true);
        } else {
          toast('✅ Plantilla importada — ' + partes.join(', '));
        }
        if(errores.length) {
          console.warn('EDESO plantilla semanal — advertencias:', errores);
          setTimeout(function(){
            toast('⚠ ' + errores.length + ' advertencia(s). Abre la consola para ver el detalle.', true);
          }, 2500);
        }

      // ──────────────────────────────────────────────────────
      // FORMATO 2: Exportación EDESO (formato original)
      // ──────────────────────────────────────────────────────
      } else {

        // Hoja CONTRATOS
        {
          const ws = getSheet('Contratos');
          if(ws) {
            const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
            for(let i = 1; i < rows.length; i++) {
              const r = rows[i];
              const id = Number(r[1]); if(!id) continue;
              const c  = D.ct.find(x => x.id == id);
              if(!c) { errores.push('Contrato ID '+id+' no encontrado'); continue; }
              if(r[11]) c.fstart = xlDate(r[11]);
              if(r[12]) c.fai    = xlDate(r[12]);
              if(r[13]) c.fend   = xlDate(r[13]);
              if(r[21] !== '') c.obs = String(r[21]);
              cambios++; resumen.contratos++;
            }
          }
        }

        // Hoja PRÓRROGAS
        {
          const ws = getSheet('Prórrogas', 'Prorrogas');
          if(ws) {
            const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
            for(let i = 1; i < rows.length; i++) {
              const r = rows[i]; const pid = Number(r[0]); const cid = Number(r[1]); if(!cid) continue;
              if(pid) {
                const p = D.pr.find(x => x.id == pid);
                if(p) { if(r[5]!=='') p.num=String(r[5]); if(r[6]) p.nfin=xlDate(r[6]); if(r[7]!=='') p.dias=String(r[7]); if(r[8]!=='') p.just=String(r[8]); cambios++; resumen.prorrogas++; }
              } else {
                const nfin = r[6] ? xlDate(r[6]) : '';
                if(nfin && D.ct.find(x => x.id==cid)) { D.pr.push({id:Date.now()+Math.random(),cid,num:String(r[5]||''),nfin,dias:String(r[7]||''),just:String(r[8]||'')}); cambios++; resumen.prorrogas++; }
              }
            }
          }
        }

        // Hoja SUSPENSIONES
        {
          const ws = getSheet('Suspensiones');
          if(ws) {
            const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
            for(let i = 1; i < rows.length; i++) {
              const r = rows[i]; const sid = Number(r[0]); const cid = Number(r[1]); if(!cid) continue;
              if(sid) {
                const s = D.su.find(x => x.id==sid);
                if(s) { if(r[5]) s.finicio=xlDate(r[5]); if(r[6]) s.freinicio=xlDate(r[6]); if(r[9]!=='') s.obs=String(r[9]); cambios++; resumen.suspensiones++; }
              } else {
                const fi = r[5] ? xlDate(r[5]) : '';
                if(fi && D.ct.find(x => x.id==cid)) { D.su.push({id:Date.now()+Math.random(),cid,finicio:fi,freinicio:r[6]?xlDate(r[6]):'',obs:String(r[9]||'')}); cambios++; resumen.suspensiones++; }
              }
            }
          }
        }

        // Hoja ADICIONES
        {
          const ws = getSheet('Adiciones');
          if(ws) {
            const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
            for(let i = 1; i < rows.length; i++) {
              const r = rows[i]; const aid = Number(r[0]); const cid = Number(r[1]); if(!cid) continue;
              if(aid) {
                const a = D.ad.find(x => x.id==aid);
                if(a) { if(r[5]!=='') a.num=String(r[5]); if(r[6]!=='') a.valor=Number(r[6])||0; if(r[7]) a.fecha=xlDate(r[7]); if(r[8]!=='') a.just=String(r[8]); cambios++; resumen.adiciones++; }
              } else {
                const valor = Number(r[6])||0;
                if(valor && D.ct.find(x => x.id==cid)) { D.ad.push({id:Date.now()+Math.random(),cid,num:String(r[5]||''),valor,fecha:r[7]?xlDate(r[7]):'',just:String(r[8]||'')}); cambios++; resumen.adiciones++; }
              }
            }
          }
        }

        // Hoja PÓLIZAS
        {
          const ws = getSheet('Pólizas', 'Polizas');
          if(ws) {
            const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
            for(let i = 1; i < rows.length; i++) {
              const r = rows[i]; const pid = Number(r[0]); const cid = Number(r[1]); if(!cid) continue;
              if(pid) {
                const p = D.pl.find(x => x.id==pid);
                if(p) { if(r[5]!=='') p.nombre=String(r[5]); if(r[6]) p.finicio=xlDate(r[6]); if(r[7]) p.ffin=xlDate(r[7]); if(r[10]!=='') p.obs=String(r[10]); cambios++; resumen.polizas++; }
              } else {
                const nombre = String(r[5]||'').trim(); const ffin = r[7]?xlDate(r[7]):'';
                if(nombre && ffin && D.ct.find(x => x.id==cid)) { D.pl.push({id:Date.now()+Math.random(),cid,nombre,finicio:r[6]?xlDate(r[6]):'',ffin,obs:String(r[10]||'')}); cambios++; resumen.polizas++; }
              }
            }
          }
        }

        // Hoja PAGOS (del exportador EDESO)
        {
          const ws = getSheet('Pagos');
          if(ws) {
            const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
            for(let i = 1; i < rows.length; i++) {
              const r   = rows[i];
              const cid = Number(r[1]); if(!cid) continue;
              const num = String(r[6]||'').trim();
              const fecha = r[7] ? xlDate(r[7]) : ''; if(!fecha) continue;
              const valor = Number(r[8])||0;       if(!valor) continue;
              const obs   = String(r[11]||'').trim();
              const existe = num && D.pa.find(function(p){ return p.cid==cid && (p.num||'')===num; });
              if(!existe) { D.pa.push({id:Date.now()+Math.random(),cid,num,fecha,valor,obs}); cambios++; resumen.pagos++; }
            }
          }
        }

        save(); render();
        let msg = 'Excel EDESO importado — ' + cambios + ' registros actualizados/creados';
        if(errores.length) msg += ' (' + errores.length + ' advertencias)';
        toast(msg);
        if(errores.length) console.warn('EDESO Excel import warnings:', errores);
      }

    } catch(err) {
      toast('Error al leer el Excel. Verifica el formato del archivo.', true);
      console.error('Excel import error:', err);
    }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}

// Convierte fecha de Excel (puede ser Date obj, string, o número) a 'YYYY-MM-DD'
function xlDate(v) {
  function isoDateLocal(dt) {
    return String(dt.getFullYear())+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  }
  if(!v) return '';
  if(v instanceof Date) {
    return isoDateLocal(v);
  }
  if(typeof v === 'number') {
    if(typeof XLSX !== 'undefined' && XLSX.SSF && typeof XLSX.SSF.parse_date_code === 'function') {
      const d = XLSX.SSF.parse_date_code(v);
      if(d) return String(d.y)+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');
    }
    return '';
  }
  const s = String(v).trim();
  // Si ya es YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // Si es DD/MM/YYYY
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) {
    const [d,m,y] = s.split('/');
    return `${y}-${m}-${d}`;
  }
  // Intento genérico
  const dt = new Date(s);
  if(!isNaN(dt)) return isoDateLocal(dt);
  return '';
}

<script>
// ═══════════════════════════════════════════════════════
// GENERAR PLANTILLA SEMANAL CON CONTRATOS PRECARGADOS
// ═══════════════════════════════════════════════════════
function generarPlantilla() {
  if(typeof XLSX === 'undefined') { toast('Librería Excel no cargada', true); return; }
  if(!D.ct.length) { toast('No hay contratos registrados en el sistema.', true); return; }
  if(!D.sv.length) { toast('No hay supervisores registrados. Agrega supervisores primero.', true); return; }

  var hoy = today();
  var fechaViernesProx = (function() {
    var d = new Date(), dia = d.getDay();
    var diff = dia === 5 ? 0 : (5 - dia + 7) % 7 || 7;
    d.setDate(d.getDate() + diff);
    return d.toISOString().slice(0,10);
  })();

  // ── Helpers de estilo ────────────────────────────────
  function hFont(color, sz, bold, italic) {
    return { name:'Arial', sz:sz||10, bold:!!bold, italic:!!italic, color:{rgb: color||'000000'} };
  }
  function hFill(rgb) { return { patternType:'solid', fgColor:{rgb:rgb||'FFFFFF'} }; }
  function hAlign(h, wrap) { return { horizontal:h||'left', vertical:'center', wrapText:!!wrap }; }
  function hBorder() { var s={style:'thin',color:{rgb:'DDE2EC'}}; return {top:s,bottom:s,left:s,right:s}; }
  function enc(c,r) { return XLSX.utils.encode_cell({c:c,r:r}); }

  function applyCell(ws, addr, value, fill_rgb, font_color, sz, bold, halign, wrap, italic) {
    ws[addr] = {
      v: value===undefined||value===null ? '' : value,
      t: typeof value==='number' ? 'n' : 's',
      s: {
        fill: hFill(fill_rgb||'FFFFFF'),
        font: hFont(font_color, sz||10, bold, italic),
        alignment: hAlign(halign||'left', wrap),
        border: hBorder()
      }
    };
  }

  function banner(ws, ref, text, fill_rgb, sz) {
    ws[ref] = { v:text, t:'s', s:{
      fill: hFill(fill_rgb||'C8232A'),
      font: hFont('FFFFFF', sz||13, true),
      alignment: hAlign('center'),
      border: {top:{style:'medium',color:{rgb:'1A2035'}},bottom:{style:'medium',color:{rgb:'1A2035'}},left:{style:'medium',color:{rgb:'1A2035'}},right:{style:'medium',color:{rgb:'1A2035'}}}
    }};
  }

  function colHd(ws, ref, text, fill_rgb) {
    ws[ref] = { v:text, t:'s', s:{
      fill: hFill(fill_rgb||'DBEAFE'),
      font: hFont('1A2035', 9, true),
      alignment: hAlign('center', true),
      border: hBorder()
    }};
  }

  // ── Función que construye una hoja para un supervisor ─
  function makeSheet(opts, svNombre, cts) {
    var ws = {};
    var extraHds = opts.extraHds;
    var totalCols = 3 + extraHds.length; // ID, No.Contrato, Objeto + extras
    var nRows = cts.length;

    // Merges
    ws['!merges'] = [
      {s:{c:1,r:0},e:{c:totalCols,r:0}},
      {s:{c:1,r:1},e:{c:totalCols,r:1}},
      {s:{c:1,r:2},e:{c:2,r:2}},
      {s:{c:3,r:2},e:{c:totalCols,r:2}}
    ];

    banner(ws, enc(1,0), 'EDESO · ' + opts.title, opts.fillHd, 12);
    banner(ws, enc(1,1), 'Supervisor: ' + svNombre + '  ·  ' + cts.length + ' contrato(s)  ·  Semana del viernes:', opts.fillHd, 9);
    if(ws[enc(1,1)]) ws[enc(1,1)].s.font = hFont('FFFFFF', 9, false, true);

    // Fila 3: Semana
    ws[enc(1,2)] = {v:'Supervisor:', t:'s', s:{fill:hFill('FFFFFF'), font:hFont('1A2035',10,true), alignment:hAlign('right')}};
    applyCell(ws, enc(2,2), svNombre, 'FEF3C7', 'D97706', 10, true, 'left');
    ws[enc(3,2)] = {v:'Fecha del viernes:', t:'s', s:{fill:hFill('FFFFFF'), font:hFont('1A2035',10,true), alignment:hAlign('right')}};
    applyCell(ws, enc(4,2), fechaViernesProx, 'FEF3C7', 'D97706', 10, true, 'center');

    // Fila 4 vacía
    // Fila 5: encabezados (row index 4)
    var hdLabels = ['ID Contrato *', 'No. Contrato', 'Objeto'].concat(extraHds);
    hdLabels.forEach(function(lbl, ci) {
      colHd(ws, enc(ci+1, 4), lbl, opts.fillHdLight || 'DBEAFE');
    });

    // Datos
    var dataStart = 5;
    var r = dataStart;

    cts.forEach(function(ct, ctIdx) {
      var extraData = opts.dataRows(ct, ctIdx);
      var rows2d = Array.isArray(extraData[0]) ? extraData : [extraData];

      rows2d.forEach(function(rowData, ri) {
        var bg = r % 2 === 0 ? 'F5F7FB' : 'FFFFFF';
        applyCell(ws, enc(1,r), ct.id,            bg, '1A2035', 10, true,  'center');
        applyCell(ws, enc(2,r), ri===0?ct.num||'':'', bg, '374151', 10, false, 'left');
        applyCell(ws, enc(3,r), ri===0?(ct.obj||'').substring(0,80):'', bg, '374151', 10, false, 'left', true);
        rowData.forEach(function(val, ci) {
          applyCell(ws, enc(4+ci, r), val, bg, '374151', 10, false, 'left');
        });
        r++;
      });
    });

    // Nota al pie
    ws['!merges'].push({s:{c:1,r:r+1},e:{c:totalCols,r:r+1}});
    ws[enc(1,r+1)] = {v: opts.noteText||'(*) No modifiques la columna ID Contrato.', t:'s', s:{
      fill:hFill('F5F7FB'), font:hFont('6B7A99',9,false,true), alignment:hAlign('left',true), border:{}
    }};

    ws['!ref'] = enc(0,0) + ':' + enc(totalCols+1, r+2);

    // Anchos
    var colWidths = [{wch:2},{wch:16},{wch:18},{wch:52}];
    opts.colWidths.forEach(function(w){ colWidths.push({wch:w}); });
    ws['!cols'] = colWidths;

    // Alturas
    var rowH = [{hpt:8},{hpt:30},{hpt:16},{hpt:22},{hpt:6},{hpt:36}];
    for(var i=0;i<r+4;i++) rowH.push({hpt:20});
    ws['!rows'] = rowH;

    return ws;
  }

  // ── Generar un Excel por supervisor ─────────────────
  var generados = 0;
  var sinContratos = [];

  D.sv.forEach(function(sv) {
    // Contratos raíz asignados a este supervisor
    var ctsSv = D.ct.filter(function(c){ return c.svid == sv.id; });  // raíz y derivados
    if(!ctsSv.length) { sinContratos.push(sv.nombre); return; }

    var wb = XLSX.utils.book_new();
    var svNombre = sv.nombre;
    var nCt = ctsSv.length;

    // ── INSTRUCCIONES ──
    (function() {
      var ws = {};
      ws['!ref'] = 'A1:D20';
      ws['!cols'] = [{wch:2},{wch:28},{wch:58}];
      ws['!merges'] = [{s:{c:1,r:1},e:{c:3,r:1}},{s:{c:1,r:2},e:{c:3,r:2}}];
      banner(ws, 'B2', 'EDESO · PLANTILLA SEMANAL — ' + svNombre, 'C8232A', 12);
      banner(ws, 'B3', nCt + ' contrato(s) asignados · Enviar cada viernes antes de las 5 PM', 'FEE2E2', 9);
      if(ws['B3']) ws['B3'].s.font = hFont('C8232A',9,false,true);

      var instrRows = [
        [5, 'NO modifiques', 'La columna "ID Contrato" — es la clave del sistema'],
        [6, 'Campos con (*)', 'Son obligatorios'],
        [7, 'Fechas', 'Formato AAAA-MM-DD · Ej: ' + hoy],
        [8, 'Valores $', 'Solo números sin puntos ni comas · Ej: 5000000'],
        [9, 'Avance %', '% ACUMULADO total a la fecha, no solo el de esta semana'],
        [10,'Llenar solo', 'Las hojas que apliquen esa semana'],
      ];
      instrRows.forEach(function(row) {
        var r=row[0]-1, lbl=row[1], desc=row[2];
        ws[enc(1,r)] = {v:lbl, t:'s', s:{fill:hFill('FFFFFF'),font:hFont('C8232A',10,true),alignment:hAlign('right')}};
        ws[enc(2,r)] = {v:desc, t:'s', s:{fill:hFill('FFFFFF'),font:hFont('000000',10),alignment:hAlign('left',true)}};
      });
      XLSX.utils.book_append_sheet(wb, ws, '📋 INSTRUCCIONES');
    })();

    // ── AVANCE ──
    XLSX.utils.book_append_sheet(wb, makeSheet({
      title: 'AVANCE DE CONTRATOS',
      fillHd: '2563EB', fillHdLight: 'DBEAFE',
      extraHds: ['Actividad / Ítem', '% Avance anterior', '% Avance actual * (acumulado)', 'Estado', 'Observaciones'],
      colWidths: [38, 18, 22, 20, 44],
      dataRows: function(ct) {
        var acRaiz = D.ac.filter(function(a){ return a.cid==ct.id && !a.pid; });
        if(!acRaiz.length) return [['(general)', '', ct.pr||0, 'En ejecución', '']];
        return acRaiz.map(function(a){ return [a.nombre||'', '', a.pr||0, 'En ejecución', '']; });
      },
      noteText: '(*) "% Avance actual" = porcentaje ACUMULADO total. No modifiques ID Contrato.'
    }, svNombre, ctsSv), '📊 AVANCE');

    // ── PAGOS ──
    XLSX.utils.book_append_sheet(wb, makeSheet({
      title: 'PAGOS',
      fillHd: '16A34A', fillHdLight: 'DCFCE7',
      extraHds: ['No. Pago *', 'Fecha pago * (AAAA-MM-DD)', 'Valor pagado * ($)', 'Observaciones'],
      colWidths: [18, 22, 20, 50],
      dataRows: function(ct) {
        var n = D.pa.filter(function(p){ return p.cid==ct.id; }).length;
        return [['Pago No.'+(n+1), '', '', '']];
      },
      noteText: '(*) Valor: solo números sin puntos ni comas. No modifiques ID Contrato.'
    }, svNombre, ctsSv), '💰 PAGOS');

    // ── PRÓRROGAS ──
    XLSX.utils.book_append_sheet(wb, makeSheet({
      title: 'PRÓRROGAS',
      fillHd: 'D97706', fillHdLight: 'FEF3C7',
      extraHds: ['Fecha fin actual', 'Nueva fecha fin * (AAAA-MM-DD)', 'No. Prórroga', 'Justificación *'],
      colWidths: [18, 22, 14, 50],
      dataRows: function(ct) {
        var n = D.pr.filter(function(p){ return p.cid==ct.id; }).length;
        return [[ct.fend||'', '', 'Prórroga '+(n+1), '']];
      },
      noteText: '(*) Fechas en formato AAAA-MM-DD. No modifiques ID Contrato.'
    }, svNombre, ctsSv), '📅 PRÓRROGAS');

    // ── ADICIONES ──
    XLSX.utils.book_append_sheet(wb, makeSheet({
      title: 'ADICIONES EN VALOR',
      fillHd: 'D97706', fillHdLight: 'FEF3C7',
      extraHds: ['No. Adición *', 'Valor adición * ($)', 'Fecha (AAAA-MM-DD)', 'Justificación'],
      colWidths: [16, 20, 22, 50],
      dataRows: function(ct) {
        var n = D.ad.filter(function(a){ return a.cid==ct.id; }).length;
        return [['Adición '+(n+1), '', '', '']];
      },
      noteText: '(*) Solo el valor de la adición, sin el valor original. No modifiques ID Contrato.'
    }, svNombre, ctsSv), '➕ ADICIONES');

    // ── SUSPENSIONES ──
    XLSX.utils.book_append_sheet(wb, makeSheet({
      title: 'SUSPENSIONES',
      fillHd: '7C3AED', fillHdLight: 'EDE9FE',
      extraHds: ['Tipo', 'Fecha * (AAAA-MM-DD)', 'Fecha reinicio (si ya se reinició)', 'Causal'],
      colWidths: [22, 22, 26, 44],
      dataRows: function(ct) {
        var suActiva = D.su.find(function(s){ return s.cid==ct.id && !s.freinicio; });
        return [[suActiva?'Reinicio':'Suspensión', '', '', '']];
      },
      noteText: '(*) Si ya se reinició completa ambas fechas. No modifiques ID Contrato.'
    }, svNombre, ctsSv), '⏸ SUSPENSIONES');

    // ── OBSERVACIONES ──
    XLSX.utils.book_append_sheet(wb, makeSheet({
      title: 'OBSERVACIONES Y ALERTAS',
      fillHd: '1A2035', fillHdLight: 'F0F3F8',
      extraHds: ['Tipo de alerta', 'Nivel', 'Descripción / Acción requerida *'],
      colWidths: [28, 18, 60],
      dataRows: function() { return [['Alerta general', '🟢 Informativo', '']]; },
      noteText: '🔴 Crítico = acción inmediata · 🟡 Medio · 🟢 Informativo. No modifiques ID Contrato.'
    }, svNombre, ctsSv), '📝 OBSERVACIONES');

    // ── Descargar ──
    var nombreArchivo = svNombre.replace(/[^a-zA-Z0-9ñáéíóúÁÉÍÓÚ\s]/g,'').replace(/\s+/g,'_');
    XLSX.writeFile(wb, 'EDESO_' + hoy + '_' + nombreArchivo + '.xlsx');
    generados++;
  });

  // Resumen
  if(generados === 0) {
    toast('Ningún supervisor tiene contratos asignados. Asigna contratos primero.', true);
  } else {
    var msg = generados + ' plantilla(s) descargada(s)';
    if(sinContratos.length) msg += ' · Sin contratos: ' + sinContratos.join(', ');
    toast('✅ ' + msg);
  }
}
</script>
